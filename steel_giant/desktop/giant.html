<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стальной гигант</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
/* ---------- constants ---------- */
const OMEGA=3.6, VF=260;
const SIZES={small:0.4,medium:0.55,large:0.75};
let SC=SIZES.medium, VW=34*SC*OMEGA, ds=1;
const R={thigh:52,shin:76,upper:55,fore:70,hipY:10,footH:16,shoulderY:-128};
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const api=window.giant||null;
/* ---------- poses ---------- */
function walkPose(p,amp,clock){
  const s=Math.sin(p),c=Math.cos(p),br=Math.sin(clock*1.6)*0.03*(1-amp);
  return{thighN:-0.42*s*amp,kneeN:0.08+0.72*Math.max(0,c)*amp,thighF:0.42*s*amp,kneeF:0.08+0.72*Math.max(0,-c)*amp,
    armN:0.34*s*amp+br,elbowN:-0.3-br,armF:-0.34*s*amp-br,elbowF:-0.3+br,tilt:0.04+0.02*Math.sin(2*p)*amp,point:0};
}
const CROUCH={thighN:-0.75,kneeN:1.35,thighF:-0.6,kneeF:1.2,armN:0.35,elbowN:-0.6,armF:0.5,elbowF:-0.6,tilt:0.25,point:0};
const HOVER={thighN:0.05,kneeN:0.14,thighF:-0.06,kneeF:0.2,armN:0.28,elbowN:-0.35,armF:0.34,elbowF:-0.4,tilt:0.06,point:0.5};
function flyPose(t){
  return{thighN:0.15+0.05*Math.sin(t*3),kneeN:0.1,thighF:0.28+0.05*Math.sin(t*3+1),kneeF:0.22,
    armN:-3.1,elbowN:0.1,armF:0.55,elbowF:-0.25,tilt:0.85+0.05*Math.sin(t*1.8),point:1};
}
function lerpPose(a,b,k){const o={};for(const key in a)o[key]=a[key]+(b[key]-a[key])*k;return o}
const footDrop=(t,k,tilt)=>R.hipY+R.thigh*Math.cos(tilt+t)+R.shin*Math.cos(tilt+t+k)+R.footH;

/* ---------- robot drawing: faceted chest, stacked-disc waist, bullet head ---------- */
const FILL={
  body:'grad', bodyFar:'gradFar', head:'gradHead',
  dark:'#2d3034', darkFar:'#1f2124', ring:'gradRing', ringFar:'gradRingFar',
  joint:'#6e747b', jointFar:'#4a4f55',
  facet:'rgba(255,255,255,.12)', facetFar:'rgba(255,255,255,.05)', shade:'rgba(0,0,0,.22)', shadeFar:'rgba(0,0,0,.25)',
  eye:'#ffc233', eyeFar:'#d99a1f', flameOut:'#ff7a1a', flameIn:'#fff1a8'
};
const GRADS={grad:['#4a4f55','#a2a8ae','#5f656c'],gradFar:['#30343a','#60656b','#3e4247'],gradHead:['#575c62','#b4babf','#6a7077'],
  gradRing:['#1c1e21','#5d6268','#26292d'],gradRingFar:['#141518','#3a3e43','#1a1c1f']};
let emitPts=[],EYE_GLOW='#ffae00';
function capsule(ctx,len,r1,r2=r1){ctx.beginPath();ctx.arc(0,0,r1,Math.PI,0);ctx.lineTo(r2,len);ctx.arc(0,len,r2,0,Math.PI);ctx.closePath()}
function circle(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function poly(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()}
function paint(ctx,role,far,bb){
  let f=(far&&FILL[role+'Far'])||FILL[role];
  if(GRADS[f]){const b=bb||{x:-10,w:20},c=GRADS[f],g=ctx.createLinearGradient(b.x,0,b.x+b.w,0);metalStops(g,f,c);f=g}
  ctx.save();if(role==='eye'){ctx.shadowColor=EYE_GLOW;ctx.shadowBlur=far?8:18}
  ctx.fillStyle=f;ctx.fill();ctx.restore();
  if(role==='flameOut'||role==='flameIn')return;
  if(role==='facet'||role==='shade'){ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.stroke();return}
  ctx.strokeStyle='rgba(10,11,13,.85)';ctx.lineWidth=1.5;ctx.stroke();
}
function detail(ctx,far,fn){ctx.save();ctx.strokeStyle=far?'rgba(10,12,15,.3)':'rgba(10,12,15,.5)';ctx.lineWidth=1.2;ctx.beginPath();fn();ctx.stroke();ctx.restore()}
function shine(ctx,fn,a=0.32){ctx.save();ctx.strokeStyle='rgba(235,242,250,'+a+')';ctx.lineWidth=1.8;ctx.beginPath();fn();ctx.stroke();ctx.restore()}
function rivets(ctx,pts,far){ctx.save();ctx.fillStyle=far?'#25282c':'#3a3e43';for(const p of pts){circle(ctx,p[0],p[1],1.5);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.35)';for(const p of pts){circle(ctx,p[0]+0.4,p[1]-0.4,0.6);ctx.fill()}ctx.restore()}
function teardrop(ctx,w,L){ctx.beginPath();ctx.moveTo(-w,0);ctx.quadraticCurveTo(-w*0.7,L*0.55,0,L);ctx.quadraticCurveTo(w*0.7,L*0.55,w,0);ctx.closePath()}
/* layered jet flame: unit-length gradients are built once and stretched per frame */
let FLAME_G=null;
function flameGrads(ctx){
  const lg=st=>{const g=ctx.createLinearGradient(0,0,0,1);for(const s of st)g.addColorStop(s[0],s[1]);return g};
  return{c:ctx,out:lg([[0,'rgba(255,185,90,.95)'],[0.3,'rgba(255,115,30,.8)'],[0.7,'rgba(215,55,12,.32)'],[1,'rgba(150,25,0,0)']]),
    mid:lg([[0,'rgba(255,248,200,1)'],[0.45,'rgba(255,195,75,.85)'],[1,'rgba(255,120,25,0)']]),
    core:lg([[0,'rgba(205,232,255,1)'],[0.35,'rgba(255,255,240,.95)'],[1,'rgba(255,235,160,0)']])};
}
function flame(ctx,a,far){
  const fl=0.9+0.2*Math.random(),L=(38+14*Math.random())*a,al=far?0.72:1;
  if(!FLAME_G||FLAME_G.c!==ctx)FLAME_G=flameGrads(ctx);
  ctx.save();ctx.translate(8,R.footH+1);ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.55*al*fl;ctx.drawImage(SPR.fire,-26*a,-20*a,52*a,52*a);
  ctx.save();ctx.scale(a,L);ctx.globalAlpha=al;
  ctx.fillStyle=FLAME_G.out;teardrop(ctx,12.5*fl,1);ctx.fill();
  ctx.fillStyle=FLAME_G.mid;teardrop(ctx,7.5,0.74*fl);ctx.fill();
  ctx.fillStyle=FLAME_G.core;teardrop(ctx,3.8,0.42);ctx.fill();
  ctx.restore();
  ctx.globalAlpha=0.55*al;for(const k of [0.22,0.4])ctx.drawImage(SPR.glow,-4.5*a,L*k-3*a,9*a,6*a);
  const m=ctx.getTransform();emitPts.push({p:m.transformPoint(new DOMPoint(0,L*0.75)),a});
  ctx.restore();
}
/* hexagonal prism limb along +y: narrow at the joint, wide in the middle */
function prism(ctx,len,w0,wMid,w1,midAt,far){
  const m=len*midAt;
  poly(ctx,[[-w0,0],[w0,0],[wMid,m],[w1,len-4],[w1*0.6,len],[-w1*0.6,len],[-w1,len-4],[-wMid,m]]);paint(ctx,'body',far,{x:-wMid,w:wMid*2});
  poly(ctx,[[-w0*0.3,2],[w0*0.5,2],[wMid*0.45,m],[w1*0.4,len-5],[-w1*0.15,len-5],[-wMid*0.2,m]]);paint(ctx,'facet',far);
  poly(ctx,[[-wMid,m],[-wMid*0.55,m],[-w1*0.6,len-4],[-w1,len-4]]);paint(ctx,'shade',far);
}
function boot(ctx,far){
  rrect(ctx,-8,-3,16,7,2);paint(ctx,'ring',far,{x:-8,w:16});
  ctx.beginPath();ctx.moveTo(-15,3);ctx.lineTo(14,3);ctx.quadraticCurveTo(31,4,33,12);ctx.lineTo(33,R.footH);ctx.lineTo(-16,R.footH);ctx.quadraticCurveTo(-19,8,-15,3);
  paint(ctx,'body',far,{x:-18,w:52});
  detail(ctx,far,()=>{ctx.moveTo(-15,R.footH-4);ctx.lineTo(32,R.footH-4);ctx.moveTo(15,4);ctx.quadraticCurveTo(22,7,22,R.footH-4)});
  shine(ctx,()=>{ctx.moveTo(-10,6);ctx.lineTo(12,6)},0.25);
}
function hand(ctx,far,spread){
  rrect(ctx,-5,-2,10,6,2);paint(ctx,'ring',far,{x:-5,w:10});
  rrect(ctx,-7,3,14,11,3);paint(ctx,'body',far,{x:-7,w:14});
  for(const fx of [-4.5,0,4.5]){ctx.save();ctx.translate(fx,13);ctx.rotate(fx*0.05*spread);capsule(ctx,10,2,1.8);paint(ctx,'dark',far,{x:-2,w:4});ctx.translate(0,10);ctx.rotate(0.25);capsule(ctx,8,1.8,1.5);paint(ctx,'dark',far,{x:-2,w:4});ctx.restore()}
  ctx.save();ctx.translate(7,7);ctx.rotate(-0.6);capsule(ctx,10,2,1.8);paint(ctx,'dark',far,{x:-2,w:4});ctx.restore();
}
/* every rigid part is drawn through part(): normally it just draws,
   in capture mode it records its transform so the giant can fall apart */
let REC=null;
function part(ctx,id,pv,hh,fn){if(REC){REC.push({id,m:ctx.getTransform(),pv,hh,fn});return}fn(ctx)}
function leg(ctx,th,kn,P,fl,far,ox){
  const ft=-(P.tilt+th+kn)*(1-P.point)+P.point*0.55;
  ctx.save();ctx.translate(ox,R.hipY);ctx.rotate(th);
  part(ctx,'thigh',[0,R.thigh/2],9,ctx=>{
    capsule(ctx,R.thigh,5,4.5);paint(ctx,'ring',far,{x:-5,w:10});
    shine(ctx,()=>{ctx.moveTo(1.5,16);ctx.lineTo(1.5,R.thigh-8)},0.2);
    ctx.beginPath();ctx.arc(0,2,15,Math.PI*0.95,Math.PI*2.05);ctx.lineTo(13,10);ctx.quadraticCurveTo(0,16,-13,10);ctx.closePath();paint(ctx,'body',far,{x:-15,w:30});
    shine(ctx,()=>{ctx.arc(0,2,10,Math.PI*1.15,Math.PI*1.55)});
    rivets(ctx,[[-11,6],[0,9],[11,6]],far);
  });
  ctx.translate(0,R.thigh);
  ctx.rotate(kn);
  part(ctx,'shin',[0,R.shin/2],12,ctx=>{
    prism(ctx,R.shin,7,13,10,0.55,far);
    detail(ctx,far,()=>{ctx.moveTo(-12,R.shin*0.55+6);ctx.lineTo(12,R.shin*0.55+6)});
    rivets(ctx,[[-6,R.shin*0.55+10],[0,R.shin*0.55+11],[6,R.shin*0.55+10]],far);
    circle(ctx,0,0,7.5);paint(ctx,'joint',far);circle(ctx,0,0,3);paint(ctx,'dark',far);
  });
  ctx.translate(0,R.shin);
  ctx.rotate(ft);
  if(fl>0.01&&!REC)flame(ctx,fl,far);
  part(ctx,'foot',[8,9],8,ctx=>boot(ctx,far));
  ctx.restore();
}
function arm(ctx,a,e,far,gun=0){
  gun=gun||0;
  ctx.save();ctx.translate(far?-6:2,R.shoulderY);ctx.rotate(a);
  ctx.save();ctx.translate(0,R.upper);
  ctx.rotate(e);
  part(ctx,'fore',[0,R.fore/2+8],11,ctx=>{
    prism(ctx,R.fore,6,12,9,0.32,far);
    rivets(ctx,[[-4,R.fore*0.32+4],[4,R.fore*0.32+4]],far);
    ctx.save();ctx.translate(0,R.fore);
    if(gun>0.02){
      const L=10+28*gun;
      rrect(ctx,-6.5,-2,13,L,4);paint(ctx,'ring',far,{x:-7,w:13});
      rrect(ctx,-9,L-8,18,9,3);paint(ctx,'joint',far,{x:-9,w:18});
      detail(ctx,far,()=>{ctx.moveTo(-3,4);ctx.lineTo(-3,L-10);ctx.moveTo(3,4);ctx.lineTo(3,L-10)});
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(130,225,255,'+(0.3+0.6*gun)+')';ctx.shadowColor='#7fe0ff';ctx.shadowBlur=12;circle(ctx,0,L+1,5*gun);ctx.fill();ctx.restore();
    }else hand(ctx,far,1);
    ctx.restore();
  });
  ctx.restore();
  part(ctx,'upper',[0,18],16,ctx=>{
    capsule(ctx,R.upper,4.5,4.5);paint(ctx,'ring',far,{x:-5,w:10});
    circle(ctx,0,R.upper,6);paint(ctx,'joint',far);
    rrect(ctx,-20,-17,40,34,15);paint(ctx,'body',far,{x:-20,w:40});
    poly(ctx,[[-10,-12],[8,-12],[12,-4],[-6,-4]]);paint(ctx,'facet',far);
    detail(ctx,far,()=>{ctx.moveTo(-16,6);ctx.lineTo(16,6)});
    rivets(ctx,[[-11,10],[0,10],[11,10]],far);
  });
  ctx.restore();
}
const HEAD_X=12,HEAD_Y=-141,EYE_N=[HEAD_X+13,HEAD_Y-22],EYE_F=[HEAD_X+6,HEAD_Y-22];
function head(ctx,P){
  const blink=P.blink;
  part(ctx,'head',[HEAD_X+1,HEAD_Y-22],18,ctx=>{
    ctx.save();ctx.translate(HEAD_X,HEAD_Y);
    rrect(ctx,-6,-6,12,10,2);paint(ctx,'ring',false,{x:-6,w:12});
    ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-14,-26);ctx.bezierCurveTo(-14,-40,-6,-45,1,-45);ctx.bezierCurveTo(10,-45,16,-38,16,-26);ctx.lineTo(16,-8);ctx.quadraticCurveTo(15,0,9,1);ctx.closePath();
    paint(ctx,'head',false,{x:-14,w:30});
    poly(ctx,[[2,-41],[12,-36],[14,-28],[14,-12],[8,-12],[6,-30]]);paint(ctx,'facet');
    shine(ctx,()=>{ctx.moveTo(-8,-34);ctx.quadraticCurveTo(-2,-42,6,-42)});
    detail(ctx,false,()=>{ctx.moveTo(-14,-27);ctx.quadraticCurveTo(2,-31,16,-28);ctx.moveTo(1,-45);ctx.quadraticCurveTo(-6,-36,-10,-27);
      for(let gx=4;gx<=13;gx+=3){ctx.moveTo(gx,-14);ctx.lineTo(gx,-3)}});
    circle(ctx,-4,-17,4);paint(ctx,'joint');
    const ry=4.2*blink;
    ctx.beginPath();ctx.ellipse(EYE_F[0]-HEAD_X,EYE_F[1]-HEAD_Y,2.4,Math.max(0.6,ry*0.9),0,0,Math.PI*2);paint(ctx,'eye',true);
    ctx.beginPath();ctx.ellipse(EYE_N[0]-HEAD_X,EYE_N[1]-HEAD_Y,3.8,Math.max(0.8,ry),0,0,Math.PI*2);paint(ctx,'eye');
    ctx.restore();
  });
}
function waist(ctx){
  part(ctx,'waist',[2,-18],16,ctx=>{
    const rings=[[-46,48,6],[-40,38,7],[-33,32,7],[-26,36,7]];
    for(const [y,w,h] of rings){rrect(ctx,-w/2+2,y,w,h,3);paint(ctx,'ring',false,{x:-w/2,w:w})}
    rrect(ctx,-27,-20,58,11,4);paint(ctx,'ring',false,{x:-27,w:58});
    rivets(ctx,[[-20,-14.5],[-10,-14.5],[0,-14.5],[10,-14.5],[20,-14.5]]);
    rrect(ctx,-12,-10,26,20,5);paint(ctx,'dark',false,{x:-12,w:26});
  });
}
const CHEST=[[-24,-148],[28,-150],[50,-132],[54,-86],[36,-50],[-16,-48],[-28,-72],[-32,-124]];
function torso(ctx){
  waist(ctx);
  part(ctx,'chest',[10,-100],38,ctx=>{
    poly(ctx,CHEST);paint(ctx,'body',false,{x:-32,w:86});
    poly(ctx,[[26,-148],[48,-131],[51,-88],[34,-54],[16,-54],[28,-90],[28,-128]]);paint(ctx,'facet');
    poly(ctx,[[-16,-48],[36,-50],[42,-62],[-22,-62]]);paint(ctx,'shade');
    detail(ctx,false,()=>{
      for(let i=0;i<6;i++){const x=-20+i*8;ctx.moveTo(x,-147);ctx.lineTo(x+8,-131)}
      ctx.moveTo(-31,-128);ctx.lineTo(46,-131);
      ctx.moveTo(-30,-96);ctx.lineTo(53,-96);
    });
    shine(ctx,()=>{ctx.moveTo(29,-148);ctx.lineTo(50,-131);ctx.lineTo(52,-88)});
    rivets(ctx,[[-20,-124],[-10,-125],[-6,-126],[6,-126],[18,-127],[30,-127],[-22,-92],[-10,-92],[2,-92],[18,-92],[34,-92],[38,-110],[38,-74]]);
  });
}
function drawRobot(ctx,P,fl,x,y,dir){
  ctx.save();ctx.translate(x,y);ctx.scale(dir*SC,SC);ctx.rotate(P.tilt);ctx.lineJoin='round';ctx.lineCap='round';
  arm(ctx,P.armF,P.elbowF,true);
  leg(ctx,P.thighF,P.kneeF,P,fl,true,-5);
  leg(ctx,P.thighN,P.kneeN,P,fl,false,5);
  if(!REC&&typeof bot!=='undefined'&&bot.turret>0.02)turret(ctx,bot.turret,bot.turretAng);
  head(ctx,P);torso(ctx);
  arm(ctx,P.armN,P.elbowN,false,typeof bot!=='undefined'?bot.armGun:0);
  ctx.restore();
}

/* shoulder rocket pod: rises out of the back of the shoulder */
const TURRET_X=-14,TURRET_Y=-136,TURRET_RISE=24;
function turret(ctx,k,ang){
  ctx.save();ctx.translate(TURRET_X,TURRET_Y-TURRET_RISE*k);
  rrect(ctx,-5,0,10,26,3);paint(ctx,'ring',false,{x:-5,w:10});
  ctx.rotate(ang);
  rrect(ctx,-9,-8,36,16,4);paint(ctx,'body',false,{x:-9,w:36});
  rrect(ctx,22,-8,7,16,2);paint(ctx,'dark',false,{x:22,w:7});
  ctx.fillStyle='#0a0b0d';circle(ctx,29,-3.6,2.6);ctx.fill();circle(ctx,29,3.6,2.6);ctx.fill();
  detail(ctx,false,()=>{ctx.moveTo(-2,-8);ctx.lineTo(-2,8);ctx.moveTo(6,-8);ctx.lineTo(6,8)});
  rivets(ctx,[[-5,-4],[-5,4],[14,-5],[14,5]]);
  circle(ctx,0,0,5);paint(ctx,'joint');
  ctx.restore();
}

/* front view: the giant turns to face the viewer */
function drawFront(ctx,x,y,sx,raise,clock,blink){
  ctx.save();ctx.translate(x,y);ctx.scale(SC*sx,SC);ctx.lineJoin='round';ctx.lineCap='round';
  const br=Math.sin(clock*1.6)*0.03;
  for(const s of [-1,1]){
    ctx.save();ctx.translate(s*20,R.hipY);
    capsule(ctx,R.thigh,5,4.5);paint(ctx,'ring',false,{x:-5,w:10});
    ctx.beginPath();ctx.arc(0,0,15,Math.PI*0.95,Math.PI*2.05);ctx.lineTo(13,8);ctx.quadraticCurveTo(0,14,-13,8);ctx.closePath();paint(ctx,'body',false,{x:-15,w:30});
    shine(ctx,()=>{ctx.arc(0,0,10,Math.PI*1.15,Math.PI*1.55)});
    ctx.translate(0,R.thigh);
    prism(ctx,R.shin,7,13,10,0.55,false);
    rivets(ctx,[[-6,R.shin*0.55+10],[0,R.shin*0.55+11],[6,R.shin*0.55+10]]);
    circle(ctx,0,0,7.5);paint(ctx,'joint');circle(ctx,0,0,3);paint(ctx,'dark');
    ctx.translate(0,R.shin);
    rrect(ctx,-8,-3,16,7,2);paint(ctx,'ring',false,{x:-8,w:16});
    ctx.beginPath();ctx.moveTo(-15+s*2,R.footH);ctx.lineTo(-15+s*2,8);ctx.quadraticCurveTo(-14+s*2,2,s*2,2);ctx.quadraticCurveTo(14+s*2,2,15+s*2,8);ctx.lineTo(15+s*2,R.footH);ctx.closePath();
    paint(ctx,'body',false,{x:-15,w:30});
    ctx.restore();
  }
  rrect(ctx,-14,-8,28,18,5);paint(ctx,'dark',false,{x:-14,w:28});
  const rings=[[-46,52,6],[-40,42,7],[-33,36,7],[-26,40,7]];
  for(const [yy,w,h] of rings){rrect(ctx,-w/2,yy,w,h,3);paint(ctx,'ring',false,{x:-w/2,w:w})}
  rrect(ctx,-32,-20,64,11,4);paint(ctx,'ring',false,{x:-32,w:64});
  rivets(ctx,[[-26,-14.5],[-16,-14.5],[-6,-14.5],[6,-14.5],[16,-14.5],[26,-14.5]]);
  rrect(ctx,-6,-158,12,12,2);paint(ctx,'ring',false,{x:-6,w:12});
  poly(ctx,[[-44,-148],[44,-148],[64,-128],[64,-92],[46,-56],[30,-46],[-30,-46],[-46,-56],[-64,-92],[-64,-128]]);paint(ctx,'body',false,{x:-64,w:128});
  poly(ctx,[[-40,-132],[40,-132],[52,-118],[52,-94],[38,-64],[-38,-64],[-52,-94],[-52,-118]]);paint(ctx,'facet');
  poly(ctx,[[-46,-56],[46,-56],[30,-46],[-30,-46]]);paint(ctx,'shade');
  detail(ctx,false,()=>{for(let i=0;i<11;i++){const xx=-40+i*8;ctx.moveTo(xx,-147);ctx.lineTo(xx+(xx<0?-6:6),-134)}});
  shine(ctx,()=>{ctx.moveTo(-40,-131);ctx.lineTo(40,-131)});
  rivets(ctx,[[-38,-126],[-24,-126],[-12,-126],[0,-126],[12,-126],[24,-126],[38,-126],[-48,-112],[48,-112],[-48,-98],[48,-98],[-34,-70],[-16,-68],[0,-68],[16,-68],[34,-70]]);
  ctx.save();ctx.translate(0,-148);ctx.rotate(Math.sin(clock*0.7)*0.03);
  ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-16,-28);ctx.bezierCurveTo(-16,-42,-8,-46,0,-46);ctx.bezierCurveTo(8,-46,16,-42,16,-28);ctx.lineTo(14,0);ctx.closePath();
  paint(ctx,'head',false,{x:-16,w:32});
  poly(ctx,[[-1,-45],[1,-45],[3,-30],[-3,-30]]);paint(ctx,'facet');
  shine(ctx,()=>{ctx.moveTo(-11,-34);ctx.quadraticCurveTo(-8,-42,-2,-44)});
  detail(ctx,false,()=>{ctx.moveTo(-16,-29);ctx.quadraticCurveTo(0,-33,16,-29);ctx.moveTo(0,-46);ctx.lineTo(0,-30);for(let gx=-6;gx<=6;gx+=3){ctx.moveTo(gx,-14);ctx.lineTo(gx,-3)}});
  circle(ctx,-15,-18,3.5);paint(ctx,'joint');circle(ctx,15,-18,3.5);paint(ctx,'joint');
  for(const ex of [-7,7]){ctx.beginPath();ctx.ellipse(ex,-22,4.2,Math.max(0.8,4.2*blink),0,0,Math.PI*2);paint(ctx,'eye')}
  ctx.restore();
  for(const s of [-1,1]){
    let a=-s*(0.16+br),e=s*0.06;
    if(s===1&&raise>0){a+=(-2.84-a)*raise;e+=(-0.3-e)*raise}
    ctx.save();ctx.translate(s*68,R.shoulderY);ctx.rotate(a);
    capsule(ctx,R.upper,4.5,4.5);paint(ctx,'ring',false,{x:-5,w:10});
    ctx.translate(0,R.upper);circle(ctx,0,0,6);paint(ctx,'joint');
    ctx.rotate(e);prism(ctx,R.fore,6,12,9,0.32,false);

    else hand(ctx,false,1.6);

    rivets(ctx,[[-11,10],[0,10],[11,10]]);ctx.restore();

/* ---------- particles: dust, smoke, sparks, fire, flashes, debris ---------- */
const parts=[];
function spawn(o){if(parts.length<1200)parts.push(o)}
function dustBurst(x,G,n,power){for(let i=0;i<n;i++){const d=Math.random()<0.5?-1:1;spawn({k:'dust',x:x+d*Math.random()*14,y:G-2,vx:d*(30+Math.random()*120)*power,vy:-(8+Math.random()*40)*power,life:0.9+Math.random()*0.8,max:1.7,r:3+Math.random()*4,grow:14})}}
function explosion(x,y,s){
  const r=Math.random;
  spawn({k:'flash',x,y,vx:0,vy:0,life:0.22,max:0.22,r:10*s,grow:300*s});
  for(let i=0;i<9;i++)spawn({k:'fire',x:x+(r()-0.5)*10*s,y:y+(r()-0.5)*10*s,vx:(r()-0.5)*140*s,vy:(r()-0.5)*140*s-20,life:0.35+r()*0.35,max:0.7,r:5*s,grow:30*s});
  for(let i=0;i<24;i++)spawn({k:'spark',x,y,vx:(r()-0.5)*560*s,vy:(r()-0.5)*560*s-80,life:0.4+r()*0.5,max:0.9,r:1,grow:0});
  for(let i=0;i<9;i++)spawn({k:'smoke',x:x+(r()-0.5)*12*s,y:y+(r()-0.5)*12*s,vx:(r()-0.5)*80,vy:(r()-0.5)*60-10,life:1.2+r(),max:2.2,r:6*s,grow:22*s});
  for(let i=0;i<8;i++)spawn({k:'debris',x,y,vx:(r()-0.5)*320*s,vy:-80-r()*220*s,life:1.6+r(),max:2.6,r:1.6+r()*2.4,grow:0,a:r()*6,va:(r()-0.5)*20});
  fxBoom(x,y,s);
}
function stepParts(dt,G){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.grow*dt;
    if(p.k==='spark'){p.vy+=260*dt;if(p.y>G){p.y=G;p.vy*=-0.35;p.vx*=0.6}}
    else if(p.k==='debris'){p.vy+=520*dt;p.a+=p.va*dt;if(p.y>G-1){p.y=G-1;p.vy*=-0.3;p.vx*=0.5;p.va*=0.5}}
    else if(p.k==='fire'){p.vx*=1-Math.min(1,dt*3);p.vy=p.vy*(1-Math.min(1,dt*3))-30*dt}
    else if(p.k==='flash'){}
    else{p.vx*=1-Math.min(1,dt*1.8);p.vy=p.vy*(1-Math.min(1,dt*1.5))-(p.k==='smoke'?14:4)*dt;if(p.y>G-1){p.y=G-1;p.vy=-Math.abs(p.vy)*0.2}}}
}
const ADDITIVE={spark:1,fire:1,flash:1};
function drawParts(ctx,additive){
  ctx.save();if(additive)ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const p of parts){if(!!ADDITIVE[p.k]!==additive)continue;const a=p.life/p.max;
    if(p.k==='spark'){ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,'+(110+Math.floor(140*a))+','+Math.floor(30+170*a*a)+','+Math.min(1,a*1.5)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.022,p.y-p.vy*0.022);ctx.stroke()}
    else if(p.k==='flash')sprite(ctx,SPR.glow,p.x,p.y,p.r*1.15,0,a)
    else if(p.k==='fire'){sprite(ctx,SPR.fire,p.x,p.y,p.r*1.25,0,a);if(a>0.6)sprite(ctx,SPR.glow,p.x,p.y,p.r*0.6,0,a-0.4)}
    else if(p.k==='debris'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.min(1,a*2);ctx.fillStyle='#24262b';ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.fillStyle='#8d939a';ctx.fillRect(-p.r,-p.r/2,p.r*2,Math.max(0.6,p.r*0.3));ctx.restore()}
    else if(p.k==='dust')sprite(ctx,SPR.dust[(p.tn??=Math.random()*2|0)],p.x,p.y,p.r*1.4,0,0.85*a);
    else{const tn=(p.tn??=Math.random()*3|0);sprite(ctx,SPR.smoke[Math.min(3,tn+(a<0.45?1:0))],p.x,p.y,p.r*1.45,0,0.9*a)}}
  ctx.restore();
}

/* ---------- robot state ---------- */
const bot={x:-250,vx:0,dir:1,p:0,amp:0,state:'fly',t:0,clock:0,alt:0,target:0,ramp:1,stepIdx:0,wave:0,
  view:0,vf:0,raise:0,hit:0,armAim:0,armGun:0,aimA:0,turret:0,turretAng:-0.5,eyeCharge:0,draw:null};
const events=[];
function update(s,c,dt,maxAlt){
  s.clock+=dt;s.t+=dt;s.wave=Math.max(0,s.wave-dt);s.hit=Math.max(0,s.hit-dt);
  if(s.state==='broken')return;
  if(Math.abs(c.h)>0.15)s.dir=Math.sign(c.h);
  else if(c.face)s.dir=c.face;
  if(c.faceForce)s.dir=c.faceForce;
  s.vf+=clamp(s.view-s.vf,-dt/0.55,dt/0.55);
  if(s.state==='ground'){
    s.vx+=(VW*c.h-s.vx)*Math.min(1,dt*4);
    const sp=Math.abs(s.vx)/VW;
    s.amp+=(Math.min(1,sp*1.2)-s.amp)*Math.min(1,dt*5);
    s.p+=OMEGA*sp*dt;
    const si=Math.floor(s.p/Math.PI);if(si!==s.stepIdx){s.stepIdx=si;if(s.amp>0.4)events.push('step')}
    if(c.up){s.state='launch';s.t=0}
  }else if(s.state==='launch'){
    s.vx*=1-Math.min(1,dt*3);
    if(s.t>0.5){s.state='fly';s.t=0;s.ramp=0;s.target=Math.min(maxAlt,70);events.push('liftoff')}
  }else if(s.state==='fly'){
    s.ramp=Math.min(1,s.ramp+dt/0.6);
    if(c.alt!=null)s.target=clamp(c.alt,0,maxAlt);
    s.target=Math.min(s.target,maxAlt);
    s.alt+=(s.target-s.alt)*Math.min(1,dt*1.8);
    s.vx+=(VF*c.h-s.vx)*Math.min(1,dt*1.6);
    if(s.target<=0&&s.alt<1.2){s.state='land';s.t=0;s.alt=0;s.target=0;events.push('land')}
  }else{
    s.vx*=1-Math.min(1,dt*5);
    if(s.t>0.55){s.state='ground';s.t=0;s.amp=0}
  }
  s.x+=s.vx*dt;
}
function poseOf(s){
  const ground=walkPose(s.p,s.amp,s.clock);
  const sf=Math.min(1,Math.abs(s.vx)/VF)*smooth(5,50,s.alt);
  const air=lerpPose(HOVER,flyPose(s.clock),sf);
  let P,flame=0;
  if(s.state==='ground')P=ground;
  else if(s.state==='launch'){P=lerpPose(ground,CROUCH,smooth(0,0.4,s.t));flame=smooth(0.25,0.5,s.t)}
  else if(s.state==='fly'){P=lerpPose(CROUCH,air,smooth(0,1,s.ramp));flame=0.75+0.25*clamp((s.target-s.alt)/20,0,1)}
  else{P=lerpPose(lerpPose(HOVER,CROUCH,smooth(0,0.12,s.t)),walkPose(0,0,s.clock),smooth(0.18,0.55,s.t));flame=1-smooth(0,0.15,s.t)}
  if(s.wave>0&&s.state==='ground'){
    const k=smooth(0,0.35,s.wave)*(1-s.amp),w=Math.sin(s.clock*9);
    P.armN+=(-2.75+0.3*w-P.armN)*k;P.elbowN+=(-0.55+0.45*w-P.elbowN)*k;
  }
  if(s.hit>0)P.tilt-=0.3*Math.sin(s.hit/0.5*Math.PI);
  P.blink=(s.clock%3.7)<0.12?0.12:1;
  return{P,flame};
}

/* ---------- geometry helpers: robot-local <-> screen ---------- */
function toWorld(lx,ly){const d=bot.draw,c=Math.cos(d.tilt),s=Math.sin(d.tilt);return{x:d.x+(lx*c-ly*s)*d.dir*SC,y:d.y+(lx*s+ly*c)*SC}}
function toLocalVec(vx,vy){const d=bot.draw,ux=vx/(d.dir*SC),uy=vy/SC,c=Math.cos(d.tilt),s=Math.sin(d.tilt);return{x:ux*c+uy*s,y:-ux*s+uy*c}}
function botCenter(){return bot.draw?toWorld(4,-90):{x:bot.x,y:G-150*SC}}

/* ---------- FPV drones ---------- */
const drones=[],bullets=[];
const BATTERY=['#e8b52a','#3a7bd5','#d6453d','#4caf50','#ff7f2a'];
function spawnDrone(){
  const side=Math.random()<0.5?-1:1;
  drones.push({x:side<0?-60:W+60,y:rand(0.08,0.45)*G,vx:-side*220*ds,vy:0,alive:true,state:'fly',t:0,
    th:Math.random()*6.28,om:(Math.random()<0.5?-1:1)*rand(0.5,1.0),rad:rand(190,330)*ds,diveIn:rand(4,10),
    seed:Math.random()*100,bat:BATTERY[Math.floor(Math.random()*BATTERY.length)],spin:0,vr:0,tilt:0});
}
function killDrone(d,mode){
  if(!d.alive)return;d.alive=false;
  if(mode==='wreck'){d.state='falling';d.vy=-90*ds;d.vx*=0.4;d.vr=(Math.random()-0.5)*16;explosion(d.x,d.y,0.4*ds)}
  else{explosion(d.x,d.y,ds);const i=drones.indexOf(d);if(i>=0)drones.splice(i,1)}
}
function updateDrones(dt){
  const c=botCenter();
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i];d.t+=dt;
    if(d.state==='falling'){
      d.vy+=520*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.spin+=d.vr*dt;
      if(Math.random()<0.7)spawn({k:'smoke',x:d.x,y:d.y,vx:(Math.random()-0.5)*20,vy:-10,life:1.2,max:1.2,r:3*ds,grow:14*ds});
      if(Math.random()<0.5)spawn({k:'fire',x:d.x,y:d.y,vx:0,vy:0,life:0.25,max:0.25,r:4*ds,grow:16*ds});
      if(d.y>=G-4){explosion(d.x,G-6,0.8*ds);drones.splice(i,1)}
      continue;
    }
    let tx,ty,maxV=300*ds;
    if(d.state==='dive'){tx=c.x;ty=c.y;maxV=(d.fatal?560:430)*ds;if(d.t>1.8&&!d.fatal){d.state='fly';d.t=0;d.diveIn=rand(4,9)}}
    else{
      d.th+=d.om*dt;tx=c.x+Math.cos(d.th)*d.rad;ty=clamp(c.y-60*ds+Math.sin(d.th)*d.rad*0.55,30,G-50);
      d.diveIn-=dt;if(d.diveIn<=0){d.state='dive';d.t=0}
    }
    let dvx=(tx-d.x)*1.8,dvy=(ty-d.y)*1.8;const m=Math.hypot(dvx,dvy);if(m>maxV){dvx*=maxV/m;dvy*=maxV/m}
    if(d.state!=='dive'){dvx+=Math.sin(d.t*3+d.seed)*40*ds;dvy+=Math.cos(d.t*2.3+d.seed)*30*ds}
    const a=Math.min(1,dt*(d.state==='dive'?3.5:2.2));d.vx+=(dvx-d.vx)*a;d.vy+=(dvy-d.vy)*a;
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.tilt=clamp(d.vx/(500*ds),-0.55,0.55);
    if(d.state==='dive'&&Math.hypot(d.x-c.x,d.y-c.y)<40*ds){
      drones.splice(i,1);
      if(d.fatal&&bot.state!=='broken'){breakApart(d.x,d.y);continue}
      explosion(d.x,d.y,ds);bot.hit=0.5;
    }
  }
}
function drawDrone(ctx,d,t){
  ctx.save();ctx.translate(d.x,d.y);
  if(d.state==='falling')ctx.rotate(d.spin);else ctx.rotate(d.tilt);
  ctx.scale(ds*(d.vx<0?-1:1),ds);ctx.lineCap='round';

  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(-15,-1);ctx.lineTo(15,-1);ctx.stroke();
  for(const px of [-16,16]){ctx.fillStyle='#2a2d33';ctx.beginPath();ctx.roundRect(px-3,-6,6,7,1.5);ctx.fill();
    ctx.fillStyle='#9097a0';ctx.fillRect(px-3,-6.2,6,1.4);ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(px-1.8,-4.6,1,5)}

      ctx.strokeStyle='rgba(28,30,34,.5)';ctx.lineWidth=0.9;ctx.beginPath();const k=Math.sin(t*47+px)*11;ctx.moveTo(px-k,-7);ctx.lineTo(px+k,-7);ctx.stroke();
      ctx.fillStyle='#b9c0c8';ctx.fillRect(px-0.8,-8.2,1.6,1.4)}

  ctx.fillStyle='#17181c';ctx.beginPath();ctx.roundRect(-11,-3,22,6,2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(-10,-2.6,20,1);
  ctx.fillStyle=d.bat;ctx.beginPath();ctx.roundRect(-8,-10,15,7,2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.roundRect(-7,-9.5,13,1.7,1);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-8,-5,15,2);
  ctx.fillStyle='#111';ctx.fillRect(-2,-10,2,7);
  ctx.fillStyle='#0d0d10';ctx.beginPath();ctx.roundRect(7,-7,7,8,2);ctx.fill();
  ctx.fillStyle='#1c2838';circle(ctx,12.4,-3,2.3);ctx.fill();ctx.fillStyle='#3f6694';circle(ctx,12.8,-3.2,1.2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';circle(ctx,13.3,-3.9,0.55);ctx.fill();

  ctx.fillStyle='#d6453d';circle(ctx,-15,-15,1.4);ctx.fill();
  const blink=Math.sin(t*10+d.seed)>0;
  ctx.fillStyle=blink?'#ff4040':'#551515';circle(ctx,-16,1.5,1.3);ctx.fill();
  ctx.fillStyle=blink?'#40ff70':'#155522';circle(ctx,16,1.5,1.3);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  if(live){sprite(ctx,SPR.red,9.2,-6,3.2,0,0.55+0.3*Math.sin(t*6+d.seed));if(blink){sprite(ctx,SPR.red,-16,1.5,6,0,0.9);sprite(ctx,SPR.green,16,1.5,6,0,0.9)}}

/* ---------- projectiles ---------- */
function firePlasma(x,y,tx,ty){const a=Math.atan2(ty-y,tx-x),v=950*ds;bullets.push({k:'plasma',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.4})}
function fireMissile(x,y,ang,target){bullets.push({k:'missile',x,y,vx:Math.cos(ang)*160*ds,vy:Math.sin(ang)*160*ds,sp:160*ds,life:3.2,target})}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life-=dt;
    if(b.k==='missile'){
      b.sp=Math.min(700*ds,b.sp+1000*ds*dt);let ang=Math.atan2(b.vy,b.vx);
      if(b.target&&b.target.alive){const want=Math.atan2(b.target.y-b.y,b.target.x-b.x);let da=((want-ang+Math.PI*3)%(Math.PI*2))-Math.PI;ang+=clamp(da,-5*dt,5*dt)}
      b.vx=Math.cos(ang)*b.sp;b.vy=Math.sin(ang)*b.sp;
      if(Math.random()<0.9)spawn({k:'smoke',x:b.x,y:b.y,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,life:0.8,max:0.8,r:2*ds,grow:10*ds});
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    let hit=null;
    for(const d of drones){if(d.alive&&!d.fatal&&Math.hypot(d.x-b.x,d.y-b.y)<(b.k==='missile'?22:17)*ds){hit=d;break}}
    if(hit){
      if(b.k==='plasma'){killDrone(hit,Math.random()<0.5?'explode':'wreck');spawn({k:'flash',x:b.x,y:b.y,vx:0,vy:0,life:0.12,max:0.12,r:4,grow:120})}
      else{explosion(b.x,b.y,1.1*ds);for(const d of drones.slice())if(d.alive&&!d.fatal&&Math.hypot(d.x-b.x,d.y-b.y)<75*ds)killDrone(d,'explode')}
      bullets.splice(i,1);continue;
    }
    if(b.life<=0||b.x<-120||b.x>W+120||b.y<-120||b.y>G){
      if(b.k==='missile')explosion(b.x,Math.min(b.y,G-4),0.6*ds);
      bullets.splice(i,1);
    }
  }
}
function drawBullets(ctx){
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const b of bullets){
    if(b.k==='plasma'){
      const tx=b.x-b.vx*0.07,ty=b.y-b.vy*0.07,g=ctx.createLinearGradient(tx,ty,b.x,b.y);g.addColorStop(0,'rgba(40,150,255,0)');g.addColorStop(1,'rgba(130,232,255,.7)');
      ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=6*ds;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.strokeStyle='rgba(236,253,255,.95)';ctx.lineWidth=2.2*ds;ctx.beginPath();ctx.moveTo(b.x-b.vx*0.025,b.y-b.vy*0.025);ctx.lineTo(b.x,b.y);ctx.stroke();
      sprite(ctx,SPR.cyan,b.x,b.y,13*ds,0,0.85);
    }else{
      const tr=b.tr||(b.tr=[]);tr.push(b.x,b.y);if(tr.length>18)tr.splice(0,2);
      ctx.globalAlpha=1;for(let i=2;i<tr.length;i+=2){const k=i/tr.length;ctx.strokeStyle='rgba(255,'+(110+Math.floor(110*k))+',50,'+(0.55*k)+')';ctx.lineWidth=(0.8+2.4*k)*ds;ctx.beginPath();ctx.moveTo(tr[i-2],tr[i-1]);ctx.lineTo(tr[i],tr[i+1]);ctx.stroke()}
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.scale(ds,ds);
      sprite(ctx,SPR.fire,-11,0,9,0,0.9);ctx.globalAlpha=1;
      ctx.fillStyle='rgba(255,150,50,.9)';teardrop2(ctx);ctx.fillStyle='rgba(255,245,210,.95)';ctx.beginPath();ctx.ellipse(-9,0,3,1.4,0,0,Math.PI*2);ctx.fill();
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#6e747b';ctx.beginPath();ctx.moveTo(-8,-2);ctx.lineTo(-11,-4.6);ctx.lineTo(-4,-2);ctx.moveTo(-8,2);ctx.lineTo(-11,4.6);ctx.lineTo(-4,2);ctx.fill();
      ctx.fillStyle='#c9cdd2';ctx.beginPath();ctx.roundRect(-8,-2.2,15,4.4,2);ctx.fill();

/* ---------- weapons: eye lasers, arm cannon, shoulder rockets ---------- */
const wp={state:'idle',kind:null,t:0,target:null,shots:0,next:0,cd:1.2,beam:null,turretUsed:false};
function pickTarget(){
  const c=botCenter();let best=null,bs=1e9;
  for(const d of drones){if(!d.alive||d.fatal)continue;let s=Math.hypot(d.x-c.x,d.y-c.y);if(d.state==='dive')s*=0.3;if(d.x<10||d.x>W-10)s+=2000;if(s<bs){bs=s;best=d}}
  return best;
}
function chooseWeapon(t){
  const c=botCenter(),dist=Math.hypot(t.x-c.x,t.y-c.y)/ds,r=Math.random();
  if(t.state==='dive'||dist<230)return r<0.6?'laser':(r<0.85?'arm':'shoulder');
  if(dist<420)return r<0.42?'arm':(r<0.72?'laser':'shoulder');
  return r<0.55?'shoulder':(r<0.8?'arm':'laser');
}
function shoot(k,T){
  if(k==='arm'){
    const a=bot.aimA,L=R.upper+R.fore+36,m=toWorld(2-Math.sin(a)*L,R.shoulderY+Math.cos(a)*L);
    const tt=Math.hypot(T.x-m.x,T.y-m.y)/(950*ds);
    firePlasma(m.x,m.y,T.x+T.vx*tt,T.y+T.vy*tt);
    spawn({k:'flash',x:m.x,y:m.y,vx:0,vy:0,life:0.1,max:0.1,r:4,grow:160*ds});
  }else{
    const py=TURRET_Y-TURRET_RISE*bot.turret,c=Math.cos(bot.turretAng),s=Math.sin(bot.turretAng),oy=wp.shots%2?3.6:-3.6;
    const m=toWorld(TURRET_X+30*c-oy*s,py+30*s+oy*c),m2=toWorld(TURRET_X+50*c-oy*s,py+50*s+oy*c);
    fireMissile(m.x,m.y,Math.atan2(m2.y-m.y,m2.x-m.x),T);
    for(let i=0;i<5;i++)spawn({k:'smoke',x:m.x,y:m.y,vx:(Math.random()-0.5)*60,vy:(Math.random()-0.5)*60,life:0.9,max:0.9,r:3*ds,grow:16*ds});
    spawn({k:'flash',x:m.x,y:m.y,vx:0,vy:0,life:0.12,max:0.12,r:4,grow:120*ds});
  }
}
function weapons(dt,active){
  const ease=(v,to,rate)=>v+clamp(to-v,-rate*dt,rate*dt);
  wp.cd-=dt;
  if(!active){wp.turretUsed=false;wp.beam=null;if(wp.state!=='idle')wp.state='idle'}
  if(wp.state!=='idle'&&wp.state!=='recover'&&!(wp.kind==='laser'&&wp.state==='fire')&&(!wp.target||!wp.target.alive)){
    const nt=pickTarget();if(nt)wp.target=nt;else{wp.state='recover';wp.t=0}
  }
  if(wp.state==='idle'){
    if(active&&wp.cd<=0&&(bot.state==='ground'||bot.state==='fly')&&bot.vf<0.05){
      const t=pickTarget();if(t){wp.target=t;wp.kind=chooseWeapon(t);wp.state='aim';wp.t=0;wp.shots=0;if(wp.kind==='shoulder')wp.turretUsed=true}
    }
  }else wp.t+=dt;
  const k=wp.kind,T=wp.target,busy=wp.state==='aim'||wp.state==='fire';
  if(wp.state==='aim'){
    const ready=k==='laser'?wp.t>0.3:k==='arm'?(bot.armAim>0.95&&bot.armGun>0.95):(bot.turret>0.95&&wp.t>0.25);
    if(ready){wp.state='fire';wp.t=0;wp.next=0}
  }else if(wp.state==='fire'&&T){
    if(k==='laser'){wp.beam=T;if(wp.t>0.12&&T.alive&&!T.fatal)killDrone(T,'wreck');if(wp.t>0.45){wp.beam=null;wp.state='recover';wp.t=0}}
    else{wp.next-=dt;if(wp.next<=0){shoot(k,T);wp.shots++;wp.next=k==='arm'?0.13:0.3;if(wp.shots>=(k==='arm'?3:2)){wp.state='recover';wp.t=0}}}
  }else if(wp.state==='recover'){wp.beam=null;if(wp.t>0.3){wp.state='idle';wp.cd=rand(0.4,1.0)}}
  bot.armAim=ease(bot.armAim,busy&&k==='arm'?1:0,1/0.28);
  bot.armGun=ease(bot.armGun,busy&&k==='arm'?1:0,1/0.3);
  bot.turret=ease(bot.turret,(active&&wp.turretUsed)||(busy&&k==='shoulder')?1:0,1/0.4);
  bot.eyeCharge=ease(bot.eyeCharge,busy&&k==='laser'?1:0,1/0.2);
}
function drawLaser(ctx){
  if(!wp.beam)return;const T=wp.beam;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const e of [EYE_N,EYE_F]){
    const p=toWorld(e[0],e[1]),fl=0.8+0.2*Math.random();
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(T.x,T.y);
    ctx.strokeStyle='rgba(255,70,30,'+(0.35*fl)+')';ctx.lineWidth=9*ds;ctx.stroke();
    ctx.strokeStyle='rgba(255,150,70,'+(0.8*fl)+')';ctx.lineWidth=3.5*ds;ctx.stroke();
    ctx.strokeStyle='#fff6dc';ctx.lineWidth=1.4*ds;ctx.stroke();
  }
  laserGlow(ctx,T);ctx.restore();
  for(let i=0;i<2;i++)spawn({k:'spark',x:T.x,y:T.y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,life:0.4,max:0.4,r:1,grow:0});

/* ---------- life: what the giant decides to do next ---------- */
let W=800,H=600,G=598,dpr=1,mouse={x:-1e4,y:-1e4,t:0};
const maxAltNow=()=>Math.max(50,G-350*SC-20);
function flyTask(){
  const m=maxAltNow(),n=1+Math.floor(Math.random()*3),pts=[];
  for(let i=0;i<n;i++)pts.push({x:rand(120,W-120),alt:rand(0.35,1)*m,hold:rand(0.4,2)});
  const lx=rand(120,W-120);pts.push({x:lx,alt:m*0.3,hold:0.3},{x:lx,alt:0,hold:0});
  return{k:'fly',pts,i:0,h:0};
}
function leaveTask(){
  const m=maxAltNow(),side=Math.random()<0.5?-1:1,off=side<0?-320:W+320,back=side<0?W+320:-320,lx=rand(150,W-150);
  return{k:'fly',pts:[{x:off,alt:m,hold:rand(4,10),tp:back},{x:lx,alt:m*0.55,hold:0.6},{x:lx,alt:0,hold:0}],i:0,h:0};
}
function battleTask(){return{k:'battle',mode:Math.random()<0.5?'ground':'air',toSpawn:3+Math.floor(Math.random()*5),spawnT:0.8,hx:clamp(bot.x,W*0.25,W*0.75)}}
function nextTask(){
  const r=Math.random();
  if(r<0.28)return{k:'walk',x:rand(90,W-90)};
  if(r<0.44)return{k:'idle',t:rand(2,5)};
  if(r<0.52)return{k:'wave',t:2.4};
  if(r<0.60)return{k:'look',stage:0,t:0};
  if(r<0.78)return flyTask();
  if(r<0.84)return leaveTask();
  return battleTask();
}
let task=null,queue=[];
function arrive(){
  const m=maxAltNow(),fromLeft=Math.random()<0.5,lx=rand(W*0.3,W*0.7);
  drones.length=0;bullets.length=0;pieces=null;wreck=null;
  Object.assign(bot,{x:fromLeft?-260:W+260,vx:0,dir:fromLeft?1:-1,state:'fly',t:0,alt:m*0.8,target:m*0.8,ramp:1,view:0,vf:0,raise:0});
  task={k:'fly',pts:[{x:lx,alt:m*0.45,hold:0.6},{x:lx,alt:0,hold:0}],i:0,h:0};queue=[{k:'wave',t:2.4}];
  if(window.GIANT_FIRST_BATTLE)queue.push(battleTask());
}
function startBattle(){if(!task||task.k!=='battle'){task=battleTask();queue=[]}}
let battleOn=false;
function think(dt){
  const c={h:0,up:false,alt:null,face:0,faceForce:0};
  battleOn=false;
  if(!task)task=queue.shift()||nextTask();
  const t=task,busy=bot.state==='launch'||bot.state==='land';
  if(t.k!=='look'&&t.k!=='victory'&&t.k!=='battle')bot.view=0;
  if(t.k==='walk'){
    if(bot.state!=='ground'){task=null;return c}
    const dx=t.x-bot.x;c.h=clamp(dx/60,-1,1);if(Math.abs(dx)<6&&Math.abs(bot.vx)<6)task=null;
  }else if(t.k==='idle'||t.k==='wave'){
    if(t.k==='wave'&&!t.started){t.started=true;bot.wave=t.t}
    if(!busy&&performance.now()-mouse.t<4000&&Math.abs(mouse.x-bot.x)<500)c.face=mouse.x>bot.x?1:-1;
    t.t-=dt;if(t.t<=0)task=null;
  }else if(t.k==='fly'){
    if(bot.state==='ground'){if(t.i>=t.pts.length){task=null;return c}c.up=true;return c}
    if(bot.state!=='fly')return c;
    const wp_=t.pts[Math.min(t.i,t.pts.length-1)],dx=wp_.x-bot.x;
    c.h=clamp(dx/220,-1,1);c.alt=wp_.alt;
    if(t.i<t.pts.length&&Math.abs(dx)<30&&Math.abs(bot.alt-wp_.alt)<12){
      t.h+=dt;if(t.h>=wp_.hold){if(wp_.tp!=null){bot.x=wp_.tp;bot.vx=0;bot.dir=wp_.tp<0?1:-1}t.i++;t.h=0}
    }
  }else if(t.k==='battle'){
    bot.view=0;battleOn=bot.vf<0.05;
    t.spawnT-=dt;if(t.toSpawn>0&&t.spawnT<=0){spawnDrone();t.toSpawn--;t.spawnT=rand(0.35,1.0)}
    if(t.toSpawn===0&&!t.fatalSet){const alive=drones.filter(d=>d.alive);if(alive.length===1){const d=alive[0];d.fatal=true;d.state='dive';d.t=0;t.fatalSet=true}}
    const tg=(wp.target&&wp.target.alive&&!wp.target.fatal?wp.target:pickTarget())||drones.find(d=>d.fatal);
    if(t.mode==='air'){if(bot.state==='ground')c.up=true;else if(bot.state==='fly'){c.alt=maxAltNow()*0.45;c.h=clamp((t.hx-bot.x)/300,-0.3,0.3)}}
    if(tg)c.faceForce=tg.x>bot.x?1:-1;
    if(t.toSpawn===0&&!drones.some(d=>d.alive))task={k:'victory',stage:0,t:0};
  }else if(t.k==='broken'){
    bot.view=0;
  }else if(t.k==='victory'||t.k==='look'){
    t.t+=dt;
    if(t.stage===0){if(bot.state==='fly'){c.alt=0;c.h=0}else if(bot.state==='ground'&&!drones.length&&bot.turret<0.05){t.stage=1;t.t=0}}
    else if(t.stage===1){bot.view=1;if(bot.vf>=1){t.stage=2;t.t=0}}
    else if(t.stage===2){
      if(t.k==='victory')bot.raise=smooth(0.6,1.1,t.t)*(1-smooth(2.6,3.1,t.t));
      if(t.t>(t.k==='victory'?4.5:3.2))t.stage=3;
    }else{bot.raise=0;bot.view=0;if(bot.vf<=0)task=null}
  }
  return c;
}

/* ---------- falling apart and putting himself back together ---------- */
let pieces=null,wreck=null;
const GATHER_ORDER={foot:0,shin:0.35,thigh:0.7,waist:1.05,chest:1.4,upper:1.8,fore:2.15,head:2.6};
function capturePose(P,x,y,dir){
  const st=bot.turret,sg=bot.armGun;bot.turret=0;bot.armGun=0;
  REC=[];ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);drawRobot(ctx,P,0,x,y,dir);ctx.restore();
  const rec=REC;REC=null;bot.turret=st;bot.armGun=sg;
  return rec.map(r=>{const m=r.m,ky=Math.hypot(m.c,m.d),kx=(m.a*m.d-m.b*m.c)/ky,a=Math.atan2(-m.c,m.d),pw=m.transformPoint(new DOMPoint(r.pv[0],r.pv[1]));
    return{id:r.id,fn:r.fn,pv:r.pv,hh:r.hh*SC,x:pw.x/dpr,y:pw.y/dpr,a,kx,ky,vx:0,vy:0,va:0}});
}
function breakApart(hx,hy){
  if(!bot.draw||!bot.lastP)return;
  pieces=capturePose(bot.lastP,bot.draw.x,bot.draw.y,bot.dir);
  for(const p of pieces){
    const dx=p.x-hx,dy=p.y-hy,d=Math.hypot(dx,dy)||1,f=(360+Math.random()*280)*ds;
    p.vx=dx/d*f*0.8+(Math.random()-0.5)*180*ds;p.vy=dy/d*f*0.4-(240+Math.random()*280)*ds;p.va=(Math.random()-0.5)*16;
  }
  explosion(hx,hy,2.2*ds);
  for(let i=0;i<4;i++)explosion(hx+(Math.random()-0.5)*90*ds,hy+(Math.random()-0.5)*90*ds,(0.6+Math.random()*0.6)*ds);
  wreck={stage:'fall',t:0,dir:bot.dir,eyes:0,twitch:0.8};
  Object.assign(bot,{state:'broken',vx:0,armAim:0,armGun:0,turret:0,eyeCharge:0,hit:0});
  wp.state='idle';wp.beam=null;wp.target=null;wp.turretUsed=false;
  bullets.length=0;
  task={k:'broken'};queue=[];
}
function startGather(){
  let sx=0;for(const p of pieces)sx+=p.x;
  const ax=clamp(sx/pieces.length,140,W-140),st=walkPose(0,0,bot.clock);st.blink=1;
  const y=G-Math.max(footDrop(st.thighN,st.kneeN,st.tilt),footDrop(st.thighF,st.kneeF,st.tilt))*SC;
  const tg=capturePose(st,ax,y,wreck.dir);
  pieces.forEach((p,i)=>{const q=tg[i];let da=((q.a-p.a)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
    p.g={x0:p.x,y0:p.y,a0:p.a,x1:q.x,y1:q.y,a1:p.a+da,s:GATHER_ORDER[p.id]+Math.random()*0.15,d:0.7+Math.random()*0.2,h:(50+Math.random()*90)*ds,done:false};p.kx=q.kx;p.ky=q.ky});
  wreck.stage='gather';wreck.t=0;wreck.ax=ax;wreck.eyes=0;
}
function updatePieces(dt){
  wreck.t+=dt;
  if(wreck.stage!=='gather'){
    for(const p of pieces){
      p.vy+=1100*ds*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
      if(p.x<20||p.x>W-20){p.x=clamp(p.x,20,W-20);p.vx*=-0.5}
      if(p.y>G-p.hh){
        p.y=G-p.hh;
        if(p.vy>70*ds){p.vy*=-0.3;dustBurst(p.x,G,3,0.4*ds)}else p.vy=0;
        p.vx*=1-Math.min(1,dt*6);p.va*=1-Math.min(1,dt*6);
        const flat=Math.round(p.a/(Math.PI/2))*(Math.PI/2);p.a+=(flat-p.a)*Math.min(1,dt*5);
      }
    }
    if(wreck.stage==='fall'&&wreck.t>1.6){wreck.stage='lie';wreck.t=0}
    if(wreck.stage==='lie'){
      wreck.twitch-=dt;
      if(wreck.twitch<=0){wreck.twitch=rand(0.25,0.8);const p=pieces[Math.floor(Math.random()*pieces.length)];
        p.vy=-(70+Math.random()*110)*ds;p.va=(Math.random()-0.5)*5;
        for(let i=0;i<4;i++)spawn({k:'spark',x:p.x,y:p.y,vx:(Math.random()-0.5)*160,vy:-Math.random()*160,life:0.4,max:0.4,r:1,grow:0})}
      if(Math.random()<dt*3){const p=pieces[Math.floor(Math.random()*pieces.length)];spawn({k:'smoke',x:p.x,y:p.y,vx:(Math.random()-0.5)*10,vy:-15,life:1.6,max:1.6,r:3*ds,grow:12*ds})}
      wreck.eyes=wreck.t>2.6?(Math.random()<0.5?1:0):0;
      if(wreck.t>3.4)startGather();
    }
  }else{
    let all=true;
    for(const p of pieces){
      const g=p.g,k=(wreck.t-g.s)/g.d;
      if(k<0){all=false;p.x=g.x0+Math.sin(wreck.t*40+g.s*10)*0.8;continue}
      const e=smooth(0,1,Math.min(1,k));
      p.x=g.x0+(g.x1-g.x0)*e;p.y=g.y0+(g.y1-g.y0)*e-g.h*Math.sin(Math.PI*Math.min(1,k));p.a=g.a0+(g.a1-g.a0)*e;
      if(k>=1&&!g.done){g.done=true;p.x=g.x1;p.y=g.y1;p.a=g.a1;
        for(let i=0;i<10;i++)spawn({k:'spark',x:p.x,y:p.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,life:0.35,max:0.35,r:1,grow:0});
        spawn({k:'flash',x:p.x,y:p.y,vx:0,vy:0,life:0.12,max:0.12,r:3,grow:90*ds});
        if(p.id==='head')wreck.eyes=1;}
      if(k<1)all=false;
    }
    if(all&&wreck.t>0){wreck.done=(wreck.done||0)+dt;
      if(wreck.done>0.5){
        Object.assign(bot,{state:'ground',x:wreck.ax,dir:wreck.dir,vx:0,alt:0,target:0,amp:0,ramp:0,t:0,view:0,vf:0});

      }}

}
function drawPieces(ctx){
  for(const p of pieces){
    ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.scale(p.kx/dpr,p.ky/dpr);ctx.translate(-p.pv[0],-p.pv[1]);
    ctx.lineJoin='round';ctx.lineCap='round';p.fn(ctx);ctx.restore();
  }
}

  glow:radSprite([[0,'rgba(255,255,240,1)'],[0.22,'rgba(255,225,160,.75)'],[0.55,'rgba(255,150,50,.28)'],[1,'rgba(255,110,30,0)']]),
  fire:radSprite([[0,'rgba(255,240,175,1)'],[0.3,'rgba(255,160,50,.8)'],[0.65,'rgba(225,70,15,.32)'],[1,'rgba(160,30,0,0)']]),
  cyan:radSprite([[0,'rgba(235,255,255,1)'],[0.25,'rgba(120,225,255,.65)'],[1,'rgba(40,140,255,0)']]),
  red:radSprite([[0,'rgba(255,235,220,1)'],[0.25,'rgba(255,90,50,.7)'],[1,'rgba(255,30,10,0)']]),
  green:radSprite([[0,'rgba(230,255,230,1)'],[0.25,'rgba(70,255,120,.65)'],[1,'rgba(20,200,60,0)']],32),
  eye:radSprite([[0,'rgba(255,245,200,.9)'],[0.25,'rgba(255,190,40,.55)'],[1,'rgba(255,140,0,0)']]),
  shadow:radSprite([[0,'rgba(0,0,0,.85)'],[0.45,'rgba(0,0,0,.45)'],[1,'rgba(0,0,0,0)']]),
  disc:radSprite([[0,'rgba(170,180,190,.06)'],[0.62,'rgba(170,180,190,.18)'],[0.9,'rgba(225,232,240,.5)'],[1,'rgba(225,232,240,0)']]),
  smoke:[puffSprite('52,50,56',11),puffSprite('84,80,88',23),puffSprite('118,114,122',37),puffSprite('150,147,154',41)],
  dust:[puffSprite('120,108,96',53),puffSprite('152,141,128',67)]
};
function sprite(ctx,img,x,y,rx,ry,a){if(a<=0.003)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(img,x-rx,y-(ry||rx),rx*2,(ry||rx)*2)}

/* ---------- fx: shockwaves, embers, scorch marks, speed streaks, landing squash ---------- */
const fx=[];let squashT=0;
function addFx(o){if(fx.length<260)fx.push(o)}
function fxBoom(x,y,s){
  addFx({k:'shock',x,y,r:0,R:48*s,life:0.32,max:0.32,w:2.4*Math.sqrt(s)});
  const n=Math.round(5+5*Math.min(2,s/ds));
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(50+Math.random()*190)*s;addFx({k:'ember',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50*s,life:0.7+Math.random()*1.1,max:1.8,r:1+Math.random()*1.4,ph:Math.random()*6})}
  if(y>G-50*ds)addFx({k:'scorch',x,y:G,life:5,max:5,r:(16+Math.random()*10)*s});
}
function fxEvent(e){
  if(e==='land'||e==='liftoff'){
    addFx({k:'gring',x:bot.x,y:G,r:12*ds,vr:(e==='land'?340:280)*ds,life:0.6,max:0.6});
    addFx({k:'scorch',x:bot.x+bot.dir*8*ds,y:G,life:4.5,max:4.5,r:30*ds});
    if(e==='land')squashT=0.34;
  }else if(e==='step')addFx({k:'gring',x:bot.x+bot.dir*12*ds,y:G,r:5*ds,vr:120*ds,life:0.3,max:0.3,soft:1});
}
function fxSquash(ctx,x){
  if(squashT<=0)return;const s=0.075*Math.sin((1-squashT/0.34)*Math.PI);
  ctx.translate(x,G);ctx.scale(1+s*0.55,1-s);ctx.translate(-x,-G);
}
function fxUpdate(dt){
  squashT=Math.max(0,squashT-dt);
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life-=dt;if(f.life<=0){fx.splice(i,1);continue}
    if(f.k==='shock'){const e=1-f.life/f.max;f.r=f.R*(1-(1-e)*(1-e))}
    else if(f.k==='gring'){f.r+=f.vr*dt;f.vr*=1-Math.min(1,dt*4.5)}
    else if(f.k==='ember'){const d=1-Math.min(1,dt*1.6);f.vx=f.vx*d+Math.sin(f.ph+f.life*7)*30*dt;f.vy=f.vy*d-28*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.y>G-1){f.y=G-1;f.vy*=-0.3}}
    else if(f.k==='glint'){f.y-=8*dt}
  }
  /* speed streaks behind the giant in fast flight */
  if(bot.state==='fly'&&bot.draw&&!pieces){const sp=Math.abs(bot.vx)/VF;
    if(sp>0.5&&Math.random()<dt*30*(sp-0.4)){const q=toWorld(rand(-30,50),rand(-170,40));addFx({k:'streak',x:q.x,y:q.y,len:Math.abs(bot.vx)*rand(0.09,0.18),dir:Math.sign(bot.vx),life:0.32,max:0.32})}}
  /* falling apart: pieces smoke in flight; reassembly: warm glints trail the moving parts */
  if(pieces&&wreck){for(const p of pieces){
    if(wreck.stage==='fall'&&p.y<G-p.hh-6&&Math.random()<dt*28)spawn({k:'smoke',x:p.x,y:p.y,vx:p.vx*0.1,vy:-12,life:1.1,max:1.1,r:4*ds,grow:20*ds});
    else if(wreck.stage==='gather'&&p.g&&!p.g.done&&wreck.t>p.g.s&&Math.random()<dt*36)addFx({k:'glint',x:p.x+rand(-5,5)*ds,y:p.y+rand(-5,5)*ds,life:0.4,max:0.4,r:rand(5,9)*ds});
  }}
}
function drawGroundShadow(ctx,x,alt){
  const k=Math.max(0,1-alt/230);if(k<0.02)return;
  ctx.save();const cx=x+6*ds,w=(46+40*(1-k))*ds,h=(6+4*(1-k))*ds;
  sprite(ctx,SPR.shadow,cx,G,w,h,0.42*k*k);
  if(alt<6)sprite(ctx,SPR.shadow,cx,G,30*ds,3.2*ds,0.4*(1-alt/6));
  ctx.restore();
}
function drawFxUnder(ctx){
  ctx.save();ctx.lineCap='round';
  if(pieces)for(const p of pieces){const h=G-p.y-p.hh;if(h<90*ds)sprite(ctx,SPR.shadow,p.x,G,p.hh*1.6+6*ds,3*ds,0.32*(1-Math.max(0,h)/(90*ds)))}
  for(const f of fx){const a=f.life/f.max;
    if(f.k==='scorch'){sprite(ctx,SPR.shadow,f.x,f.y,f.r,f.r*0.16,0.38*Math.min(1,a*2))}
    else if(f.k==='gring'){ctx.globalAlpha=1;ctx.strokeStyle='rgba(128,116,104,'+((f.soft?0.25:0.5)*a)+')';ctx.lineWidth=(f.soft?2:5)*ds*a+1;ctx.beginPath();ctx.ellipse(f.x,f.y-2*ds,f.r,f.r*0.13,0,Math.PI,Math.PI*2);ctx.stroke()}
    else if(f.k==='shock'){ctx.globalAlpha=1;ctx.strokeStyle='rgba(50,42,38,'+(0.1*a*a)+')';ctx.lineWidth=f.w*a+0.5;circle(ctx,f.x,f.y,f.r+f.w);ctx.stroke()}
    else if(f.k==='streak'){ctx.globalAlpha=1;const x2=f.x-f.dir*f.len,g=ctx.createLinearGradient(f.x,0,x2,0);g.addColorStop(0,'rgba(170,184,202,'+(0.55*a)+')');g.addColorStop(1,'rgba(170,184,202,0)');ctx.strokeStyle=g;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(x2,f.y);ctx.stroke()}
  }
  ctx.restore();
}
function drawFxOver(ctx){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const f of fx){const a=f.life/f.max;
    if(f.k==='shock'){ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,226,185,'+(0.12*a)+')';ctx.lineWidth=f.w*3*a+1;circle(ctx,f.x,f.y,f.r);ctx.stroke();ctx.strokeStyle='rgba(255,236,205,'+(0.4*a*a)+')';ctx.lineWidth=f.w*a+0.5;ctx.stroke()}
    else if(f.k==='ember'){const heat=Math.min(1,a*1.6);sprite(ctx,heat>0.5?SPR.glow:SPR.fire,f.x,f.y,f.r*4*ds,0,0.9*heat);ctx.globalAlpha=heat;ctx.fillStyle=heat>0.55?'#fff2c0':'#ff8a3a';ctx.fillRect(f.x-0.8,f.y-0.8,1.6,1.6)}
    else if(f.k==='scorch'){const hot=Math.max(0,1-(f.max-f.life)/1.2);if(hot>0)sprite(ctx,SPR.fire,f.x,f.y,f.r*0.8,f.r*0.16,0.7*hot)}
    else if(f.k==='glint'){sprite(ctx,SPR.glow,f.x,f.y,f.r,0,0.6*a)}
  }
  ctx.restore();
}
/* weapon eye-laser: heat glow at the eyes and a hot impact bloom (called inside drawLaser, additive) */
function laserGlow(ctx,T){
  const fl=0.85+0.15*Math.random();
  for(const e of [EYE_N,EYE_F]){const p=toWorld(e[0],e[1]);sprite(ctx,SPR.red,p.x,p.y,12*ds*fl,0,0.8)}
  sprite(ctx,SPR.red,T.x,T.y,34*ds*fl,0,0.55);sprite(ctx,SPR.glow,T.x,T.y,18*ds*fl,0,1);
  ctx.globalAlpha=1;
}
/* eye halo (small, no beam) and the warm light pool of low jets */
function drawRobotFx(ctx,x,y,sx,P){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of emitPts){const wx=e.p.x/dpr,wy=e.p.y/dpr,h=G-wy,lim=170*ds;
    if(h<lim){const k=(1-Math.max(0,h)/lim)*e.a*(0.85+0.15*Math.random()),w=(55+60*(1-k))*ds;sprite(ctx,SPR.fire,wx,G,w,w*0.12,0.38*k)}}
  const pts=[];
  if(pieces){if(wreck&&wreck.eyes){const h=pieces.find(p=>p.id==='head');if(h){const kx=h.kx/dpr,ky=h.ky/dpr,c=Math.cos(h.a),s=Math.sin(h.a);
    for(const e of [EYE_N,EYE_F]){const lx=(e[0]-h.pv[0])*kx,ly=(e[1]-h.pv[1])*ky;pts.push([h.x+lx*c-ly*s,h.y+lx*s+ly*c,e===EYE_N?1:0.55])}}}}
  else if(P.blink>=1){
    if(bot.vf<0.5){for(const e of [EYE_N,EYE_F]){const q=toWorld(e[0],e[1]);pts.push([x+(q.x-x)*sx,q.y,e===EYE_N?1:0.55])}}
    else for(const ex of [-7,7])pts.push([x+ex*SC*sx,y-170*SC,1]);
  }
  const ch=bot.eyeCharge,pulse=0.85+0.15*Math.sin(bot.clock*2.6),r=(8+6*ch)*ds*pulse;
  for(const p of pts)sprite(ctx,ch>0.3?SPR.red:SPR.eye,p[0],p[1],r*(0.6+0.4*p[2]),0,(0.45+0.35*ch)*p[2]*pulse);
  ctx.restore();
}

/* ---------- view, input, IPC ---------- */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let paused=false,ignoring=true,hover=false;
function resize(){
  dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;G=H-2;
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
}
addEventListener('resize',resize);resize();
function hitTest(x,y){
  const inside=mouse.x>x-75*SC&&mouse.x<x+75*SC&&mouse.y>y-200*SC&&mouse.y<y+160*SC;
  if(inside!==hover){hover=inside;canvas.style.cursor=inside?'pointer':'default'}
  if(api&&ignoring===inside){ignoring=!inside;api.setIgnore(ignoring)}
}
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.t=performance.now()});
addEventListener('mouseleave',()=>{mouse.x=-1e4});
addEventListener('mousedown',()=>{
  if(!hover||(task&&(task.k==='battle'||task.k==='victory'||task.k==='broken')))return;
  if(bot.state==='ground'){task={k:'wave',t:1.4};queue=[flyTask()]}
  else if(bot.state==='fly'){task={k:'fly',pts:[{x:bot.x+bot.dir*260,alt:maxAltNow(),hold:0.5}].concat(flyTask().pts),i:0,h:0}}
});
function applySettings(s){
  if(s.size&&SIZES[s.size]){SC=SIZES[s.size];VW=34*SC*OMEGA}
  if(typeof s.paused==='boolean')paused=s.paused;
}
if(api){
  api.onSettings(applySettings);
  api.onSummon(()=>{parts.length=0;arrive()});
  if(api.onBattle)api.onBattle(startBattle);
}
window.__giant={battle:startBattle,summon:()=>{parts.length=0;arrive()}};

/* tray icon: the giant's head */
function makeIcon(){
  const ic=document.createElement('canvas');ic.width=ic.height=32;const c=ic.getContext('2d');
  c.translate(16,31);c.scale(0.62,0.62);c.lineJoin='round';
  c.beginPath();c.moveTo(-14,0);c.lineTo(-16,-28);c.bezierCurveTo(-16,-42,-8,-46,0,-46);c.bezierCurveTo(8,-46,16,-42,16,-28);c.lineTo(14,0);c.closePath();
  paint(c,'head',false,{x:-16,w:32});
  for(const ex of [-7,7]){c.beginPath();c.ellipse(ex,-22,4.5,4.5,0,0,Math.PI*2);paint(c,'eye')}
  return ic.toDataURL('image/png');
}
if(api)api.sendIcon(makeIcon());

arrive();
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const maxAlt=maxAltNow();ds=SC/0.55;
  if(!paused){
    const c=think(dt);update(bot,c,dt,maxAlt);
    while(events.length){const e=events.shift();fxEvent(e);
      if(e==='step')dustBurst(bot.x+bot.dir*10,G,4,0.3*ds);
      if(e==='land')dustBurst(bot.x,G,28,ds);
      if(e==='liftoff')dustBurst(bot.x,G,20,1.1*ds)}
  }
  const {P,flame}=poseOf(bot);
  const bob=bot.state==='fly'?4*Math.sin(bot.clock*1.8)*bot.ramp*smooth(0,30,bot.alt):0;
  const drop=Math.max(footDrop(P.thighN,P.kneeN,P.tilt),footDrop(P.thighF,P.kneeF,P.tilt));
  const jit=bot.hit>0?(Math.random()-0.5)*8*bot.hit:0;
  const y=G-drop*SC-bot.alt-bob,x=bot.x+jit;
  bot.draw={x,y,tilt:P.tilt,dir:bot.dir};
  if(bot.armAim>0.001&&wp.target){const sw=toWorld(2,R.shoulderY),dl=toLocalVec(wp.target.x-sw.x,wp.target.y-sw.y),a=Math.atan2(-dl.x,dl.y);P.armN+=(a-P.armN)*bot.armAim;P.elbowN+=(0-P.elbowN)*bot.armAim}
  bot.aimA=P.armN;bot.lastP=P;
  {let want=-0.5;if(bot.turret>0.05&&wp.target){const pw=toWorld(TURRET_X,TURRET_Y-TURRET_RISE*bot.turret),dl=toLocalVec(wp.target.x-pw.x,wp.target.y-pw.y);want=clamp(Math.atan2(dl.y,dl.x),-2.4,0.4)}bot.turretAng+=(want-bot.turretAng)*Math.min(1,dt*8)}
  if(pieces){const on=wreck&&wreck.eyes;FILL.eye=on?'#ffc233':'#4d4130';EYE_GLOW=on?'#ffae00':'rgba(0,0,0,0)'}
  else{FILL.eye=bot.eyeCharge>0.3?'#ffd2b0':'#ffc233';EYE_GLOW=bot.eyeCharge>0.3?'#ff3a1a':'#ffae00'}
  if(!paused){if(!pieces)weapons(dt,battleOn);updateDrones(dt);updateBullets(dt);if(pieces)updatePieces(dt);stepParts(dt,G)}
  if(!paused)fxUpdate(dt);
  hitTest(pieces?-1e5:x,y);

  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  if(!pieces)drawGroundShadow(ctx,x,bot.alt);
  drawFxUnder(ctx);
  drawParts(ctx,false);
  emitPts=[];
  const sx=Math.max(0.03,Math.abs(Math.cos(bot.vf*Math.PI)));
  if(pieces)drawPieces(ctx);
  else if(bot.vf<0.5){ctx.save();fxSquash(ctx,x);ctx.translate(x,0);ctx.scale(sx,1);ctx.translate(-x,0);drawRobot(ctx,P,flame,x,y,bot.dir);ctx.restore()}
  else drawFront(ctx,x,y,sx,bot.raise,bot.clock,P.blink);
  drawRobotFx(ctx,x,y,sx,P);
  for(const d of drones)drawDrone(ctx,d,bot.clock);
  drawLaser(ctx);
  drawBullets(ctx);
  if(!paused)for(const e of emitPts){
    const wx=e.p.x/dpr,wy=e.p.y/dpr;
    if(Math.random()<0.8*e.a)spawn({k:'spark',x:wx,y:wy,vx:(Math.random()-0.5)*90-bot.vx*0.3,vy:120+Math.random()*120,life:0.3+Math.random()*0.3,max:0.6,r:1,grow:0});
    if(Math.random()<0.35*e.a)spawn({k:'smoke',x:wx,y:Math.min(wy+6,G-2),vx:(Math.random()-0.5)*30-bot.vx*0.4,vy:40+Math.random()*30,life:1+Math.random(),max:2,r:3*ds,grow:14*ds});
    if(wy>G-60*ds&&Math.random()<0.5*e.a){const d=Math.random()<0.5?-1:1;spawn({k:'smoke',x:wx,y:G-3,vx:d*(80+Math.random()*90),vy:-10,life:0.9,max:1.3,r:4*ds,grow:18*ds})}
  }
  drawParts(ctx,true);
  drawFxOver(ctx);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(api)api.ready();
})();
</script>
</body>

<title>Стальной гигант · виджет</title>
<style>
/* Layout: fake desktop wallpaper, two draggable app windows, the widget canvas above them, a control strip on top */
:root{--wall-a:#1f4e79;--wall-b:#6aa7d8;--glass:rgba(14,18,26,.62);--edge:rgba(255,255,255,.14);--ink:#eef1f5;--accent:#ffc233;
  --win:#f5f6f8;--win-bar:#e4e7ec;--win-ink:#2b2f36;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(150deg,var(--wall-a),var(--wall-b));color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:5}
.fw{position:fixed;background:var(--win);color:var(--win-ink);border:1px solid rgba(0,0,0,.18);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:1;overflow:hidden;min-width:0}
.fw .bar{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;background:var(--win-bar);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:13px}
.fw .bar:active{cursor:grabbing}
.fw .x{border:0;background:transparent;color:var(--win-ink);font-size:16px;width:30px;height:26px;border-radius:5px;cursor:pointer}
.fw .x:hover{background:#e81123;color:#fff}
.fw .body{padding:12px 14px;font-size:13px;line-height:1.5;color:#4a505a}
.bar-top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;z-index:10;pointer-events:none}
.bar-top>*{pointer-events:auto}
.tag{background:var(--glass);border:1px solid var(--edge);border-radius:9px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:min(560px,100%)}
.tag b{color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:6px;background:var(--glass);border:1px solid var(--edge);border-radius:9px;padding:5px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btns button{font:500 13px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 10px;cursor:pointer}
.btns button:hover{background:rgba(255,255,255,.1)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.tag{display:none}}
</style>
<div class="bar-top">
  <div class="tag">Превью виджета на «рабочем столе». Через 10 секунд начнётся показ нового. Окна можно <b>перетаскивать</b> и <b>закрывать</b>: гигант сидит на них, ездит и падает. Звук включится после клика.</div>
  <div class="btns"><button id="bShow">Всё новое</button><button id="bBoy">Мальчик</button><button id="bFinale">Финал</button><button id="bKnock">Стук в экран</button><button id="bChase">Погоня</button><button id="bBattle">Бой</button><button id="bWin">Новое окно</button><button id="bSummon">Позвать</button></div>
</div>
<canvas id="c" role="img" aria-label="Стальной гигант живёт на рабочем столе: сидит на окнах, играет с мальчиком, сражается с FPV-дронами"></canvas>
<script>
(()=>{
/* ---------- constants ---------- */
const OMEGA=3.6, VF=260;
const SIZES={small:0.4,medium:0.55,large:0.75};
let SC=SIZES.medium, VW=34*SC*OMEGA, ds=1;
const R={thigh:52,shin:76,upper:55,fore:70,hipY:10,footH:16,shoulderY:-128};
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const api=window.giant||null;
/* ---------- pc bridge: real windows, cursor, idle, time ---------- */
// window.PC: real PC data from Electron main (windows, cursor, idle), or a browser fallback/sim.
// Everything lives in a block so no local names leak into the renderer scope.
{
  const now=()=>performance.now();
  const P=window.PC={windows:[],cursor:{x:-1e4,y:-1e4,t:0,down:false},idle:0,hour:new Date().getHours(),
    active:true,fullscreenApp:false,source:'none'};
  let lastInput=Date.now();
  const fire=()=>{try{dispatchEvent(new Event('pcchange'))}catch(e){}};
  const normWin=(a,mark)=>{
    const out=[];if(!Array.isArray(a))return out;
    for(let i=0;i<a.length;i++){const r=a[i];if(!r)continue;
      const x=+r.x,y=+r.y,w=+(r.w!=null?r.w:r.width),h=+(r.h!=null?r.h:r.height);
      if(!(isFinite(x)&&isFinite(y)&&w>0&&h>0))continue;
      out.push({id:String(r.id!=null?r.id:'w'+i),x,y,w,h,
        max:r.max!=null?!!r.max:(mark&&w>=innerWidth*0.9&&h>=innerHeight*0.85)});}
    return out;
  };
  const setCursor=(x,y,down)=>{const c=P.cursor;c.x=+x;c.y=+y;c.t=now();if(down!=null)c.down=!!down};
  const setIdle=s=>{s=Math.max(0,+s||0);P.idle=s;P.active=s<10;lastInput=Date.now()-s*1000};
  window.__pc={
    setWindows(arr){P.windows=normWin(arr,true);if(P.source!=='electron')P.source='sim';fire()},
    setCursor(x,y){setCursor(x,y);fire()},
    setIdle(sec){setIdle(sec);fire()},
  };
  const input=()=>{if(P.source!=='electron'){lastInput=Date.now();if(P.idle){P.idle=0;P.active=true}}};
  addEventListener('mousemove',e=>{setCursor(e.clientX,e.clientY,(e.buttons&1)===1);input()},{passive:true});
  addEventListener('mousedown',e=>{if(e.button===0)P.cursor.down=true;input()},{passive:true});
  addEventListener('mouseup',e=>{if(e.button===0)P.cursor.down=false},{passive:true});
  addEventListener('keydown',input,{passive:true});
  setInterval(()=>{
    P.hour=new Date().getHours();
    if(P.source!=='electron'){P.idle=Math.max(0,(Date.now()-lastInput)/1000);P.active=P.idle<10}
  },1000);
  if(api&&api.onPC)api.onPC(p=>{
    if(!p)return;P.source='electron';
    if(p.windows)P.windows=normWin(p.windows,false);
    if(p.cursor)setCursor(p.cursor.x,p.cursor.y,!!p.cursor.down);
    if(p.idle!=null){P.idle=Math.max(0,+p.idle||0);P.active=P.idle<10}
    if(p.fullscreenApp!=null)P.fullscreenApp=!!p.fullscreenApp;
    fire();
  });
}
/* ---------- poses ---------- */
function walkPose(p,amp,clock){
  const s=Math.sin(p),c=Math.cos(p),br=Math.sin(clock*1.6)*0.03*(1-amp);
  return{thighN:-0.42*s*amp,kneeN:0.08+0.72*Math.max(0,c)*amp,thighF:0.42*s*amp,kneeF:0.08+0.72*Math.max(0,-c)*amp,
    armN:0.34*s*amp+br,elbowN:-0.3-br,armF:-0.34*s*amp-br,elbowF:-0.3+br,tilt:0.04+0.02*Math.sin(2*p)*amp,point:0};
}
const CROUCH={thighN:-0.75,kneeN:1.35,thighF:-0.6,kneeF:1.2,armN:0.35,elbowN:-0.6,armF:0.5,elbowF:-0.6,tilt:0.25,point:0};
const HOVER={thighN:0.05,kneeN:0.14,thighF:-0.06,kneeF:0.2,armN:0.28,elbowN:-0.35,armF:0.34,elbowF:-0.4,tilt:0.06,point:0.5};
function flyPose(t){
  return{thighN:0.15+0.05*Math.sin(t*3),kneeN:0.1,thighF:0.28+0.05*Math.sin(t*3+1),kneeF:0.22,
    armN:-3.1,elbowN:0.1,armF:0.55,elbowF:-0.25,tilt:0.85+0.05*Math.sin(t*1.8),point:1};
}
function lerpPose(a,b,k){const o={};for(const key in a)o[key]=a[key]+(b[key]-a[key])*k;return o}
const footDrop=(t,k,tilt)=>R.hipY+R.thigh*Math.cos(tilt+t)+R.shin*Math.cos(tilt+t+k)+R.footH;

/* ---------- robot drawing: faceted chest, stacked-disc waist, bullet head ---------- */
const FILL={
  body:'grad', bodyFar:'gradFar', head:'gradHead',
  dark:'#2d3034', darkFar:'#1f2124', ring:'gradRing', ringFar:'gradRingFar',
  joint:'#6e747b', jointFar:'#4a4f55',
  facet:'rgba(255,255,255,.12)', facetFar:'rgba(255,255,255,.05)', shade:'rgba(0,0,0,.22)', shadeFar:'rgba(0,0,0,.25)',
  eye:'#ffc233', eyeFar:'#d99a1f', flameOut:'#ff7a1a', flameIn:'#fff1a8'
};
const GRADS={grad:['#4a4f55','#a2a8ae','#5f656c'],gradFar:['#30343a','#60656b','#3e4247'],gradHead:['#575c62','#b4babf','#6a7077'],
  gradRing:['#1c1e21','#5d6268','#26292d'],gradRingFar:['#141518','#3a3e43','#1a1c1f']};
let emitPts=[],EYE_GLOW='#ffae00';
function capsule(ctx,len,r1,r2=r1){ctx.beginPath();ctx.arc(0,0,r1,Math.PI,0);ctx.lineTo(r2,len);ctx.arc(0,len,r2,0,Math.PI);ctx.closePath()}
function circle(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function poly(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()}
function paint(ctx,role,far,bb){
  let f=(far&&FILL[role+'Far'])||FILL[role];
  if(GRADS[f]){const b=bb||{x:-10,w:20},c=GRADS[f],g=ctx.createLinearGradient(b.x,0,b.x+b.w,0);metalStops(g,f,c);f=g}
  ctx.save();if(role==='eye'){ctx.shadowColor=EYE_GLOW;ctx.shadowBlur=far?8:18}
  ctx.fillStyle=f;ctx.fill();ctx.restore();
  if(role==='flameOut'||role==='flameIn')return;
  if(role==='facet'||role==='shade'){ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1;ctx.stroke();return}
  ctx.strokeStyle='rgba(10,11,13,.85)';ctx.lineWidth=1.5;ctx.stroke();
}
function detail(ctx,far,fn){ctx.save();ctx.strokeStyle=far?'rgba(10,12,15,.3)':'rgba(10,12,15,.5)';ctx.lineWidth=1.2;ctx.beginPath();fn();ctx.stroke();ctx.restore()}
function shine(ctx,fn,a=0.32){ctx.save();ctx.strokeStyle='rgba(235,242,250,'+a+')';ctx.lineWidth=1.8;ctx.beginPath();fn();ctx.stroke();ctx.restore()}
function rivets(ctx,pts,far){ctx.save();ctx.fillStyle=far?'#25282c':'#3a3e43';for(const p of pts){circle(ctx,p[0],p[1],1.5);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.35)';for(const p of pts){circle(ctx,p[0]+0.4,p[1]-0.4,0.6);ctx.fill()}ctx.restore()}
function teardrop(ctx,w,L){ctx.beginPath();ctx.moveTo(-w,0);ctx.quadraticCurveTo(-w*0.7,L*0.55,0,L);ctx.quadraticCurveTo(w*0.7,L*0.55,w,0);ctx.closePath()}
/* layered jet flame: unit-length gradients are built once and stretched per frame */
let FLAME_G=null;
function flameGrads(ctx){
  const lg=st=>{const g=ctx.createLinearGradient(0,0,0,1);for(const s of st)g.addColorStop(s[0],s[1]);return g};
  return{c:ctx,out:lg([[0,'rgba(255,185,90,.95)'],[0.3,'rgba(255,115,30,.8)'],[0.7,'rgba(215,55,12,.32)'],[1,'rgba(150,25,0,0)']]),
    mid:lg([[0,'rgba(255,248,200,1)'],[0.45,'rgba(255,195,75,.85)'],[1,'rgba(255,120,25,0)']]),
    core:lg([[0,'rgba(205,232,255,1)'],[0.35,'rgba(255,255,240,.95)'],[1,'rgba(255,235,160,0)']])};
}
function flame(ctx,a,far){
  const fl=0.9+0.2*Math.random(),L=(38+14*Math.random())*a,al=far?0.72:1;
  if(!FLAME_G||FLAME_G.c!==ctx)FLAME_G=flameGrads(ctx);
  ctx.save();ctx.translate(8,R.footH+1);ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.55*al*fl;ctx.drawImage(SPR.fire,-26*a,-20*a,52*a,52*a);
  ctx.save();ctx.scale(a,L);ctx.globalAlpha=al;
  ctx.fillStyle=FLAME_G.out;teardrop(ctx,12.5*fl,1);ctx.fill();
  ctx.fillStyle=FLAME_G.mid;teardrop(ctx,7.5,0.74*fl);ctx.fill();
  ctx.fillStyle=FLAME_G.core;teardrop(ctx,3.8,0.42);ctx.fill();
  ctx.restore();
  ctx.globalAlpha=0.55*al;for(const k of [0.22,0.4])ctx.drawImage(SPR.glow,-4.5*a,L*k-3*a,9*a,6*a);
  const m=ctx.getTransform();emitPts.push({p:camFix(m.transformPoint(new DOMPoint(0,L*0.75))),a});
  ctx.restore();
}
/* hexagonal prism limb along +y: narrow at the joint, wide in the middle */
function prism(ctx,len,w0,wMid,w1,midAt,far){
  const m=len*midAt;
  poly(ctx,[[-w0,0],[w0,0],[wMid,m],[w1,len-4],[w1*0.6,len],[-w1*0.6,len],[-w1,len-4],[-wMid,m]]);paint(ctx,'body',far,{x:-wMid,w:wMid*2});
  poly(ctx,[[-w0*0.3,2],[w0*0.5,2],[wMid*0.45,m],[w1*0.4,len-5],[-w1*0.15,len-5],[-wMid*0.2,m]]);paint(ctx,'facet',far);
  poly(ctx,[[-wMid,m],[-wMid*0.55,m],[-w1*0.6,len-4],[-w1,len-4]]);paint(ctx,'shade',far);
}
function boot(ctx,far){
  rrect(ctx,-8,-3,16,7,2);paint(ctx,'ring',far,{x:-8,w:16});
  ctx.beginPath();ctx.moveTo(-15,3);ctx.lineTo(14,3);ctx.quadraticCurveTo(31,4,33,12);ctx.lineTo(33,R.footH);ctx.lineTo(-16,R.footH);ctx.quadraticCurveTo(-19,8,-15,3);
  paint(ctx,'body',far,{x:-18,w:52});
  detail(ctx,far,()=>{ctx.moveTo(-15,R.footH-4);ctx.lineTo(32,R.footH-4);ctx.moveTo(15,4);ctx.quadraticCurveTo(22,7,22,R.footH-4)});
  shine(ctx,()=>{ctx.moveTo(-10,6);ctx.lineTo(12,6)},0.25);
}
function hand(ctx,far,spread){
  rrect(ctx,-5,-2,10,6,2);paint(ctx,'ring',far,{x:-5,w:10});
  rrect(ctx,-7,3,14,11,3);paint(ctx,'body',far,{x:-7,w:14});
  for(const fx of [-4.5,0,4.5]){ctx.save();ctx.translate(fx,13);ctx.rotate(fx*0.05*spread);capsule(ctx,10,2,1.8);paint(ctx,'dark',far,{x:-2,w:4});ctx.translate(0,10);ctx.rotate(0.25);capsule(ctx,8,1.8,1.5);paint(ctx,'dark',far,{x:-2,w:4});ctx.restore()}
  ctx.save();ctx.translate(7,7);ctx.rotate(-0.6);capsule(ctx,10,2,1.8);paint(ctx,'dark',far,{x:-2,w:4});ctx.restore();
}
/* every rigid part is drawn through part(): normally it just draws,
   in capture mode it records its transform so the giant can fall apart */
let REC=null;
function part(ctx,id,pv,hh,fn){if(REC){REC.push({id,m:ctx.getTransform(),pv,hh,fn});return}fn(ctx)}
function leg(ctx,th,kn,P,fl,far,ox){
  const ft=-(P.tilt+th+kn)*(1-P.point)+P.point*0.55;
  ctx.save();ctx.translate(ox,R.hipY);ctx.rotate(th);
  part(ctx,'thigh',[0,R.thigh/2],9,ctx=>{
    capsule(ctx,R.thigh,5,4.5);paint(ctx,'ring',far,{x:-5,w:10});
    shine(ctx,()=>{ctx.moveTo(1.5,16);ctx.lineTo(1.5,R.thigh-8)},0.2);
    ctx.beginPath();ctx.arc(0,2,15,Math.PI*0.95,Math.PI*2.05);ctx.lineTo(13,10);ctx.quadraticCurveTo(0,16,-13,10);ctx.closePath();paint(ctx,'body',far,{x:-15,w:30});
    shine(ctx,()=>{ctx.arc(0,2,10,Math.PI*1.15,Math.PI*1.55)});
    rivets(ctx,[[-11,6],[0,9],[11,6]],far);
  });
  ctx.translate(0,R.thigh);
  ctx.rotate(kn);
  part(ctx,'shin',[0,R.shin/2],12,ctx=>{
    prism(ctx,R.shin,7,13,10,0.55,far);
    detail(ctx,far,()=>{ctx.moveTo(-12,R.shin*0.55+6);ctx.lineTo(12,R.shin*0.55+6)});
    rivets(ctx,[[-6,R.shin*0.55+10],[0,R.shin*0.55+11],[6,R.shin*0.55+10]],far);
    circle(ctx,0,0,7.5);paint(ctx,'joint',far);circle(ctx,0,0,3);paint(ctx,'dark',far);
  });
  ctx.translate(0,R.shin);
  ctx.rotate(ft);
  if(fl>0.01&&!REC)flame(ctx,fl,far);
  part(ctx,'foot',[8,9],8,ctx=>boot(ctx,far));
  ctx.restore();
}
function arm(ctx,a,e,far,gun=0){
  gun=gun||0;
  ctx.save();ctx.translate(far?-6:2,R.shoulderY);ctx.rotate(a);
  ctx.save();ctx.translate(0,R.upper);
  ctx.rotate(e);
  part(ctx,'fore',[0,R.fore/2+8],11,ctx=>{
    prism(ctx,R.fore,6,12,9,0.32,far);
    rivets(ctx,[[-4,R.fore*0.32+4],[4,R.fore*0.32+4]],far);
    ctx.save();ctx.translate(0,R.fore);
    if(gun>0.02){
      const L=10+28*gun;
      rrect(ctx,-6.5,-2,13,L,4);paint(ctx,'ring',far,{x:-7,w:13});
      rrect(ctx,-9,L-8,18,9,3);paint(ctx,'joint',far,{x:-9,w:18});
      detail(ctx,far,()=>{ctx.moveTo(-3,4);ctx.lineTo(-3,L-10);ctx.moveTo(3,4);ctx.lineTo(3,L-10)});
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(130,225,255,'+(0.3+0.6*gun)+')';ctx.shadowColor='#7fe0ff';ctx.shadowBlur=12;circle(ctx,0,L+1,5*gun);ctx.fill();ctx.restore();
    }else hand(ctx,far,1);
    ctx.restore();
  });
  ctx.restore();
  part(ctx,'upper',[0,18],16,ctx=>{
    capsule(ctx,R.upper,4.5,4.5);paint(ctx,'ring',far,{x:-5,w:10});
    circle(ctx,0,R.upper,6);paint(ctx,'joint',far);
    rrect(ctx,-20,-17,40,34,15);paint(ctx,'body',far,{x:-20,w:40});
    poly(ctx,[[-10,-12],[8,-12],[12,-4],[-6,-4]]);paint(ctx,'facet',far);
    detail(ctx,far,()=>{ctx.moveTo(-16,6);ctx.lineTo(16,6)});
    rivets(ctx,[[-11,10],[0,10],[11,10]],far);
  });
  ctx.restore();
}
const HEAD_X=12,HEAD_Y=-141,EYE_N=[HEAD_X+13,HEAD_Y-22],EYE_F=[HEAD_X+6,HEAD_Y-22];
function head(ctx,P){
  const blink=P.blink;
  part(ctx,'head',[HEAD_X+1,HEAD_Y-22],18,ctx=>{
    ctx.save();ctx.translate(HEAD_X,HEAD_Y);if(P.hl)ctx.rotate(P.hl);
    rrect(ctx,-6,-6,12,10,2);paint(ctx,'ring',false,{x:-6,w:12});
    ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(-14,-26);ctx.bezierCurveTo(-14,-40,-6,-45,1,-45);ctx.bezierCurveTo(10,-45,16,-38,16,-26);ctx.lineTo(16,-8);ctx.quadraticCurveTo(15,0,9,1);ctx.closePath();
    paint(ctx,'head',false,{x:-14,w:30});
    poly(ctx,[[2,-41],[12,-36],[14,-28],[14,-12],[8,-12],[6,-30]]);paint(ctx,'facet');
    shine(ctx,()=>{ctx.moveTo(-8,-34);ctx.quadraticCurveTo(-2,-42,6,-42)});
    detail(ctx,false,()=>{ctx.moveTo(-14,-27);ctx.quadraticCurveTo(2,-31,16,-28);ctx.moveTo(1,-45);ctx.quadraticCurveTo(-6,-36,-10,-27);
      for(let gx=4;gx<=13;gx+=3){ctx.moveTo(gx,-14);ctx.lineTo(gx,-3)}});
    circle(ctx,-4,-17,4);paint(ctx,'joint');
    const ry=4.2*blink;
    ctx.beginPath();ctx.ellipse(EYE_F[0]-HEAD_X,EYE_F[1]-HEAD_Y,2.4,Math.max(0.6,ry*0.9),0,0,Math.PI*2);paint(ctx,'eye',true);
    ctx.beginPath();ctx.ellipse(EYE_N[0]-HEAD_X,EYE_N[1]-HEAD_Y,3.8,Math.max(0.8,ry),0,0,Math.PI*2);paint(ctx,'eye');
    ctx.restore();
  });
}
function waist(ctx){
  part(ctx,'waist',[2,-18],16,ctx=>{
    const rings=[[-46,48,6],[-40,38,7],[-33,32,7],[-26,36,7]];
    for(const [y,w,h] of rings){rrect(ctx,-w/2+2,y,w,h,3);paint(ctx,'ring',false,{x:-w/2,w:w})}
    rrect(ctx,-27,-20,58,11,4);paint(ctx,'ring',false,{x:-27,w:58});
    rivets(ctx,[[-20,-14.5],[-10,-14.5],[0,-14.5],[10,-14.5],[20,-14.5]]);
    rrect(ctx,-12,-10,26,20,5);paint(ctx,'dark',false,{x:-12,w:26});
  });
}
const CHEST=[[-24,-148],[28,-150],[50,-132],[54,-86],[36,-50],[-16,-48],[-28,-72],[-32,-124]];
function torso(ctx){
  waist(ctx);
  part(ctx,'chest',[10,-100],38,ctx=>{
    poly(ctx,CHEST);paint(ctx,'body',false,{x:-32,w:86});

function stepParts(dt,G){

    else{p.vx*=1-Math.min(1,dt*1.8);p.vy=p.vy*(1-Math.min(1,dt*1.5))-(p.k==='smoke'?14:4)*dt;if(p.y>G-1){p.y=G-1;p.vy=-Math.abs(p.vy)*0.2}}}

/* ---------- robot state ---------- */
const bot={x:-250,vx:0,dir:1,p:0,amp:0,state:'fly',t:0,clock:0,alt:0,target:0,ramp:1,stepIdx:0,wave:0,
  view:0,vf:0,raise:0,hit:0,armAim:0,armGun:0,aimA:0,turret:0,turretAng:-0.5,eyeCharge:0,draw:null};
const events=[];
function update(s,c,dt,maxAlt){
  s.clock+=dt;s.t+=dt;s.wave=Math.max(0,s.wave-dt);s.hit=Math.max(0,s.hit-dt);
  if(s.state==='broken')return;
  if(Math.abs(c.h)>0.15)s.dir=Math.sign(c.h);
  else if(c.face)s.dir=c.face;
  if(c.faceForce)s.dir=c.faceForce;
  s.vf+=clamp(s.view-s.vf,-dt/0.55,dt/0.55);
  if(s.state==='ground'){
    s.vx+=(VW*c.h-s.vx)*Math.min(1,dt*4);
    const sp=Math.abs(s.vx)/VW;
    s.amp+=(Math.min(1,sp*1.2)-s.amp)*Math.min(1,dt*5);
    s.p+=OMEGA*sp*dt;
    const si=Math.floor(s.p/Math.PI);if(si!==s.stepIdx){s.stepIdx=si;if(s.amp>0.4)events.push('step')}
    if(c.up){s.state='launch';s.t=0}
  }else if(s.state==='launch'){
    s.vx*=1-Math.min(1,dt*3);
    if(s.t>0.5){s.state='fly';s.t=0;s.ramp=0;s.target=Math.min(maxAlt,70);events.push('liftoff')}
  }else if(s.state==='fly'){
    s.ramp=Math.min(1,s.ramp+dt/0.6);
    if(c.alt!=null)s.target=clamp(c.alt,0,maxAlt);
    s.target=Math.min(s.target,maxAlt);
    s.alt+=(s.target-s.alt)*Math.min(1,dt*1.8);
    s.vx+=(VF*c.h-s.vx)*Math.min(1,dt*1.6);
    if(s.target<=0&&s.alt<1.2){s.state='land';s.t=0;s.alt=0;s.target=0;events.push('land')}
  }else{
    s.vx*=1-Math.min(1,dt*5);
    if(s.t>0.55){s.state='ground';s.t=0;s.amp=0}
  }
  s.x+=s.vx*dt;
}
function poseOf(s){
  const ground=walkPose(s.p,s.amp,s.clock);
  const sf=Math.min(1,Math.abs(s.vx)/VF)*smooth(5,50,s.alt);
  const air=lerpPose(HOVER,flyPose(s.clock),sf);
  let P,flame=0;
  if(s.state==='ground')P=ground;
  else if(s.state==='launch'){P=lerpPose(ground,CROUCH,smooth(0,0.4,s.t));flame=smooth(0.25,0.5,s.t)}
  else if(s.state==='fly'){P=lerpPose(CROUCH,air,smooth(0,1,s.ramp));flame=0.75+0.25*clamp((s.target-s.alt)/20,0,1)}
  else{P=lerpPose(lerpPose(HOVER,CROUCH,smooth(0,0.12,s.t)),walkPose(0,0,s.clock),smooth(0.18,0.55,s.t));flame=1-smooth(0,0.15,s.t)}
  if(s.wave>0&&s.state==='ground'){
    const k=smooth(0,0.35,s.wave)*(1-s.amp),w=Math.sin(s.clock*9);
    P.armN+=(-2.75+0.3*w-P.armN)*k;P.elbowN+=(-0.55+0.45*w-P.elbowN)*k;
  }
  if(s.hit>0)P.tilt-=0.3*Math.sin(s.hit/0.5*Math.PI);
  P.blink=(s.clock%3.7)<0.12?0.12:1;
  return{P,flame};
}

/* ---------- geometry helpers: robot-local <-> screen ---------- */
function toWorld(lx,ly){const d=bot.draw,c=Math.cos(d.tilt),s=Math.sin(d.tilt);return{x:d.x+(lx*c-ly*s)*d.dir*SC,y:d.y+(lx*s+ly*c)*SC}}
function toLocalVec(vx,vy){const d=bot.draw,ux=vx/(d.dir*SC),uy=vy/SC,c=Math.cos(d.tilt),s=Math.sin(d.tilt);return{x:ux*c+uy*s,y:-ux*s+uy*c}}
function botCenter(){return bot.draw?toWorld(4,-90):{x:bot.x,y:G-150*SC}}

/* ---------- FPV drones ---------- */
const drones=[],bullets=[];
const BATTERY=['#e8b52a','#3a7bd5','#d6453d','#4caf50','#ff7f2a'];
function spawnDrone(){
  const side=Math.random()<0.5?-1:1;
  drones.push({x:side<0?-60:W+60,y:rand(0.08,0.45)*G,vx:-side*220*ds,vy:0,alive:true,state:'fly',t:0,
    th:Math.random()*6.28,om:(Math.random()<0.5?-1:1)*rand(0.5,1.0),rad:rand(190,330)*ds,diveIn:rand(4,10),
    seed:Math.random()*100,bat:BATTERY[Math.floor(Math.random()*BATTERY.length)],spin:0,vr:0,tilt:0});
}
function killDrone(d,mode){
  if(!d.alive)return;d.alive=false;
  if(mode==='wreck'){d.state='falling';d.vy=-90*ds;d.vx*=0.4;d.vr=(Math.random()-0.5)*16;explosion(d.x,d.y,0.4*ds)}
  else{explosion(d.x,d.y,ds);const i=drones.indexOf(d);if(i>=0)drones.splice(i,1)}
}
function updateDrones(dt){
  const c=botCenter();
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i];d.t+=dt;
    if(d.state==='falling'){
      d.vy+=520*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.spin+=d.vr*dt;
      if(Math.random()<0.7)spawn({k:'smoke',x:d.x,y:d.y,vx:(Math.random()-0.5)*20,vy:-10,life:1.2,max:1.2,r:3*ds,grow:14*ds});
      if(Math.random()<0.5)spawn({k:'fire',x:d.x,y:d.y,vx:0,vy:0,life:0.25,max:0.25,r:4*ds,grow:16*ds});
      if(d.y>=G-4){explosion(d.x,G-6,0.8*ds);drones.splice(i,1)}
      continue;
    }
    let tx,ty,maxV=300*ds;
    if(d.state==='dive'){const fa=d.fatal?fatalAim(d):null;tx=fa?fa.x:c.x;ty=fa?fa.y:c.y;maxV=(fa?fa.v:d.fatal?560:430)*ds;if(d.t>1.8&&!d.fatal){d.state='fly';d.t=0;d.diveIn=rand(4,9)}}
    else{
      d.th+=d.om*dt;tx=c.x+Math.cos(d.th)*d.rad;ty=clamp(c.y-60*ds+Math.sin(d.th)*d.rad*0.55,30,G-50);
      d.diveIn-=dt;if(d.diveIn<=0){d.state='dive';d.t=0}
    }
    let dvx=(tx-d.x)*1.8,dvy=(ty-d.y)*1.8;const m=Math.hypot(dvx,dvy);if(m>maxV){dvx*=maxV/m;dvy*=maxV/m}
    if(d.state!=='dive'){dvx+=Math.sin(d.t*3+d.seed)*40*ds;dvy+=Math.cos(d.t*2.3+d.seed)*30*ds}
    const a=Math.min(1,dt*(d.state==='dive'?3.5:2.2));d.vx+=(dvx-d.vx)*a;d.vy+=(dvy-d.vy)*a;
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.tilt=clamp(d.vx/(500*ds),-0.55,0.55);
    if(d.state==='dive'&&(d.lk?d.lk==='dive'&&shieldHit(d):Math.hypot(d.x-c.x,d.y-c.y)<40*ds)){
      drones.splice(i,1);
      if(d.fatal&&bot.state!=='broken'){breakApart(d.x,d.y);continue}
      explosion(d.x,d.y,ds);bot.hit=0.5;
    }
  }
}
function drawDrone(ctx,d,t){
  ctx.save();ctx.translate(d.x,d.y);
  if(d.state==='falling')ctx.rotate(d.spin);else ctx.rotate(d.tilt);
  ctx.scale(ds*(d.vx<0?-1:1),ds);ctx.lineCap='round';
  const live=d.state!=='falling';
  ctx.strokeStyle='#1d1f24';ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(16,0);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(-15,-1);ctx.lineTo(15,-1);ctx.stroke();
  for(const px of [-16,16]){ctx.fillStyle='#2a2d33';ctx.beginPath();ctx.roundRect(px-3,-6,6,7,1.5);ctx.fill();
    ctx.fillStyle='#9097a0';ctx.fillRect(px-3,-6.2,6,1.4);ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(px-1.8,-4.6,1,5)}
  if(live){

      ctx.strokeStyle='rgba(28,30,34,.5)';ctx.lineWidth=0.9;ctx.beginPath();const k=Math.sin(t*47+px)*11;ctx.moveTo(px-k,-7);ctx.lineTo(px+k,-7);ctx.stroke();

/* ---------- projectiles ---------- */
function firePlasma(x,y,tx,ty){const a=Math.atan2(ty-y,tx-x),v=950*ds;bullets.push({k:'plasma',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.4})}
function fireMissile(x,y,ang,target){bullets.push({k:'missile',x,y,vx:Math.cos(ang)*160*ds,vy:Math.sin(ang)*160*ds,sp:160*ds,life:3.2,target})}
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life-=dt;
    if(b.k==='missile'){
      b.sp=Math.min(700*ds,b.sp+1000*ds*dt);let ang=Math.atan2(b.vy,b.vx);
      if(b.target&&b.target.alive){const want=Math.atan2(b.target.y-b.y,b.target.x-b.x);let da=((want-ang+Math.PI*3)%(Math.PI*2))-Math.PI;ang+=clamp(da,-5*dt,5*dt)}
      b.vx=Math.cos(ang)*b.sp;b.vy=Math.sin(ang)*b.sp;
      if(Math.random()<0.9)spawn({k:'smoke',x:b.x,y:b.y,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,life:0.8,max:0.8,r:2*ds,grow:10*ds});
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    let hit=null;
    for(const d of drones){if(d.alive&&!d.fatal&&Math.hypot(d.x-b.x,d.y-b.y)<(b.k==='missile'?22:17)*ds){hit=d;break}}
    if(hit){
      if(b.k==='plasma'){killDrone(hit,Math.random()<0.5?'explode':'wreck');spawn({k:'flash',x:b.x,y:b.y,vx:0,vy:0,life:0.12,max:0.12,r:4,grow:120})}
      else{explosion(b.x,b.y,1.1*ds);for(const d of drones.slice())if(d.alive&&!d.fatal&&Math.hypot(d.x-b.x,d.y-b.y)<75*ds)killDrone(d,'explode')}
      bullets.splice(i,1);continue;
    }
    if(b.life<=0||b.x<-120||b.x>W+120||b.y<-120||b.y>G){
      if(b.k==='missile')explosion(b.x,Math.min(b.y,G-4),0.6*ds);
      bullets.splice(i,1);
    }
  }
}
function drawBullets(ctx){
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';

      ctx.globalAlpha=1;ctx.strokeStyle=g;ctx.lineWidth=6*ds;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.strokeStyle='rgba(236,253,255,.95)';ctx.lineWidth=2.2*ds;ctx.beginPath();ctx.moveTo(b.x-b.vx*0.025,b.y-b.vy*0.025);ctx.lineTo(b.x,b.y);ctx.stroke();
      sprite(ctx,SPR.cyan,b.x,b.y,13*ds,0,0.85);
    }else{
      const tr=b.tr||(b.tr=[]);tr.push(b.x,b.y);if(tr.length>18)tr.splice(0,2);
      ctx.globalAlpha=1;for(let i=2;i<tr.length;i+=2){const k=i/tr.length;ctx.strokeStyle='rgba(255,'+(110+Math.floor(110*k))+',50,'+(0.55*k)+')';ctx.lineWidth=(0.8+2.4*k)*ds;ctx.beginPath();ctx.moveTo(tr[i-2],tr[i-1]);ctx.lineTo(tr[i],tr[i+1]);ctx.stroke()}

      ctx.fillStyle='rgba(255,150,50,.9)';teardrop2(ctx);ctx.fillStyle='rgba(255,245,210,.95)';ctx.beginPath();ctx.ellipse(-9,0,3,1.4,0,0,Math.PI*2);ctx.fill();
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#6e747b';ctx.beginPath();ctx.moveTo(-8,-2);ctx.lineTo(-11,-4.6);ctx.lineTo(-4,-2);ctx.moveTo(-8,2);ctx.lineTo(-11,4.6);ctx.lineTo(-4,2);ctx.fill();

/* ---------- weapons: eye lasers, arm cannon, shoulder rockets ---------- */
const wp={state:'idle',kind:null,t:0,target:null,shots:0,next:0,cd:1.2,beam:null,turretUsed:false};
function pickTarget(){
  const c=botCenter();let best=null,bs=1e9;
  for(const d of drones){if(!d.alive||d.fatal)continue;let s=Math.hypot(d.x-c.x,d.y-c.y);if(d.state==='dive')s*=0.3;if(d.x<10||d.x>W-10)s+=2000;if(s<bs){bs=s;best=d}}
  return best;
}
function chooseWeapon(t){
  const c=botCenter(),dist=Math.hypot(t.x-c.x,t.y-c.y)/ds,r=Math.random();
  if(t.state==='dive'||dist<230)return r<0.6?'laser':(r<0.85?'arm':'shoulder');
  if(dist<420)return r<0.42?'arm':(r<0.72?'laser':'shoulder');
  return r<0.55?'shoulder':(r<0.8?'arm':'laser');
}
function shoot(k,T){
  if(k==='arm'){
    const a=bot.aimA,L=R.upper+R.fore+36,m=toWorld(2-Math.sin(a)*L,R.shoulderY+Math.cos(a)*L);
    const tt=Math.hypot(T.x-m.x,T.y-m.y)/(950*ds);
    firePlasma(m.x,m.y,T.x+T.vx*tt,T.y+T.vy*tt);
    spawn({k:'flash',x:m.x,y:m.y,vx:0,vy:0,life:0.1,max:0.1,r:4,grow:160*ds});
  }else{
    const py=TURRET_Y-TURRET_RISE*bot.turret,c=Math.cos(bot.turretAng),s=Math.sin(bot.turretAng),oy=wp.shots%2?3.6:-3.6;
    const m=toWorld(TURRET_X+30*c-oy*s,py+30*s+oy*c),m2=toWorld(TURRET_X+50*c-oy*s,py+50*s+oy*c);
    fireMissile(m.x,m.y,Math.atan2(m2.y-m.y,m2.x-m.x),T);
    for(let i=0;i<5;i++)spawn({k:'smoke',x:m.x,y:m.y,vx:(Math.random()-0.5)*60,vy:(Math.random()-0.5)*60,life:0.9,max:0.9,r:3*ds,grow:16*ds});
    spawn({k:'flash',x:m.x,y:m.y,vx:0,vy:0,life:0.12,max:0.12,r:4,grow:120*ds});
  }
}
function weapons(dt,active){
  const ease=(v,to,rate)=>v+clamp(to-v,-rate*dt,rate*dt);
  wp.cd-=dt;
  if(!active){wp.turretUsed=false;wp.beam=null;if(wp.state!=='idle')wp.state='idle'}
  if(wp.state!=='idle'&&wp.state!=='recover'&&!(wp.kind==='laser'&&wp.state==='fire')&&(!wp.target||!wp.target.alive)){
    const nt=pickTarget();if(nt)wp.target=nt;else{wp.state='recover';wp.t=0}
  }
  if(wp.state==='idle'){
    if(active&&wp.cd<=0&&(bot.state==='ground'||bot.state==='fly')&&bot.vf<0.05){
      const t=pickTarget();if(t){wp.target=t;wp.kind=chooseWeapon(t);wp.state='aim';wp.t=0;wp.shots=0;if(wp.kind==='shoulder')wp.turretUsed=true}
    }
  }else wp.t+=dt;
  const k=wp.kind,T=wp.target,busy=wp.state==='aim'||wp.state==='fire';
  if(wp.state==='aim'){
    const ready=k==='laser'?wp.t>0.3:k==='arm'?(bot.armAim>0.95&&bot.armGun>0.95):(bot.turret>0.95&&wp.t>0.25);
    if(ready){wp.state='fire';wp.t=0;wp.next=0}
  }else if(wp.state==='fire'&&T){
    if(k==='laser'){wp.beam=T;if(wp.t>0.12&&T.alive&&!T.fatal)killDrone(T,'wreck');if(wp.t>0.45){wp.beam=null;wp.state='recover';wp.t=0}}
    else{wp.next-=dt;if(wp.next<=0){shoot(k,T);wp.shots++;wp.next=k==='arm'?0.13:0.3;if(wp.shots>=(k==='arm'?3:2)){wp.state='recover';wp.t=0}}}
  }else if(wp.state==='recover'){wp.beam=null;if(wp.t>0.3){wp.state='idle';wp.cd=rand(0.4,1.0)}}
  bot.armAim=ease(bot.armAim,busy&&k==='arm'?1:0,1/0.28);
  bot.armGun=ease(bot.armGun,busy&&k==='arm'?1:0,1/0.3);
  bot.turret=ease(bot.turret,(active&&wp.turretUsed)||(busy&&k==='shoulder')?1:0,1/0.4);
  bot.eyeCharge=ease(bot.eyeCharge,busy&&k==='laser'?1:0,1/0.2);
}
function drawLaser(ctx){
  if(!wp.beam)return;const T=wp.beam;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(const e of [EYE_N,EYE_F]){
    const p=toWorld(e[0],e[1]),fl=0.8+0.2*Math.random();
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(T.x,T.y);
    ctx.strokeStyle='rgba(255,70,30,'+(0.35*fl)+')';ctx.lineWidth=9*ds;ctx.stroke();
    ctx.strokeStyle='rgba(255,150,70,'+(0.8*fl)+')';ctx.lineWidth=3.5*ds;ctx.stroke();
    ctx.strokeStyle='#fff6dc';ctx.lineWidth=1.4*ds;ctx.stroke();
  }
  laserGlow(ctx,T);ctx.restore();
  for(let i=0;i<2;i++)spawn({k:'spark',x:T.x,y:T.y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,life:0.4,max:0.4,r:1,grow:0});
}

/* ---------- life: what the giant decides to do next ---------- */
let W=800,H=600,G=598,dpr=1,mouse={x:-1e4,y:-1e4,t:0};
const maxAltNow=()=>Math.max(50,G-350*SC-20);
function flyTask(){
  const m=maxAltNow(),n=1+Math.floor(Math.random()*3),pts=[];
  for(let i=0;i<n;i++)pts.push({x:rand(120,W-120),alt:rand(0.35,1)*m,hold:rand(0.4,2)});
  const lx=rand(120,W-120);pts.push({x:lx,alt:m*0.3,hold:0.3},{x:lx,alt:0,hold:0});
  return{k:'fly',pts,i:0,h:0};
}
function leaveTask(){
  const m=maxAltNow(),side=Math.random()<0.5?-1:1,off=side<0?-320:W+320,back=side<0?W+320:-320,lx=rand(150,W-150);
  return{k:'fly',pts:[{x:off,alt:m,hold:rand(4,10),tp:back},{x:lx,alt:m*0.55,hold:0.6},{x:lx,alt:0,hold:0}],i:0,h:0};
}
function battleTask(){return{k:'battle',mode:Math.random()<0.5?'ground':'air',toSpawn:3+Math.floor(Math.random()*5),spawnT:0.8,hx:clamp(bot.x,W*0.25,W*0.75)}}
function nextTask(){
  const r=Math.random();
  if(r<0.28)return{k:'walk',x:rand(90,W-90)};
  if(r<0.44)return{k:'idle',t:rand(2,5)};
  if(r<0.52)return{k:'wave',t:2.4};
  if(r<0.60)return{k:'look',stage:0,t:0};
  if(r<0.78)return flyTask();
  if(r<0.84)return leaveTask();
  return battleTask();
}
let task=null,queue=[];
function arrive(){
  const m=maxAltNow(),fromLeft=Math.random()<0.5,lx=rand(W*0.3,W*0.7);
  drones.length=0;bullets.length=0;pieces=null;wreck=null;
  Object.assign(bot,{x:fromLeft?-260:W+260,vx:0,dir:fromLeft?1:-1,state:'fly',t:0,alt:m*0.8,target:m*0.8,ramp:1,view:0,vf:0,raise:0});
  task={k:'fly',pts:[{x:lx,alt:m*0.45,hold:0.6},{x:lx,alt:0,hold:0}],i:0,h:0};queue=[{k:'wave',t:2.4}];
  if(window.GIANT_FIRST_BATTLE)queue.push(battleTask());
  if(window.GIANT_FIRST_CHASE)queue.push(chaseTask(window.GIANT_FIRST_CHASE));
  if(window.GIANT_FIRST_BOY)queue.push(boyVisit(true));
}
function startBattle(){if(!task||task.k!=='battle'){task=battleTask();queue=[]}}
let battleOn=false;
function think(dt){
  const c={h:0,up:false,alt:null,face:0,faceForce:0};
  battleOn=false;
  if(!task)task=directorNext();
  const t=task,busy=bot.state==='launch'||bot.state==='land';
  if(t.k!=='look'&&t.k!=='victory'&&t.k!=='battle')bot.view=0;
  if(t.k==='chase')return chaseThink(t,c,dt,busy);
  if(t.k==='boy')return boyThink(t,c,dt,busy);
  if(t.k==='finale'||t.k==='knock')return cinemaThink(t,c,dt,busy);
  if(t.k==='walk'){
    if(bot.state!=='ground'){task=null;return c}
    const dx=t.x-bot.x;c.h=clamp(dx/60,-1,1);if(Math.abs(dx)<6&&Math.abs(bot.vx)<6)task=null;
  }else if(t.k==='idle'||t.k==='wave'){
    if(t.k==='wave'&&!t.started){t.started=true;bot.wave=t.t}
    if(!busy&&performance.now()-mouse.t<4000&&Math.abs(mouse.x-bot.x)<500)c.face=mouse.x>bot.x?1:-1;
    t.t-=dt;if(t.t<=0)task=null;
  }else if(t.k==='fly'){
    if(bot.state==='ground'){if(t.i>=t.pts.length){task=null;return c}c.up=true;return c}
    if(bot.state!=='fly')return c;
    const wp_=t.pts[Math.min(t.i,t.pts.length-1)],dx=wp_.x-bot.x;
    c.h=clamp(dx/220,-1,1);c.alt=wp_.alt;
    if(t.i<t.pts.length&&Math.abs(dx)<30&&Math.abs(bot.alt-wp_.alt)<12){
      t.h+=dt;if(t.h>=wp_.hold){if(wp_.tp!=null){bot.x=wp_.tp;bot.vx=0;bot.dir=wp_.tp<0?1:-1}t.i++;t.h=0}
    }
  }else if(t.k==='battle'){
    bot.view=0;battleOn=bot.vf<0.05;
    t.spawnT-=dt;if(t.toSpawn>0&&t.spawnT<=0){spawnDrone();t.toSpawn--;t.spawnT=rand(0.35,1.0)}
    if(t.toSpawn===0&&!t.fatalSet){const alive=drones.filter(d=>d.alive);if(alive.length===1){const d=alive[0];d.fatal=true;d.state='dive';d.t=0;t.fatalSet=true}}
    const tg=(wp.target&&wp.target.alive&&!wp.target.fatal?wp.target:pickTarget())||drones.find(d=>d.fatal);
    if(t.mode==='air'){if(bot.state==='ground')c.up=true;else if(bot.state==='fly'){c.alt=maxAltNow()*0.45;c.h=clamp((t.hx-bot.x)/300,-0.3,0.3)}}
    if(tg)c.faceForce=tg.x>bot.x?1:-1;
    if(t.toSpawn===0&&!drones.some(d=>d.alive))task={k:'victory',stage:0,t:0};
    if(t.boy)boyBattle(t,c,dt);
  }else if(t.k==='broken'){
    bot.view=0;
  }else if(t.k==='victory'||t.k==='look'){
    t.t+=dt;
    if(t.stage===0){if(bot.state==='fly'){c.alt=0;c.h=0}else if(bot.state==='ground'&&!drones.length&&bot.turret<0.05){t.stage=1;t.t=0}}
    else if(t.stage===1){bot.view=1;if(bot.vf>=1){t.stage=2;t.t=0}}
    else if(t.stage===2){
      if(t.k==='victory')bot.raise=smooth(0.6,1.1,t.t)*(1-smooth(2.6,3.1,t.t));
      if(t.t>(t.k==='victory'?4.5:3.2))t.stage=3;
    }else{bot.raise=0;bot.view=0;if(bot.vf<=0)task=null}
  }
  return c;
}

/* ---------- falling apart and putting himself back together ---------- */
let pieces=null,wreck=null;
const GATHER_ORDER={foot:0,shin:0.35,thigh:0.7,waist:1.05,chest:1.4,upper:1.8,fore:2.15,head:2.6};
function capturePose(P,x,y,dir){
  const st=bot.turret,sg=bot.armGun;bot.turret=0;bot.armGun=0;
  REC=[];ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);drawRobot(ctx,P,0,x,y,dir);ctx.restore();
  const rec=REC;REC=null;bot.turret=st;bot.armGun=sg;
  return rec.map(r=>{const m=r.m,ky=Math.hypot(m.c,m.d),kx=(m.a*m.d-m.b*m.c)/ky,a=Math.atan2(-m.c,m.d),pw=m.transformPoint(new DOMPoint(r.pv[0],r.pv[1]));
    return{id:r.id,fn:r.fn,pv:r.pv,hh:r.hh*SC,x:pw.x/dpr,y:pw.y/dpr,a,kx,ky,vx:0,vy:0,va:0}});
}
function breakApart(hx,hy){
  if(!bot.draw||!bot.lastP)return;
  pieces=capturePose(bot.lastP,bot.draw.x,bot.draw.y,bot.dir);
  for(const p of pieces){
    const dx=p.x-hx,dy=p.y-hy,d=Math.hypot(dx,dy)||1,f=(360+Math.random()*280)*ds;
    p.vx=dx/d*f*0.8+(Math.random()-0.5)*180*ds;p.vy=dy/d*f*0.4-(240+Math.random()*280)*ds;p.va=(Math.random()-0.5)*16;
  }
  explosion(hx,hy,2.2*ds);
  for(let i=0;i<4;i++)explosion(hx+(Math.random()-0.5)*90*ds,hy+(Math.random()-0.5)*90*ds,(0.6+Math.random()*0.6)*ds);
  wreck={stage:'fall',t:0,dir:bot.dir,eyes:0,twitch:0.8};
  Object.assign(bot,{state:'broken',vx:0,armAim:0,armGun:0,turret:0,eyeCharge:0,hit:0});
  wp.state='idle';wp.beam=null;wp.target=null;wp.turretUsed=false;
  bullets.length=0;
  task={k:'broken'};queue=[];
}
function startGather(){
  let sx=0;for(const p of pieces)sx+=p.x;
  const ax=clamp(sx/pieces.length,140,W-140),st=walkPose(0,0,bot.clock);st.blink=1;
  const y=G-Math.max(footDrop(st.thighN,st.kneeN,st.tilt),footDrop(st.thighF,st.kneeF,st.tilt))*SC;
  const tg=capturePose(st,ax,y,wreck.dir);
  pieces.forEach((p,i)=>{const q=tg[i];let da=((q.a-p.a)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
    p.g={x0:p.x,y0:p.y,a0:p.a,x1:q.x,y1:q.y,a1:p.a+da,s:GATHER_ORDER[p.id]+Math.random()*0.15,d:0.7+Math.random()*0.2,h:(50+Math.random()*90)*ds,done:false};p.kx=q.kx;p.ky=q.ky});
  wreck.stage='gather';wreck.t=0;wreck.ax=ax;wreck.eyes=0;

function updatePieces(dt){
  wreck.t+=dt;
  if(wreck.stage!=='gather'){
    for(const p of pieces){
      p.vy+=1100*ds*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;
      if(p.x<20||p.x>W-20){p.x=clamp(p.x,20,W-20);p.vx*=-0.5}
      if(p.y>G-p.hh){
        p.y=G-p.hh;
        if(p.vy>70*ds){p.vy*=-0.3;dustBurst(p.x,G,3,0.4*ds)}else p.vy=0;
        p.vx*=1-Math.min(1,dt*6);p.va*=1-Math.min(1,dt*6);
        const flat=Math.round(p.a/(Math.PI/2))*(Math.PI/2);p.a+=(flat-p.a)*Math.min(1,dt*5);
      }
    }
    if(wreck.stage==='fall'&&wreck.t>1.6){wreck.stage='lie';wreck.t=0}
    if(wreck.stage==='lie'){
      wreck.twitch-=dt;
      if(wreck.twitch<=0){wreck.twitch=rand(0.25,0.8);const p=pieces[Math.floor(Math.random()*pieces.length)];
        p.vy=-(70+Math.random()*110)*ds;p.va=(Math.random()-0.5)*5;
        for(let i=0;i<4;i++)spawn({k:'spark',x:p.x,y:p.y,vx:(Math.random()-0.5)*160,vy:-Math.random()*160,life:0.4,max:0.4,r:1,grow:0})}
      if(Math.random()<dt*3){const p=pieces[Math.floor(Math.random()*pieces.length)];spawn({k:'smoke',x:p.x,y:p.y,vx:(Math.random()-0.5)*10,vy:-15,life:1.6,max:1.6,r:3*ds,grow:12*ds})}
      wreck.eyes=wreck.t>2.6+(wreck.boy||0)?(Math.random()<0.5?1:0):0;
      if(wreck.t>3.4+(wreck.boy||0))startGather();
    }
  }else{
    let all=true;
    for(const p of pieces){
      const g=p.g,k=(wreck.t-g.s)/g.d;
      if(k<0){all=false;p.x=g.x0+Math.sin(wreck.t*40+g.s*10)*0.8;continue}
      const e=smooth(0,1,Math.min(1,k));
      p.x=g.x0+(g.x1-g.x0)*e;p.y=g.y0+(g.y1-g.y0)*e-g.h*Math.sin(Math.PI*Math.min(1,k));p.a=g.a0+(g.a1-g.a0)*e;
      if(k>=1&&!g.done){g.done=true;p.x=g.x1;p.y=g.y1;p.a=g.a1;
        for(let i=0;i<10;i++)spawn({k:'spark',x:p.x,y:p.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,life:0.35,max:0.35,r:1,grow:0});
        spawn({k:'flash',x:p.x,y:p.y,vx:0,vy:0,life:0.12,max:0.12,r:3,grow:90*ds});
        if(p.id==='head')wreck.eyes=1;}
      if(k<1)all=false;
    }
    if(all&&wreck.t>0){wreck.done=(wreck.done||0)+dt;
      if(wreck.done>0.5){
        Object.assign(bot,{state:'ground',x:wreck.ax,dir:wreck.dir,vx:0,alt:0,target:0,amp:0,ramp:0,t:0,view:0,vf:0});
        pieces=null;wreck=null;task={k:'victory',stage:0,t:0};
      }}
  }
}
function drawPieces(ctx){

function fxUpdate(dt){

    if(f.k==='shock'){const e=1-f.life/f.max;f.r=f.R*(1-(1-e)*(1-e))}
    else if(f.k==='gring'){f.r+=f.vr*dt;f.vr*=1-Math.min(1,dt*4.5)}
    else if(f.k==='ember'){const d=1-Math.min(1,dt*1.6);f.vx=f.vx*d+Math.sin(f.ph+f.life*7)*30*dt;f.vy=f.vy*d-28*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.y>G-1){f.y=G-1;f.vy*=-0.3}}

    if(sp>0.5&&Math.random()<dt*30*(sp-0.4)){const q=toWorld(rand(-30,50),rand(-170,40));addFx({k:'streak',x:q.x,y:q.y,len:Math.abs(bot.vx)*rand(0.09,0.18),dir:Math.sign(bot.vx),life:0.32,max:0.32})}}
  /* falling apart: pieces smoke in flight; reassembly: warm glints trail the moving parts */
  if(pieces&&wreck){for(const p of pieces){
    if(wreck.stage==='fall'&&p.y<G-p.hh-6&&Math.random()<dt*28)spawn({k:'smoke',x:p.x,y:p.y,vx:p.vx*0.1,vy:-12,life:1.1,max:1.1,r:4*ds,grow:20*ds});
    else if(wreck.stage==='gather'&&p.g&&!p.g.done&&wreck.t>p.g.s&&Math.random()<dt*36)addFx({k:'glint',x:p.x+rand(-5,5)*ds,y:p.y+rand(-5,5)*ds,life:0.4,max:0.4,r:rand(5,9)*ds});
  }}
}

/* ---------- story: the chase (a little sputnik, or a butterfly) ---------- */
let toy=null;

const FRONT_ARM={k:0,want:0,a:-0.16,e:0.06};

function spawnToy(kind,side){
  const sat=kind==='sat';
  toy={kind,x:side<0?-40:W+40,y:sat?Math.max(40,G-300*SC-80*ds):G-rand(120,190)*ds,vx:0,vy:0,tx:0,ty:0,sp:sat?200:130,wob:sat?18:22,
    mode:'go',soft:false,t:0,seed:Math.random()*100,rings:[],beep:0.4,ang:Math.PI*0.6,flip:1};

}
function freeToy(){if(toy&&toy.mode!=='free'){toy.mode='free';toy.sp=40;toy.tx=clamp(toy.x+rand(-300,300)*ds,0,W);toy.ty=-200}}
function skyBand(){const top=Math.max(50,G-maxAltNow()-170*SC),bot_=Math.max(top+40,G-300*SC-40*ds);return[top,bot_]}
function updateToy(dt){
  const o=toy;o.t+=dt;
  if(o.mode==='held'){
    const hx=handW.x,hy=handW.y-(o.kind==='sat'?2:7)*ds;
    if(o.soft){const a=Math.min(1,dt*14);o.x+=(hx-o.x)*a;o.y+=(hy-o.y)*a}else{o.x=hx;o.y=hy}
    o.vx=0;o.vy=0;
  }else if(o.mode==='sit'){o.vx=0;o.vy=0}
  else{
    if(o.mode==='free')o.sp=Math.min(o.sp+160*dt,330);
    let dvx=(o.tx-o.x)*2.2,dvy=(o.ty-o.y)*2.2;const m=Math.hypot(dvx,dvy),mx=o.sp*ds;if(m>mx){dvx*=mx/m;dvy*=mx/m}
    dvx+=Math.cos(o.t*2.3+o.seed)*o.wob*2.3*ds;dvy+=Math.cos(o.t*3.1+o.seed)*o.wob*3.1*ds;
    if(o.kind==='bfly')dvy+=Math.sin(o.t*9)*45*ds;
    const a=Math.min(1,dt*(o.kind==='sat'?2.8:4));o.vx+=(dvx-o.vx)*a;o.vy+=(dvy-o.vy)*a;
    o.x+=o.vx*dt;o.y+=o.vy*dt;

    const sp=Math.hypot(o.vx,o.vy),want=o.mode==='held'?(bot.vf>=0.5?0.95:Math.PI*0.5+0.5*bot.dir):sp>25*ds?Math.atan2(-o.vy,-o.vx):Math.PI*0.5-0.35*o.flip;

  }

/* ---------- story: chase episode script ---------- */
function chaseTask(kind){
  if(kind!=='sat'&&kind!=='bfly')kind=Math.random()<0.65?'sat':'bfly';
  return{k:'chase',kind,st:'prep',t:0,T:0,notice:0,run:false,crouch:0,misses:2+(Math.random()<0.4?1:0),cd:0,side:1,away:1,hop:0,flips:0,flipT:3,wp:null,wpT:0,fx:0,fy:0};

  }else if(t.st==='land'){
    o.tx=t.fx;o.ty=t.fy;o.sp=55;o.wob=4;c.face=t.fx>bot.x?1:-1;
    if(Math.hypot(o.x-t.fx,o.y-t.fy)<5*ds||t.t>7){o.mode='sit';o.x=t.fx;o.y=t.fy;go('crouch')}
  }else if(t.st==='crouch'){
    c.face=t.fx>bot.x?1:-1;
    if(t.t>0.8){reach.want=0.9;reach.lx=null;reach.x=t.fx+(t.fx>bot.x?-6:6)*ds;reach.y=t.fy-14*ds}

  }else if(t.st==='hop'){
    c.face=t.fx>bot.x?1:-1;o.tx=handW.x;o.ty=handW.y-7*ds;
    if(Math.hypot(o.x-o.tx,o.y-o.ty)<6*ds||t.t>4){o.mode='held';o.soft=true;go('onhand')}
  }else if(t.st==='onhand'){

    if(t.t>4.2){reach.rate=4;reach.want=0;reach.lx=null;freeToy();o.wob=24;o.sp=50;sparkle(o.x,o.y,8);bot.wave=2.6;go('bye')}

}
/* pose tweaks applied before foot placement: running stride, startle, crouch */
function storyPose(P){
  boyPose(P);cinemaPose(P);
  const t=task;if(!t||t.k!=='chase'||bot.state==='broken')return;
  if(bot.state==='ground'){
    const k=clamp(Math.abs(bot.vx)/VW-1,0,1);
    if(k>0){P.thighN*=1+0.3*k;P.thighF*=1+0.3*k;P.armN*=1+0.7*k;P.armF*=1+0.7*k;P.elbowN-=0.45*k;P.elbowF-=0.45*k;P.tilt+=0.1*k}

  if(t.crouch>0){const k=smooth(0,1,t.crouch)*0.8;for(const key in CROUCH)P[key]+=(CROUCH[key]-P[key])*k;P.tilt+=0.12*k}
}
/* near arm reaching / holding, and the hand's screen position */
function storyArm(P,dt){
  if(pieces||!bot.draw)return;
  reach.k+=clamp(reach.want-reach.k,-dt*reach.rate,dt*reach.rate);
  if(reach.k>0.001&&bot.vf<0.5){
    let tx=reach.x,ty=reach.y;if(reach.lx!=null){const w=toWorld(reach.lx,reach.ly);tx=w.x;ty=w.y}
    /* two-bone IK: put the hand on the target (or point straight at it when out of reach) */
    const U=R.upper,L=R.fore+13,sw=toWorld(2,R.shoulderY),dl=toLocalVec(tx-sw.x,ty-sw.y);
    const d=clamp(Math.hypot(dl.x,dl.y),Math.abs(U-L)+12,U+L-1),e=-Math.acos(clamp((d*d-U*U-L*L)/(2*U*L),-1,1));
    const a=Math.atan2(-dl.x,dl.y)-Math.atan2(L*Math.sin(e),U+L*Math.cos(e));

  }

  const a=P.armN,e=P.elbowN,L=R.fore+13;
  const w=toWorld(2-Math.sin(a)*R.upper-Math.sin(a+e)*L,R.shoulderY+Math.cos(a)*R.upper+Math.cos(a+e)*L);

/* ---------- story: director — acts that repeat with variation ---------- */
const ACTS=['explore','boy','chase','calm','explore','boy','battle','explore','leave'];
const story={act:-1,left:0,lastChase:-1e9,lastBattle:-1e9};
function exploreTask(){let t;do t=nextTask();while(t.k==='battle'||(t.k==='fly'&&t.pts[0].tp!=null));return t}
function calmTask(){const r=Math.random();return r<0.55?{k:'look',stage:0,t:0}:r<0.8?{k:'idle',t:rand(3,6)}:{k:'wave',t:2.4}}
function directorNext(){
  if(queue.length)return queue.shift();
  const bn=boyNext();if(bn)return bn;
  const cn=cinemaNext();if(cn)return cn;
  if(story.left<=0){
    story.act=(story.act+1)%ACTS.length;
    const a=ACTS[story.act];story.left=a==='explore'?2+Math.floor(Math.random()*2):1;
  }
  story.left--;
  const a=ACTS[story.act],now=bot.clock;
  if(a==='boy'){const v=boyVisit();if(v)return v}
  if(a==='chase'&&now-story.lastChase>50)return chaseTask();
  if(a==='battle'&&now-story.lastBattle>50)return battleTask();
  if(a==='calm')return calmTask();
  if(a==='leave'&&Math.random()<0.6)return leaveTask();
  return exploreTask();
}
function storyWatch(){
  if(!task)return;
  if(task.k==='chase')story.lastChase=bot.clock;
  if(task.k==='battle')story.lastBattle=bot.clock;
}

/* ---------- sound: synthesized WebAudio sfx (no files) — steps, jets, weapons, drones, wreck, sputnik, boy ---------- */
/* Everything is generated on the fly. Quiet by default (master 0.35), compressor + limiter on the master,
   capped voices, per-name throttling. Game state is *observed* in sfxFrame() so the rest of the code needs
   only tiny hooks: sfxFrame(dt,flame) in frame(), sfxBoom(x,y,s) in explosion(), sfxApply(s) in applySettings().
   Other code may call window.giantSfx(name,{x,...}); unknown names are ignored. */

const SFX_MAXV=24;

const sGk=()=>clamp(ds,0.5,1.3);   // giant scale factor: small giant -> quieter, higher

  const n=ac.sampleRate*2|0,wb=ac.createBuffer(1,n,ac.sampleRate),bb=ac.createBuffer(1,n,ac.sampleRate),w=wb.getChannelData(0),b=bb.getChannelData(0);
  let l=0;for(let i=0;i<n;i++){w[i]=Math.random()*2-1;l=(l+0.02*w[i])/1.02;b[i]=l*3.5}
  const dr=b[n-1]-b[0];for(let i=0;i<n;i++)b[i]-=dr*i/n;   // seamless brown-noise loop
  const bus=ac.createGain(),comp=ac.createDynamicsCompressor(),master=ac.createGain(),lim=ac.createDynamicsCompressor(),out=ac.createGain();
  comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.25;
  lim.threshold.value=-4;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=0.001;lim.release.value=0.1;
  master.gain.value=SFX.vol;out.gain.value=0.84;
  bus.connect(comp);comp.connect(master);master.connect(lim);lim.connect(out);out.connect(ac.destination);
  return{ac,bus,master,noise:wb,brown:bb,off:false};
}
function sfxEnsure(){
  if(SFX.e||!SFX.on||SFX.failed)return SFX.e;
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C){SFX.failed=true;return null}
    SFX.e=sfxBuild(new C({latencyHint:'playback'}));

  }catch(err){SFX.failed=true;SFX.e=null}

function sfxWake(){   // resume if allowed (throttled; in a plain browser only after a user gesture to avoid console noise)
  const e=SFX.e;if(!e||e.off||!SFX.on||document.hidden||e.ac.state!=='suspended')return;
  const now=performance.now();if(now-SFX.wakeT<500)return;SFX.wakeT=now;
  const ua=navigator.userActivation;if(!api&&!SFX.ran&&ua&&!ua.hasBeenActive&&SFX.triedOnce)return;SFX.triedOnce=true;

}
function sfxSuspend(){const e=SFX.e;if(e&&!e.off&&e.ac.state==='running'){sfxKillLoops();try{e.ac.suspend().catch(()=>{})}catch(_){}}}
function sfxSet(on){

  const ac=e.ac,g=ac.createGain();g.gain.value=vol;let o=g;
  if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=sPan(x);g.connect(p);o=p}
  o.connect(e.bus);const v={ac,e,g,t:ac.currentTime+0.004};
  if(!e.off){SFX.voices++;SFX.quiet=0;setTimeout(()=>{try{g.disconnect();o.disconnect()}catch(_){}SFX.voices--},(dur+0.25)*1000)}

  const g=v.ac.createGain(),h=hold||0;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+a);

  L.osc=(type,f)=>{const s=ac.createOscillator();s.type=type;s.frequency.value=f;return s};

/* ---------- story: the boy — actor (movement, mounts, hops, autonomous reactions) ---------- */

function boyMounted(){return boy.on&&(boy.mode==='mount'||boy.mode==='hop'||boy.mode==='fall')}
function boyMountPos(kind){

function boyFx(k,x,y){if(boy.fx.length<40)boy.fx.push({k,x,y,vx:(Math.random()-0.5)*14*ds,vy:k==='tear'?10*ds:-22*ds,t:0,max:k==='tear'?0.9:1.7,s:rand(0.8,1.2)})}
function updateBoy(dt){
  if(task&&task.k==='boy')boyS.lastVisit=bot.clock;else gk.loop=null;

  boy.moving=null;

    else if(boy.goal){

      if(Math.abs(dx)>0.8){const s=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);boy.x+=s;boy.dir=Math.sign(dx);boy.moving=how;
        boy.ph+=Math.abs(s)/((how==='run'?3.5:how==='tiptoe'?1.1:2.2)*ds)}
      else boy.goal=null;
      if(boy.leaving&&boy.goal&&how==='walk'&&(boy.lt=(boy.lt||0)+dt)>2.5)boy.goal.how='run';
    }
    if(!boy.moving&&boy.look!=null){const lx=boy.look==='g'?bot.x:boy.look;if(Math.abs(lx-boy.x)>2)boy.dir=lx>boy.x?1:-1}

  }else if(boy.mode==='fall'){

/* reactions when no boy scene is running: hide in a battle, mourn, cheer, or say goodbye */
function boyWatch(dt){
  const t=task,k=t&&t.k;

    if(pieces||!bot.draw||bot.state==='broken'){boyFall();return}
    if(k&&k!=='boy'){queue.unshift(t);task=boyTask(['drop'])}
    return;
  }
  if(boy.mode!=='ground'||!k||k==='boy'||k==='finale'||k==='knock'||boy.leaving)return;
  if(k==='battle'){
    if(!t.boyChk){t.boyChk=1;t.boy=true;t.mode='ground';if(!boyS.resume)boyS.resume=['reunion','bye'];
      t.hs=bot.x>W/2?1:-1;t.bhx=clamp(bot.x+t.hs*72*ds,22*ds,W-22*ds);t.bt=0;
      boy.seat=null;boy.prop=null;boy.look=null;boy.shut=false;boyGo(t.bhx,'run');boyDo('stand','open',1);boySay('Осторожно!',2);bsfx('boyGasp')}
    t.bt+=dt;

  }

      if(!wreck.bs){wreck.bs=1;wreck.bt=0;boy.goal=null;boyDo('gasp','open',1);boySay('Нет!',1.4);bsfx('boyGasp')}
      wreck.bt+=dt;const h=pieces.find(p=>p.id==='head');
      if(wreck.bs===1&&wreck.bt>1.5){if(h){const s=boy.x<h.x?-1:1;boyGo(clamp(h.x+s*14*ds,15,W-15),'run')}boyDo('stand','sad',-1);wreck.bs=2}
      else if(wreck.bs===2&&!boy.goal){boy.look=h?h.x:null;boyDo('kneel','sad',-1);boySay('Не умирай…',3.2);bsfx('boyCry');wreck.bs=3}
      else if(wreck.bs===3&&Math.random()<dt*2.6)boyFx('tear',boy.ex,boy.ey);
    }else{
      if(wreck.bs!==4&&wreck.bs!==5){wreck.bs=4;const s=boy.x<wreck.ax?-1:1;boyGo(clamp(wreck.ax+s*95*ds,15,W-15),'run');boyDo('stand','open',1);boy.brow=1}
      if(wreck.bs===4&&!boy.goal){boy.look=wreck.ax;boyDo('gasp','open',1)}
      if(wreck.bs===4&&wreck.eyes){wreck.bs=5;boy.goal=null;boy.look=wreck.ax;boyDo('jump','grin',1);boySay('Ты вернулся!',2.6);bsfx('boyCheer')}
    }
    return;
  }
  if(k==='victory'&&boy.mourned){boy.look='g';if(!boy.goal)boyDo(t.stage===2?'cheer':'jump','grin',1);return}
  boyLeave(true);
}

/* ---------- story: the giant's poses with the boy (kneel, sit, shield, ride, loop) ---------- */
const KNEEL={thighN:-0.6,kneeN:1.6,thighF:-0.52,kneeF:1.56,armN:0.3,elbowN:-0.5,armF:0.45,elbowF:-0.5,tilt:0.66,point:0};
const SITG={thighN:-1.36,kneeN:0.06,thighF:-1.26,kneeF:0.12,armN:0.6,elbowN:-0.05,armF:0.65,elbowF:-0.1,tilt:-0.14,point:0};
function boyPose(P){
  const now=performance.now(),dt=paused?0:Math.min(0.05,(now-bLast)/1000);bLast=now;
  if(bot.state==='broken'){gk.kneel=gk.sit=gk.shield=gk.ride=0;gk.loop=null;return}
  const ease=(v,w,r)=>v+clamp(w-v,-dt*r,dt*r);
  gk.kneel=ease(gk.kneel,gk.kneelW,0.75);gk.sit=ease(gk.sit,gk.sitW,0.6);gk.shield=ease(gk.shield,gk.shieldW,3);gk.ride=ease(gk.ride,gk.rideW,2);
  gk.kneelW=gk.sitW=gk.shieldW=gk.rideW=0;
  if(gk.kneel>0.001){const k=smooth(0,1,gk.kneel);for(const key in KNEEL)P[key]+=(KNEEL[key]-P[key])*k}
  if(gk.sit>0.001){const k=smooth(0,1,gk.sit);for(const key in SITG)P[key]+=(SITG[key]-P[key])*k}
  if(gk.shield>0.001){const k=smooth(0,1,gk.shield);for(const key in CROUCH)P[key]+=(CROUCH[key]-P[key])*k*0.3;
    P.armN+=(-1.35-P.armN)*k;P.elbowN+=(-0.15-P.elbowN)*k;P.armF+=(-1.1-P.armF)*k;P.elbowF+=(-0.2-P.elbowF)*k}
  if(gk.ride>0.001&&bot.state!=='ground'){const k=gk.ride;P.armN+=(0.55-P.armN)*k;P.elbowN+=(-0.5-P.elbowN)*k;P.armF+=(-2.9-P.armF)*k;P.elbowF+=(0.05-P.elbowF)*k}
  const L=gk.loop;
  if(L){
    if(bot.state!=='fly'){gk.loop=null;return}
    L.ph=Math.min(Math.PI*2,L.ph+dt*Math.PI*2/L.dur);
    P.tilt-=L.ph;
    const px=L.cx+L.dir*L.r*Math.sin(L.ph),py=L.cy+L.r*Math.cos(L.ph),c=Math.cos(P.tilt),s=Math.sin(P.tilt);
    const drop=Math.max(footDrop(P.thighN,P.kneeN,P.tilt),footDrop(P.thighF,P.kneeF,P.tilt));
    const nx=px-(4*c+90*s)*L.dir*SC;if(dt>0)bot.vx=(nx-bot.x)/dt;bot.x=nx;
    bot.alt=G-drop*SC+(4*s-90*c)*SC-py;bot.target=Math.max(1,bot.alt);
    if(L.ph>=Math.PI*2){gk.loop=null;bot.vx=L.dir*VF*0.8}
  }
}
function startLoop(){const cn=botCenter(),r=clamp((cn.y-150*ds)/2.4,50*ds,100*ds);gk.loop={ph:0,cx:cn.x,cy:cn.y-r,r,dir:bot.dir,dur:2.6}}
/* the last drone of a battle with the boy around: it lines up, locks on the boy and dives at him */
function fatalAim(d){
  const t=task;

  if(!d.lk){d.lk='stage';t.hs=t.hs||(bot.x>W/2?1:-1);d.sx=clamp(bot.x-t.hs*rand(250,320)*ds,50,W-50);d.sy=G-rand(130,170)*ds;d.t=0}
  if(d.lk==='stage'){if(Math.hypot(d.x-d.sx,d.y-d.sy)<25*ds||d.t>4){d.lk='lock';d.t=0;bsfx('lockOn');boyDo('cower','open',1);boySay('Ой!',1.2)}return{x:d.sx,y:d.sy,v:300}}

/* the giant's part of that battle: lands, steps between the drone and the boy, spreads his arms */

/* ---------- story: the boy — scenes (acts) the director can play ---------- */
function boyTask(acts){return{k:'boy',acts:acts.slice(),i:0,st:'start',t:0,actT:0,notice:0,glow:0,f:null}}

function once(t,key){if(!t.f)t.f={};if(t.f[key])return false;return t.f[key]=true}
function resetGiantStory(){reach.want=0;reach.lx=null;reach.rate=4;FRONT_ARM.want=0;gk.loop=null;bot.raise=0}
function nextAct(t){t.i++;bgo(t,'start');t.actT=0;t.glow=0;resetGiantStory()}
function gReady(c,busy){
  if(bot.state==='fly'){const tx=clamp(bot.x,140,W-140);c.h=clamp((tx-bot.x)/220,-1,1);c.alt=Math.abs(tx-bot.x)<120?0:Math.max(40,bot.alt);return false}
  return bot.state==='ground'&&!busy;
}
function gWalk(c,x,tol){const dx=x-bot.x;if(Math.abs(dx)<(tol||6)){c.h=0;return Math.abs(bot.vx)<10}c.h=clamp(dx/60,-1,1);if(Math.abs(c.h)<0.3)c.h=0.3*Math.sign(dx);return false}
function boyNeed(t,req){
  const m=boy.on&&!boy.leaving&&boy.mode!=='ground';let ins=null;
  if(!boy.on||boy.leaving)ins='greet';else if(req==='ground'&&m)ins='putdown';else if(req==='shoulder'&&!m)ins='pickup';
  if(ins){t.acts.splice(t.i,0,ins);bgo(t,'start');return true}
  return false;
}
function boyThink(t,c,dt,busy){
  t.t+=dt;t.actT+=dt;t.notice+=clamp(t.glow-t.notice,-dt*2,dt*4);
  const a=t.acts[t.i];
  if(!a){resetGiantStory();if(task===t)task=null;return c}
  if(t.actT>(a==='play'?150:90)){if(boyMounted())boyHop({x:clamp(bot.x+bot.dir*40*ds,15,W-15)},0.6,10);ball=null;nextAct(t);return c}
  BACT[a](t,c,dt,busy);
  return c;
}
/* palm: the giant kneels and offers his hand, the boy climbs on (shared by the meeting and the pick-up) */
function palm(t,c,dt,next){
  const s=t.ps||(t.ps=boy.x>bot.x?1:-1),tx=bot.x+s*70*ds,ty=G-24*ds;c.face=s;
  if(t.st==='p_kneel'){
    gk.kneelW=1;boy.look='g';
    if(t.t>0.6){reach.want=1;reach.rate=1.2;reach.lx=null;reach.x=tx;reach.y=ty}
    if(t.t>2.8){boyGo(handW.x+s*7*ds,'walk');bgo(t,'p_walk')}
  }else if(t.st==='p_walk'){
    gk.kneelW=1;reach.want=1;reach.x=tx;reach.y=ty;
    if(!boy.goal){boy.dir=-s;boyHop('hand',1.2,0,'climb');boyDo('climb','open',1);bgo(t,'p_climb')}
  }else if(t.st==='p_climb'){
    gk.kneelW=1;reach.want=1;reach.x=tx;reach.y=ty;
    if(boy.mode==='mount'){bsfx('pickup');boyDo('hold','grin',1);t.lf={x:handW.x,y:handW.y};bgo(t,next)}
  }
}
function liftTo(t,lx,ly,dur){const e=smooth(0.2,dur,t.t),w=toWorld(lx,ly);reach.want=1;reach.rate=3;reach.lx=null;reach.x=t.lf.x+(w.x-t.lf.x)*e;reach.y=t.lf.y+(w.y-t.lf.y)*e}
const BACT={
  /* first meeting: he walks in, gets scared, hides, tiptoes closer; the giant offers his palm and lifts him to his face */
  meet(t,c,dt,busy){
    const S=t.st;
    if(S==='start'){
      if(boy.on){t.acts[t.i]='greet';return}
      if(!gReady(c,busy))return;
      const es=t.es||(t.es=bot.x<W/2?-1:1),lo=330*ds;
      const gx=es<0?clamp(bot.x,lo,Math.max(lo,W*0.4)):clamp(bot.x,Math.min(W-lo,W*0.6),W-lo);
      if(!gWalk(c,gx,12))return;
      boySpawn(es);boyGo(bot.x+es*200*ds,'walk');boyDo('stand','smile',0);bsfx('boyWhistle');bgo(t,'enter');
    }else if(S==='enter'){
      c.face=-t.es;
      if(!boy.goal){boy.look='g';boyDo('gasp','open',1);boySay('Ого!',1.6);bsfx('boyGasp');bgo(t,'notice')}
    }else if(S==='notice'){
      c.face=-t.es;
      if(t.t>1.4){boyGo(bot.x+t.es*265*ds,'run');boyDo('stand','open',1);bgo(t,'hide')}
    }else if(S==='hide'){
      c.face=t.t>1.2&&t.t<2.3?t.es:-t.es;
      if(!boy.goal&&once(t,'c')){boy.look='g';boyDo('cower','open',1)}
      if(t.t>2.6&&once(t,'p'))boyDo('peek','open',1);
      if(t.t>3.8){boyDo('stand','smile',1);boyGo(bot.x+t.es*118*ds,'tiptoe');boySay('Ты кто?',2.2);bgo(t,'approach')}
    }else if(S==='approach'){
      c.face=-t.es;
      if(!boy.goal)bgo(t,'turn');
    }else if(S==='turn'){
      c.face=t.es;t.glow=1;boy.look='g';
      if(once(t,'f')){boyDo('gasp','open',1);bsfx('giantNotice')}
      if(t.t>1.1&&once(t,'s'))boyDo('stand','smile',1);
      if(t.t>2.3){t.glow=0;bgo(t,'p_kneel')}
    }else if(S[0]==='p')palm(t,c,dt,'lift');
    else if(S==='lift'){
      c.face=t.es;liftTo(t,64,-112,2.4);
      if(t.t>0.9&&once(t,'u'))boySay('Ух!',1.2);
      if(t.t>2.6){FRONT_ARM.a=PALM_A;FRONT_ARM.e=PALM_E;FRONT_ARM.want=1;if(FRONT_ARM.k>0.9)bgo(t,'face')}
    }else if(S==='face'){
      const w=toWorld(64,-112);reach.want=1;reach.x=w.x;reach.y=w.y;FRONT_ARM.a=PALM_A;FRONT_ARM.e=PALM_E;FRONT_ARM.want=1;bot.view=1;
      if(bot.vf>=1&&t.t>0.6)bgo(t,'hello');
    }else if(S==='hello'){
      FRONT_ARM.a=PALM_A;FRONT_ARM.e=PALM_E+0.04*Math.sin(t.t*2);FRONT_ARM.want=1;bot.view=1;
      if(once(t,'w')){boyDo('wave','grin',1);boySay('Привет!',2.2);bsfx('boyHello')}
      if(t.t>2.6&&once(t,'l')){boyDo('laugh','grin',1);boySay('Хи-хи!',1.4);bsfx('boyLaugh')}
      if(t.t>4.4){boyHop('shoulder',0.55,10);boyDo('sit','grin',1);bgo(t,'seat')}
    }else if(S==='seat'){
      FRONT_ARM.want=boy.mode==='mount'?0:1;if(t.t<1.8)bot.view=1;
      if(bot.vf<=0&&t.t>2.2){if(once(t,'y'))boySay('Ух ты, как высоко!',2);if(t.t>3.6)nextAct(t)}
    }
  },
  /* the boy runs in (or turns back) and they greet each other */
  greet(t,c,dt,busy){
    if(t.st==='start'){
      if(boy.on&&!boy.leaving&&boy.mode!=='ground'){nextAct(t);return}
      if(!gReady(c,busy))return;
      if(!boy.on){const near=bot.x<W/2?-1:1,side=(near<0?bot.x:W-bot.x)>260*ds?near:-near;boySpawn(side)}
      boy.leaving=false;boy.waitT=0;const s=boy.x>bot.x?1:-1;
      boyGo(clamp(bot.x+s*95*ds,20,W-20),'run');boyDo('stand','grin',1);boy.look=null;bgo(t,'run');
    }else if(t.st==='run'){
      if(Math.abs(boy.x-bot.x)<420*ds)c.face=boy.x>bot.x?1:-1;
      if(t.t>0.3&&once(t,'hey')&&(boy.x<0||boy.x>W))boySay('Эй! Это я!',1.8);
      if(!boy.goal||t.t>20){boy.goal=null;boy.look='g';boyDo('wave','grin',1);boySay(pick(['Привет!','Привет, великан!','Я вернулся!']),2);bsfx('boyHello');bot.wave=2.6;bgo(t,'hi')}
    }else if(t.st==='hi'){
      c.face=boy.x>bot.x?1:-1;
      if(t.t>2.2&&once(t,'j')){boyDo('jump','grin',1);bsfx('boyLaugh')}
      if(t.t>3.4){boyDo('stand','smile',0);nextAct(t)}
    }
  },
  /* the giant kneels, the boy climbs on his palm and is lifted onto the shoulder */
  pickup(t,c,dt,busy){
    const S=t.st;
    if(S==='start'){
      if(boy.on&&boy.mode==='mount'&&boy.mount==='shoulder'){nextAct(t);return}
      if(boyNeed(t,'ground'))return;if(!gReady(c,busy))return;
      if(bot.x<150*ds||bot.x>W-150*ds){gWalk(c,clamp(bot.x,150*ds,W-150*ds),12);return}
      let s=boy.x>bot.x?1:-1;if(bot.x+s*100*ds<20||bot.x+s*100*ds>W-20)s=-s;
      boyGo(bot.x+s*100*ds,'walk');boyDo('stand','smile',0);t.ps=s;bgo(t,'pos');
    }else if(S==='pos'){
      c.face=t.ps;if(!boy.goal){boy.look='g';bgo(t,'p_kneel')}
    }else if(S[0]==='p')palm(t,c,dt,'lift');
    else if(S==='lift'){
      c.face=t.ps;liftTo(t,48,-168,2);
      if(t.t>2.3&&once(t,'h')){boyHop('shoulder',0.5,8);boyDo('sit','grin',1)}
      if(t.f&&t.f.h&&boy.mode==='mount'){reach.want=0;if(t.t>3.2)nextAct(t)}
    }
  },
  /* flight with the boy on the shoulder: across the sky, a low swoop, a loop, a soft landing */
  ride(t,c,dt,busy){
    const S=t.st;
    if(S==='start'){
      if(boyNeed(t,'shoulder'))return;if(boy.mode!=='mount')return;if(!gReady(c,busy))return;
      boyDo('cheer','grin',1);boySay('Полетели!',1.8);bsfx('boyCheer');bgo(t,'up');
    }else if(S==='up'){
      gk.rideW=1;if(bot.state==='ground'&&t.t>0.7)c.up=true;
      if(bot.state==='fly'&&bot.alt>20){
        const m=maxAltNow(),f=bot.x<W/2?1:-1;
        t.pts=[{x:clamp(bot.x+f*W*0.22,120,W-120),alt:m*0.85},{x:f>0?W-160:160,alt:m*0.7},{x:W/2+f*W*0.06,alt:Math.min(80,m*0.3),loop:1},
          {x:f>0?170:W-170,alt:m*0.55},{x:W/2-f*W*0.1,alt:m*0.3},{x:W/2-f*W*0.1,alt:0}];
        t.i2=0;t.wt=0;boyDo('sit','grin',1);bgo(t,'fly');
      }
    }else if(S==='fly'){
      gk.rideW=1;const p=t.pts[t.i2];
      if(bot.state==='ground'&&!busy&&t.i2>=t.pts.length-1){bgo(t,'landed');return}
      if(!p){c.alt=0;return}
      const dx=p.x-bot.x;c.h=clamp(dx/220,-1,1);c.alt=p.alt;t.wt+=dt;
      if(p.loop&&Math.abs(dx)<300*ds&&once(t,'w')){boyDo('cheer','grin',1);boySay('Уи-и-и!',1.4);bsfx('boyCheer')}
      if((Math.abs(dx)<40&&Math.abs(bot.alt-p.alt)<30)||t.wt>8){
        if(p.loop&&bot.state==='fly'){startLoop();t.i2++;t.wt=0;bgo(t,'loop');return}
        if(t.i2<t.pts.length-1){t.i2++;t.wt=0}
        if(t.i2===1)boyDo('hold','grin',1);
      }
    }else if(S==='loop'){
      gk.rideW=1;c.h=bot.dir;c.alt=bot.alt;
      if(once(t,'u')){boySay('Ура-а-а!',2);bsfx('boyCheer')}
      if(!gk.loop){boyDo('cheer','grin',1);bgo(t,'fly')}
    }else if(S==='landed'){
      if(once(t,'l')){boyDo('laugh','grin',1);boySay('Ещё! Ещё!',1.8);bsfx('boyLaugh')}
      if(t.t>2.4){boyDo('sit','smile',0);nextAct(t)}
    }
  },
  /* the boy steps from the shoulder onto the palm and is lowered to the ground */
  putdown(t,c,dt,busy){
    const S=t.st;
    if(S==='start'){
      if(!boy.on||boy.mode==='ground'){nextAct(t);return}
      if(!gReady(c,busy)||bot.vf>0||boy.mode!=='mount')return;
      if(bot.x<130*ds||bot.x>W-130*ds){gWalk(c,clamp(bot.x,130*ds,W-130*ds),12);return}
      if(boy.mount==='hand'){t.lf={x:handW.x,y:handW.y};bgo(t,'lower');return}
      bgo(t,'reach');
    }else if(S==='reach'){
      reach.want=1;reach.rate=2;reach.lx=46;reach.ly=-140;
      if(t.t>1.1&&once(t,'h')){boyHop('hand',0.5,10);boyDo('hold','smile',1)}
      if(t.f&&t.f.h&&boy.mode==='mount'){t.lf={x:handW.x,y:handW.y};bgo(t,'lower')}
    }else if(S==='lower'){
      gk.kneelW=1;const e=smooth(0,2,t.t),tx=bot.x+bot.dir*70*ds,ty=G-24*ds;
      reach.want=1;reach.rate=3;reach.lx=null;reach.x=t.lf.x+(tx-t.lf.x)*e;reach.y=t.lf.y+(ty-t.lf.y)*e;
      if(t.t>2.4){boyHop({x:clamp(handW.x+bot.dir*14*ds,15,W-15)},0.55,12);boyDo('stand','grin',1);bgo(t,'off')}
    }else if(S==='off'){
      gk.kneelW=t.t<0.4?1:0;
      if(boy.mode==='ground'){reach.want=0;boy.look='g';if(t.t>1.1){boyDo('stand','smile',0);nextAct(t)}}
    }
  },
  /* games: a ball thrown and fetched, a toss back, a huge throw that bonks his head, then the comic-book pose */
  play(t,c,dt,busy){
    const S=t.st,side=()=>boy.x>bot.x?1:-1;
    if(S==='start'){
      if(boyNeed(t,'ground'))return;if(!gReady(c,busy))return;
      if(bot.x<170*ds||bot.x>W-170*ds){gWalk(c,clamp(bot.x,170*ds,W-170*ds),12);return}
      boyGo(clamp(bot.x+side()*85*ds,20,W-20),'walk');boyDo('stand','grin',1);bgo(t,'pos');
    }else if(S==='pos'){
      c.face=side();
      if(!boy.goal){const s=side();t.td=(s>0?W-boy.x:boy.x)>260*ds?s:-s;boy.look=null;boy.dir=t.td;
        ball={x:boy.handX,y:boy.handY,vx:0,vy:0,mode:'boy',t:0,spin:0};boySay('Лови!',1.5);bgo(t,'throw')}
    }else if(S==='throw'){
      c.face=side();boy.dir=t.td;
      if(t.t>0.5&&once(t,'th'))boyDo('throw','grin',1);
      if(t.t>0.9&&once(t,'rel')){ball.mode='air';ball.t=0;ball.vx=t.td*175*ds;ball.vy=-(t.td===side()?260:400)*ds;bsfx('throw')}
      if(t.t>2){boyDo('point','grin',1);bgo(t,'fetch')}
    }else if(S==='fetch'){
      const b=ball;if(!b){nextAct(t);return}
      const rest=b.mode==='air'&&b.y>=G-b.r-0.5&&Math.abs(b.vx)<14*ds;
      if(!t.bd&&(rest||t.t>4))t.bd=b.x>bot.x?1:-1;
      if(t.t>1.4){boy.look='g';boyDo('stand','grin',1)}
      if(t.bd&&gWalk(c,clamp(b.x-t.bd*72*ds,25,W-25),8)&&(rest||t.t>9)){c.face=t.bd;bgo(t,'grab')}
      if(t.t>18){b.mode='giant';b.soft=true;bgo(t,'bring')}
    }else if(S==='grab'){
      c.face=t.bd;gk.kneelW=1;
      if(t.t>0.6){reach.want=1;reach.rate=1.6;reach.lx=null;reach.x=ball.x;reach.y=ball.y-2*ds}
      if(t.t>2.6){ball.mode='giant';ball.soft=true;bsfx('pickup');bgo(t,'bring')}
    }else if(S==='bring'){
      reach.want=1;reach.rate=2;reach.lx=64;reach.ly=-118;boy.look='g';
      const s=side(),gx=clamp(boy.x-s*125*ds,25,W-25);
      if(t.t>1.2&&gWalk(c,gx,8)){c.face=s;bgo(t,'toss')}
    }else if(S==='toss'){
      const s=side();c.face=s;reach.want=t.f&&t.f.rel?0:1;reach.rate=3;
      if(!t.f||!t.f.rel){const k=smooth(0,0.45,t.t);reach.lx=64-10*k;reach.ly=-118-60*k}
      if(once(t,'c0'))boyDo('catch','open',1);
      if(t.t>0.55&&once(t,'rel')){const b=ball,T=0.95,g=700*ds;b.mode='air';b.soft=false;b.t=0;b.catchT=T;
        b.vx=(boy.handX-b.x)/T;b.vy=(boy.handY-b.y-0.5*g*T*T)/T;bsfx('throw');reach.want=0}
      if(t.f.rel){const b=ball;
        if(b.mode==='air'&&(Math.hypot(b.x-boy.handX,b.y-boy.handY)<11*ds||b.t>=b.catchT)){b.mode='boy';bsfx('catch');boyDo('jump','grin',1);boySay('Молодец!',1.8);bsfx('boyLaugh');bgo(t,'happy')}
        else if(t.t>4)bgo(t,'happy');
      }
    }else if(S==='happy'){
      c.face=side();reach.want=0;
      if(t.t>2.2){if(!ball||ball.mode!=='boy')ball={x:boy.handX,y:boy.handY,vx:0,vy:0,mode:'boy',t:0};boy.look='g';boyDo('stand','grin',1);boySay('А так?',1.4);bgo(t,'throw2')}
    }else if(S==='throw2'){
      const s=side();c.face=s;boy.look='g';
      if(t.t>0.5&&once(t,'th'))boyDo('throw','grin',1);
      if(t.t>0.9&&once(t,'rel')){const b=ball,T=0.85,g=700*ds,w=toWorld(72,-150);b.mode='air';b.t=0;b.catchT=T;b.vx=(w.x-b.x)/T;b.vy=(w.y-b.y-0.5*g*T*T)/T;bsfx('throw')}
      if(t.f&&t.f.rel){const b=ball;reach.want=1;reach.rate=4;reach.lx=null;reach.x=b.x;reach.y=b.y;
        if(b.mode==='air'&&(Math.hypot(b.x-handW.x,b.y-handW.y)<16*ds||b.t>=b.catchT)){b.mode='giant';b.soft=true;bsfx('catch');bgo(t,'big')}
        else if(t.t>4){b.mode='giant';b.soft=true;bgo(t,'big')}}
    }else if(S==='big'){
      c.face=side();
      if(t.t<1.2){const k=smooth(0,0.5,t.t);reach.want=1;reach.rate=4;reach.lx=64-36*k;reach.ly=-140-110*k}
      if(t.t>0.6&&once(t,'up')){ball.mode='air';ball.soft=false;ball.vx=0;ball.vy=-1100*ds;ball.up=true;ball.bonked=false;bsfx('bigThrow');boyDo('lookup','open',1);boySay('Ого-о!',1.8)}
      if(t.t>1.2)reach.want=0;
      if(ball&&ball.bonked&&once(t,'lol')){boyDo('laugh','grin',1);boySay('Ха-ха-ха!',2);bsfx('boyLaugh');bgo(t,'lol')}
      else if(t.t>9)bgo(t,'lol');
    }else if(S==='lol'){
      c.face=side();
      if(t.t<2.4){reach.want=1;reach.rate=2;reach.lx=24;reach.ly=-196}else reach.want=0;
      const b=ball;
      if(t.t>2.6&&once(t,'go')){if(b)boyGo(clamp(b.x,15,W-15),'run');boyDo('stand','grin',1)}
      if(t.f&&t.f.go&&!boy.goal&&(!b||b.mode!=='air'||Math.abs(boy.x-b.x)<8*ds||t.t>8)){
        ball=null;bsfx('pickup');boy.prop='comic';boyGo(clamp(bot.x+side()*85*ds,20,W-20),'walk');bgo(t,'comic')}
      else if(t.f&&t.f.go&&b&&b.mode==='air'&&!boy.goal&&Math.abs(boy.x-b.x)>=8*ds)boyGo(clamp(b.x,15,W-15),'run');
    }else if(S==='comic'){
      c.face=side();
      if(!boy.goal&&once(t,'s')){boy.look='g';boyDo('show','grin',1);boySay('Смотри! Это Супермен!',2.6);t.cs=t.t}
      if(t.cs!=null&&t.t-t.cs>2.9)bgo(t,'pose');
    }else if(S==='pose'){
      c.face=side();boy.look='g';
      if(once(t,'p')){boy.prop=null;boyDo('superman','grin',1);bsfx('boyCheer')}
      if(t.t>1.1&&!t.rd){bot.view=1;if(bot.vf>=1){t.r0=t.r0||t.t;const r=t.t-t.r0;bot.raise=smooth(0.2,0.7,r)*(1-smooth(3.2,3.7,r));
        if(r>0.8&&once(t,'y')){boySay('Ты — Супермен!',2.6);boyDo('jump','grin',1);bsfx('boyLaugh')}
        if(r>3.8)t.rd=1}}
      if(t.rd&&bot.vf<=0){if(once(t,'e'))boyDo('laugh','grin',1);if(t.t-t.r0>6.2){boyDo('stand','smile',0);nextAct(t)}}
    }
  },
  /* a buzzing in the sky: the drones come; the battle itself is the ordinary battle with the boy flag */
  danger(t,c,dt,busy){
    if(t.st==='start'){
      if(boyNeed(t,'ground'))return;if(!gReady(c,busy))return;
      boyGo(clamp(bot.x+(boy.x>bot.x?1:-1)*80*ds,20,W-20),'walk');bgo(t,'calm');
    }else if(t.st==='calm'){
      c.face=boy.x>bot.x?1:-1;
      if(!boy.goal&&once(t,'a')){boy.look='g';boyDo('stand','smile',0)}
      if(t.t>1.6&&once(t,'b')){boy.look=null;boyDo('lookup','open',1);boySay('Что это жужжит?',2.2);bsfx('droneBuzz')}

/* ---------- story: the boy — director glue and entry points ---------- */
function boyVisit(force){
  if(!force&&bot.clock-boyS.lastVisit<45)return null;
  if(!boyS.met){boyS.met=true;boyS.lastX='ride';return boyTask(['meet','ride','putdown','bye'])}
  let o=['ride','play','danger'].filter(x=>x!==boyS.lastX);
  if(bot.clock-story.lastBattle<45)o=o.filter(x=>x!=='danger');
  const x=o.length?pick(o):'play';boyS.lastX=x;
  return boyTask(x==='ride'?['greet','pickup','ride','putdown','bye']:x==='play'?['greet','play','bye']:['greet','danger']);
}
function boyNext(){if(boyS.resume&&!pieces){const a=boyS.resume;boyS.resume=null;return boyTask(a)}return null}
function startBoy(a){
  if(pieces||(task&&(task.k==='battle'||task.k==='broken'||task.k==='victory')))return false;
  if(task&&task.k==='chase')endChase(task);
  resetGiantStory();
  let acts;
  if(a==='meet'){boyS.met=true;acts=boy.on?['greet','pickup','ride','putdown','bye']:['meet','ride','putdown','bye']}
  else if(a==='ride')acts=['pickup','ride','putdown','bye'];
  else if(a==='play')acts=['play','bye'];
  else if(a==='danger')acts=['danger'];
  else if(a==='bye')acts=['bye'];
  else if(a==='greet')acts=['greet','bye'];
  else acts=boyVisit(true).acts;
  task=boyTask(acts);queue=[];return true;
}
function boyState(){return{boy:boy.on?boy.mode+(boy.mount?':'+boy.mount:'')+(boy.leaving?':leaving':''):null,boyPose:boy.on?boy.act:null,
  boyAct:task&&task.k==='boy'?(task.acts[task.i]||'end')+'/'+task.st:null,boyBubble:boy.bub&&boy.bub.text,boyX:boy.x,boyY:boy.y,resume:boyS.resume&&boyS.resume.join(',')}}

/* ---------- cinema: camera (push-in close-ups, shake, letterbox) ---------- */
/* One global camera for all world drawing. At rest it is the identity (zoom 1): nothing is transformed and
   nothing extra is computed. camBegin() draws the letterbox bands (behind the world, so they never hide the
   actors) and applies the camera in frame(); camEnd() draws screen-space overlays (alarm vignette, glass cracks,
   shockwave, flash, the giant's speech bubble).
   Code that reads ctx.getTransform() back into world coordinates goes through camFix(); the mouse through camMouse().
   The camera state is a view rectangle (centre + width) driven by a critically damped spring, so a push-in
   eases in and out and never shows anything outside the screen. */
const cam={x:0,y:0,vw:0,z:1,vx:0,vy:0,vv:0,ox:0,oy:0,punch:0,shT:0,shMax:1,shA:0,lb:0,W:0,H:0,clock:0};
let CAMM=null,FIX=null,cineTilt=0;

  ts:1,tsW:1,pose:0,poseK:0,eyes:0,eyesW:0,tiltW:0,emberT:0,ip:null,vanished:false,hope:false,lastFinale:-1e9,lastKnock:-1e9,firstF:0,firstK:0,vig:null};
function camFix(p){return FIX?FIX.transformPoint(p):p}
function camSet(ctx){if(CAMM)ctx.setTransform(CAMM);else ctx.setTransform(dpr,0,0,dpr,0,0)}
function camZ(){return cam.z*(1+cam.punch)}
function camToScreen(x,y){if(!CAMM)return{x,y};const z=camZ();return{x:(x-cam.x)*z+W/2+cam.ox,y:(y-cam.y)*z+H/2+cam.oy}}
function camToWorld(x,y){const z=camZ();return{x:(x-W/2-cam.ox)/z+cam.x,y:(y-H/2-cam.oy)/z+cam.y}}
/* during the two big scenes the overlay never grabs the mouse (the giant may fill half the screen) */
function camMouse(){return cine.task?{x:-1e5,y:-1e5}:CAMM?camToWorld(mouse.x,mouse.y):mouse}
function camShake(a,d){if(a>=cam.shA*(cam.shT/cam.shMax)){cam.shA=a;cam.shT=cam.shMax=d}}
function camClamp(x,y,z){
  if(z<=1.0005)return{x:W/2,y:H/2};

  return{x:clamp(x,hw,W-hw),y:clamp(y,hh,H-hh)};

/* frame two world points (padding in world px), zoom at most zmax */
function shotOf(ax,ay,bx,by,zmax,lb,pad){

/* close-ups on the existing story beats (observed from the outside, those scripts are not edited) */

    if(toy.kind==='bfly'&&(t.st==='onhand'||(t.st==='hop'&&t.t>1)))return shotOf(toy.x,toy.y,d.x,d.y-175*SC,2.2)}

function camUpdate(dt){
  if(cam.W!==W||cam.H!==H){Object.assign(cam,{x:W/2,y:H/2,vw:W,z:1,vx:0,vy:0,vv:0,W,H})}
  if(dt<=0)return;
  cam.clock+=dt;
  const s=cine.shot||beatShot();
  let tx=W/2,ty=H/2,tz=1,tl=0,w=2.1;
  if(s){tz=clamp(s.z,1,8);const c=camClamp(s.x,s.y,tz);tx=c.x;ty=c.y;tl=s.lb==null?1:s.lb;if(s.w)w=s.w}
  const tvw=W/tz,h=Math.min(dt,0.05);
  cam.vx+=(w*w*(tx-cam.x)-2*w*cam.vx)*h;cam.x+=cam.vx*h;
  cam.vy+=(w*w*(ty-cam.y)-2*w*cam.vy)*h;cam.y+=cam.vy*h;
  cam.vv+=(w*w*(tvw-cam.vw)-2*w*cam.vv)*h;cam.vw+=cam.vv*h;
  cam.vw=clamp(cam.vw,W/9,W);cam.z=W/cam.vw;
  if(!s&&Math.abs(cam.vw-W)<0.4&&Math.abs(cam.vv)<2){cam.vw=W;cam.z=1;cam.vv=cam.vx=cam.vy=0}
  const c=camClamp(cam.x,cam.y,cam.z);cam.x=c.x;cam.y=c.y;
  cam.lb+=clamp(tl-cam.lb,-dt*1.1,dt*1.4);if(cam.lb<0.002&&!tl)cam.lb=0;
  cam.punch*=Math.exp(-dt*10);if(cam.punch<1e-4)cam.punch=0;

  else cam.ox=cam.oy=0;
}
function camBegin(ctx){

  const C=new DOMMatrix().translateSelf(W/2+cam.ox,H/2+cam.oy).scaleSelf(z,z).translateSelf(-cam.x,-cam.y);
  CAMM=new DOMMatrix([dpr,0,0,dpr,0,0]).multiplySelf(C);

function camEnd(ctx){

    ctx.fillStyle='rgba(255,252,244,'+a.toFixed(3)+')';ctx.fillRect(0,0,W,H)}
  if(cine.gbub)drawGiantBubble(ctx);

function addCrack(x,y,k){

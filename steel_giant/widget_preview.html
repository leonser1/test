SPR.trail=puffSprite('204,206,212',71);
function missilePos(M,u){return{x:M.x0+(M.x1-M.x0)*u,y:M.y0+(M.yE-M.y0)*Math.pow(Math.max(0,u),M.p)}}
function spawnBigMissile(t){
  const L=clamp(Math.min(W,H)*0.21,130,280),ms=t.boy&&boy.on?(boy.x>bot.x?-1:1):(Math.random()<0.5?-1:1);
  const x0=ms<0?-L*0.7:W+L*0.7,ui=0.5,xi=bot.x,y0=Math.max(16,H*0.05),yi=Math.max(H*0.17,107*SC+36);
  const p=Math.log((yi-y0)/(G-y0))/Math.log(ui);
  cine.M={x:x0,y:y0,u:0,ui,x0,x1:x0+(xi-x0)/ui,y0,yE:G,p,L,ang:0,tt:0,xi,yi,side:ms};
  bsfx('missileRoar',{x:x0});
}
function drawBigMissile(ctx,M){
  const L=M.L,rw=L*0.062,t0=-L*0.5,n0=L*0.5,fl=0.85+0.3*Math.random();
  ctx.save();ctx.translate(M.x,M.y);ctx.rotate(M.ang);ctx.lineJoin='round';
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.9;ctx.drawImage(SPR.fire,t0-L*0.62*fl,-rw*2.6,L*0.7*fl,rw*5.2);
  ctx.globalAlpha=1;ctx.fillStyle='rgba(255,248,220,.95)';ctx.beginPath();ctx.moveTo(t0,-rw*0.6);ctx.quadraticCurveTo(t0-L*0.12*fl,0,t0,rw*0.6);ctx.fill();
  sprite(ctx,SPR.glow,t0-rw*0.4,0,rw*3,0,0.95);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const fin=(s,far)=>{ctx.beginPath();ctx.moveTo(t0+L*0.2,s*rw*0.9);ctx.lineTo(t0+L*0.02,s*rw*3.1);ctx.lineTo(t0-L*0.03,s*rw*3.1);ctx.lineTo(t0+L*0.01,s*rw*0.9);ctx.closePath();
    ctx.fillStyle=far?'#3b4047':'#59616a';ctx.fill();ctx.strokeStyle='rgba(10,11,13,.85)';ctx.lineWidth=1.3;ctx.stroke()};
  fin(-1,true);
  const g=ctx.createLinearGradient(0,-rw,0,rw);g.addColorStop(0,'#8a929b');g.addColorStop(0.28,'#f4f7fa');g.addColorStop(0.55,'#b9c0c7');g.addColorStop(1,'#545b63');
  ctx.beginPath();ctx.moveTo(t0,-rw*0.85);ctx.lineTo(n0-L*0.17,-rw);ctx.quadraticCurveTo(n0-L*0.04,-rw*0.75,n0,0);ctx.quadraticCurveTo(n0-L*0.04,rw*0.75,n0-L*0.17,rw);ctx.lineTo(t0,rw*0.85);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(10,11,13,.85)';ctx.lineWidth=1.4;ctx.stroke();
  ctx.save();ctx.clip();
  ctx.fillStyle='#c8322c';ctx.fillRect(n0-L*0.17,-rw*1.2,L*0.2,rw*2.4);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(n0-L*0.17,-rw*0.75,L*0.14,rw*0.35);
  ctx.fillStyle='#24272c';ctx.fillRect(n0-L*0.3,-rw*1.2,L*0.025,rw*2.4);ctx.fillRect(t0+L*0.24,-rw*1.2,L*0.02,rw*2.4);
  ctx.fillStyle='rgba(0,0,0,.18)';for(let i=1;i<6;i++)ctx.fillRect(t0+L*0.11*i,-rw,1,rw*2);
  ctx.restore();
  ctx.fillStyle='#2a2d32';ctx.fillRect(t0-L*0.02,-rw*0.7,L*0.025,rw*1.4);
  fin(1,false);
  ctx.restore();
}
function cineEmbers(n,x,y,burst){
  for(let i=0;i<n&&cine.embers.length<220;i++){
    const a=Math.random()*6.28,v=burst?rand(60,420)*ds:rand(0,30)*ds,mx=burst?0:rand(-1,1)*W*0.42;
    cine.embers.push({x:x+mx,y:y+(burst?0:rand(-70,50)*ds),vx:Math.cos(a)*v,vy:Math.sin(a)*v-(burst?60*ds:0),life:0,max:rand(5,9.5),r:rand(1,2.6)*ds,ph:Math.random()*6.28,hot:rand(0.7,1)});
  }
}
function updateEmbers(dt){
  for(let i=cine.embers.length-1;i>=0;i--){const e=cine.embers[i];e.life+=dt;if(e.life>e.max){cine.embers.splice(i,1);continue}
    const dr=Math.min(1,dt*1.3);e.vx+=(Math.sin(e.ph+e.life*1.7)*22*ds-e.vx)*dr;e.vy+=(48*ds*e.hot-e.vy)*dr*0.8;
    e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y>G-1){e.y=G-1;e.vy=0;e.vx=0;e.life+=dt*1.5}}
}
function drawEmbers(ctx){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of cine.embers){const k=1-e.life/e.max,heat=Math.min(1,k*1.4)*(0.75+0.25*Math.sin(e.life*9+e.ph));
    sprite(ctx,k>0.55?SPR.glow:SPR.fire,e.x,e.y,e.r*4.5,0,0.85*heat);
    ctx.globalAlpha=Math.min(1,heat*1.2);ctx.fillStyle=k>0.6?'#fff4cc':'#ff9a40';ctx.fillRect(e.x-e.r*0.5,e.y-e.r*0.5,e.r,e.r)}
  ctx.restore();
}
function cinemaWorld(ctx){
  const any=cine.trail.length||cine.M||cine.embers.length||cine.eyes>0.01||cine.poseK>0.05||cine.streaks.length||cine.hope;
  if(!any)return;
  ctx.save();
  for(const q of cine.trail){const k=q.age/q.max,r=q.r0+(1-(1-k)*(1-k))*q.g;sprite(ctx,SPR.trail,q.x,q.y,r,0,0.85*(1-k)*Math.min(1,q.age*8))}
  ctx.globalAlpha=1;
  if(cine.M)drawBigMissile(ctx,cine.M);
  if(cine.streaks.length){ctx.lineCap='round';for(const s of cine.streaks){const a=1-s.t/s.max;ctx.strokeStyle='rgba(200,214,232,'+(0.6*a)+')';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y+s.len);ctx.stroke()}}
  ctx.globalCompositeOperation='lighter';
  if(!pieces&&bot.draw&&cine.poseK>0.05&&(bot.state==='fly'||bot.state==='launch')){
    for(const e of emitPts){const wx=e.p.x/dpr,wy=e.p.y/dpr,fl=(0.85+0.3*Math.random())*cine.poseK,L=130*ds*fl;
      ctx.globalAlpha=0.85;ctx.drawImage(SPR.fire,wx-15*ds,wy-14*ds,30*ds,L);sprite(ctx,SPR.glow,wx,wy+L*0.12,12*ds,0,0.9*cine.poseK);
      if(!paused&&Math.random()<0.6)spawn({k:'fire',x:wx+rand(-4,4)*ds,y:wy+L*0.5,vx:rand(-30,30),vy:rand(160,260)*ds,life:0.4,max:0.4,r:5*ds,grow:24*ds})}
  }
  if(cine.eyes>0.01&&!pieces&&bot.draw){
    const d=bot.draw,sx=Math.max(0.03,Math.abs(Math.cos(bot.vf*Math.PI))),pts=[];
    if(bot.vf>=0.5){for(const ex of [-7,7])pts.push([d.x+ex*SC*sx,d.y-170*SC,1])}
    else for(const e of [EYE_N,EYE_F]){const q=toWorld(e[0],e[1]);pts.push([d.x+(q.x-d.x)*sx,q.y,e===EYE_N?1:0.55])}
    const pu=0.9+0.1*Math.sin(cam.clock*5),r=13*SC*cine.eyes*pu;
    for(const p of pts){sprite(ctx,SPR.eye,p[0],p[1],r*1.6*p[2],0,0.9*cine.eyes);
      if(cine.eyes>0.4){ctx.globalAlpha=0.5*(cine.eyes-0.4)*p[2];ctx.drawImage(SPR.eye,p[0]-r*7,p[1]-r*0.22,r*14,r*0.44)}}
  }
  if(cine.hope&&pieces&&wreck&&wreck.stage==='gather'){
    ctx.lineCap='round';
    for(const p of pieces){const g=p.g;if(!g||g.done||wreck.t<g.s){p._px=p.x;p._py=p.y;continue}
      const px=p._px??p.x,py=p._py??p.y;p._px=p.x;p._py=p.y;
      ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,214,140,.55)';ctx.lineWidth=3*ds;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+(px-p.x)*6,p.y+(py-p.y)*6);ctx.stroke();
      sprite(ctx,SPR.glow,p.x,p.y,18*ds,0,0.75)}
  }
  ctx.restore();
  if(cine.embers.length)drawEmbers(ctx);
}

/* ---------- cinema: acts — knock on the screen, and the finale ("Супермен") ---------- */
function knockTask(){return{k:'knock',st:'prep',t:0,T:0,f:null}}
function finaleTask(){return{k:'finale',st:'prep',t:0,T:0,f:null}}
function cgo(t,st){t.st=st;t.t=0;t.f=null}
const KN_A=-1.7,KN_E=-2.58;
const SUPER={thighN:0.06,kneeN:0.12,thighF:-0.05,kneeF:0.24,armN:-2.95,elbowN:-0.06,armF:0.38,elbowF:-0.32,tilt:-0.02,point:1};
function cinemaPose(P){
  if(cine.poseK>0.001&&bot.state!=='broken'){const k=smooth(0,1,cine.poseK);for(const key in SUPER)P[key]+=(SUPER[key]-P[key])*k}
}
function cinemaThink(t,c,dt,busy){
  if(t.dead){if(task===t)task=null;return c}
  if(cine.task!==t){cine.task=t;if(t.k==='finale')cine.lastFinale=bot.clock;else cine.lastKnock=bot.clock}
  t.t+=dt;t.T+=dt;cine.shot=null;
  if(t.T>(t.k==='finale'?120:45)){task=null;return c}
  return t.k==='knock'?knockThink(t,c,dt,busy):finaleThink(t,c,dt,busy);
}
function knockShot(){
  const d=bot.draw,z=clamp(H*0.5/(150*SC),2.6,6.5);
  return{x:d.x,y:d.y-128*SC,z,lb:1,w:1.25};
}
function knockThink(t,c,dt,busy){
  const S=t.st;
  if(S==='prep'){
    if(!gReady(c,busy))return c;
    if(gWalk(c,clamp(bot.x,W*0.36,W*0.64),14))cgo(t,'turn');
  }else if(S==='turn'){
    bot.view=1;cine.eyesW=0.5;if(bot.vf>=1&&t.t>0.3)cgo(t,'near');
  }else if(S==='near'){
    bot.view=1;cine.shot=knockShot();cine.eyesW=1;
    const n=Math.floor((t.t-0.3)/0.75);
    if(t.t>0.3&&n<4&&n!==t.n){t.n=n;bsfx('step',{x:bot.x});camShake(2.5+n,0.3);cam.punch+=0.025}
    if(t.t>3.4)cgo(t,'look');
  }else if(S==='look'){
    bot.view=1;cine.shot=knockShot();cine.eyesW=1;
    cine.tiltW=t.t<1.7?0.2:-0.1;
    if(t.t>0.4&&once(t,'hm'))bsfx('giantCurious',{x:bot.x});
    if(t.t>3)cgo(t,'raise');
  }else if(S==='raise'){
    bot.view=1;cine.shot=knockShot();cine.tiltW=0.05;
    FRONT_ARM.a=KN_A;FRONT_ARM.e=KN_E;FRONT_ARM.want=1;bot.raise=FRONT_ARM.k>0.9?1:0;
    if(FRONT_ARM.k>0.98&&t.t>0.9)cgo(t,'knock');
  }else if(S==='knock'){
    bot.view=1;cine.shot=knockShot();
    const hits=[0.35,1.0,1.65];let e=KN_E;
    for(let i=0;i<hits.length;i++){const u=t.t-hits[i];
      if(u>-0.22&&u<0)e-=0.28*smooth(-0.22,-0.08,u);else if(u>=0&&u<0.18)e-=0.28*(1-smooth(0,0.03,u))+0.06*Math.sin(u/0.18*Math.PI);
      if(u>=0&&!(t.h>i)){t.h=i+1;knockHit(i)}}
    FRONT_ARM.a=KN_A;FRONT_ARM.e=e;FRONT_ARM.want=1;bot.raise=1;
    if(t.t>2.5)cgo(t,'after');
  }else if(S==='after'){
    bot.view=1;cine.shot=knockShot();cine.tiltW=t.t<1.4?-0.16:0.12;
    FRONT_ARM.a=KN_A;FRONT_ARM.e=KN_E;FRONT_ARM.want=t.t<1.2?1:0;bot.raise=FRONT_ARM.k>0.9?1:0;
    if(t.t>2.8)cgo(t,'back');
  }else if(S==='back'){
    cine.tiltW=0;cine.eyesW=0;FRONT_ARM.want=0;bot.raise=0;bot.view=t.t<1.4?1:0;
    if(t.t>1.4&&bot.vf<=0&&cam.z<1.03)task=null;
  }
  return c;
}
function knockHit(i){
  const p=camToScreen(handW.x,handW.y);
  addCrack(clamp(p.x+rand(-10,10),20,W-20),clamp(p.y+rand(-10,10),20,H-20),0.5+0.35*i);
  camShake(6+5*i,0.35);cam.punch=0.045+0.02*i;
  bsfx('knock',{x:handW.x});if(i>0)bsfx('crack',{x:handW.x});
  sparkle(handW.x,handW.y,6);
}
function finaleThink(t,c,dt,busy){
  const S=t.st,hasBoy=t.boy&&boy.on&&!boy.leaving;
  if(S!=='prep'&&S!=='impact'&&S!=='silence'&&S!=='hope')cine.alarmW=1;
  if(S==='prep'){
    if(!gReady(c,busy))return c;
    if(!gWalk(c,clamp(bot.x,W*0.32,W*0.68),14))return c;
    t.boy=boy.on&&!boy.leaving&&boy.mode==='ground';
    t.call=!t.boy&&window.GIANT_FIRST_FINALE!=='alone'&&(boyS.met||!!window.GIANT_FIRST_FINALE)&&Math.random()<0.85;
    cgo(t,'alarm');
  }else if(S==='alarm'){
    if(once(t,'s')){bsfx('siren',{x:W/2});if(t.boy)boyGo(clamp(bot.x+(boy.x>bot.x?1:-1)*85*ds,20,W-20),'run')}
    c.face=Math.sin(t.t*2.4)>0?1:-1;
    if(t.call&&t.t>0.3&&!t.boy){const side=bot.x<W/2?1:-1;boyS.met=true;boySpawn(side);boyGo(clamp(bot.x+side*85*ds,20,W-20),'run');boyDo('stand','open',1);t.boy=true}
    if(t.boy&&boy.on&&!boy.goal&&once(t,'q')){boy.look=null;boyDo('lookup','open',1);boySay('Что это?',1.8)}
    if(t.t>3.2&&(!t.boy||!boy.goal||t.t>4.2)){spawnBigMissile(t);cgo(t,'missile')}
  }else if(S==='missile'){
    const M=cine.M;if(!M){task=null;return c}
    c.face=M.x>bot.x?1:-1;
    if(M.u>0.09&&once(t,'p')){cine.eyesW=0.8;bsfx('giantNotice',{x:bot.x});
      if(hasBoy){boyDo('point','open',1);boySay('Ракета!',1.9);bsfx('boyGasp')}}
    if(hasBoy&&t.f&&t.f.p)boy.look=M.x;
    if(M.u>0.21)cgo(t,'decide');
  }else if(S==='decide'){
    cine.tsW=0.1;
    const d=bot.draw;
    if(hasBoy){c.face=boy.x>bot.x?1:-1;boy.look='g';if(once(t,'g'))boyDo('stand','open',1);
      const h=toWorld(HEAD_X,HEAD_Y-30);cine.shot=shotOf(h.x,h.y-30*ds,boy.x,G-4*ds,2.2,1,40*ds)}
    else{bot.view=1;cine.shot=shotOf(d.x,d.y-215*SC,d.x,d.y-70*SC,2.2,1,30*ds)}
    cine.shot.w=1.8;
    if(t.t>2.1&&once(t,'say')){cine.gbub={text:'Супермен.',t:0,max:2.9,w:null};bsfx('giantVoice',{x:bot.x})}
    if(t.t>5.3)cgo(t,'launch');
  }else if(S==='launch'){
    const M=cine.M;if(!M){task=null;return c}
    cine.tsW=1;bot.view=0;cine.eyesW=1;
    if(once(t,'go')&&hasBoy){boy.look='g';boyDo('lookup','open',1);bsfx('boyGasp')}
    if(bot.state==='ground'&&!busy&&bot.vf<=0.05)c.up=true;
    if(bot.state==='launch'||bot.state==='fly')cine.pose=1;
    const ch=botCenter(),dm=Math.hypot(M.x-ch.x,M.y-ch.y);
    if(bot.state==='fly'){
      if(once(t,'w'))bsfx('superman',{x:bot.x});
      t.v=Math.min(1500*ds,(t.v||0)+2800*ds*dt);
      const need=ch.y-M.yi;bot.alt=Math.min(maxAltNow(),bot.alt+Math.min(t.v*dt,Math.max(0,need)));bot.target=bot.alt;
      if(dm<360*ds)c.h=clamp((M.x-ch.x)/110,-1.6,1.6);
      if(Math.random()<dt*40){const q=toWorld(rand(-40,50),rand(-200,40));cine.streaks.push({x:q.x,y:q.y,len:rand(50,130)*ds,t:0,max:0.3})}
      if(M.u>M.ui-0.07&&need>45)cine.tsW=0.15;
    }
    cine.shot=bot.state==='fly'?{x:W/2,y:H/2,z:1,lb:1,w:3.2}:{x:ch.x,y:ch.y-20*ds,z:1.3,lb:1,w:2.6};
    if((M.u>=M.ui-0.01&&dm<75*ds)||M.u>=M.ui+0.06||t.t>9)finaleImpact(t);
  }else if(S==='impact'){
    cine.shot={x:W/2,y:H/2,z:1,lb:1};
    if(t.t>1.6)cgo(t,'silence');
  }else if(S==='silence'){
    cine.shot={x:W/2,y:H/2,z:1,lb:1};
    if(hasBoy){
      if(t.t>1.3&&once(t,'u')){boy.look=cine.ip?cine.ip.x:null;boyDo('lookup','open',0)}
      if(t.t>2.6&&once(t,'d'))boySay('…',2.4);
      if(t.t>5.8&&once(t,'n')){boyDo('kneel','sad',-1);boySay('Нет…',3.2);bsfx('boyCry')}
      if(t.f&&t.f.n&&Math.random()<dt*2.4)boyFx('tear',boy.ex,boy.ey);
      if(t.t>5.2&&t.t<9.6)cine.shot=Object.assign(shotOf(boy.x,G-110*ds,boy.x,G,1.9,1,30*ds),{w:1.2});
    }
    if(t.t>(hasBoy?10.8:7))startHope(t);
  }else if(S==='hope'){
    cine.shot={x:W/2,y:H/2,z:1,lb:1};
    if(wreck&&wreck.stage==='gather'&&wreck.t>4.6)cine.shot=Object.assign(shotOf(wreck.ax,G-190*SC,wreck.ax,G,1.45,1),{w:1.4});
    if(hasBoy&&wreck&&pieces){
      if(pieces.some(p=>p.g&&wreck.t>p.g.s+p.g.d*0.6)&&once(t,'see')){boy.look=wreck.ax;boyDo('gasp','open',1);boy.brow=1;bsfx('boyGasp')}
      if(wreck.eyes&&once(t,'back')){boy.look=wreck.ax;boyDo('jump','grin',1);boySay('Ты вернулся!!',2.8);bsfx('boyCheer');boy.mourned=true}
    }
  }
  return c;
}
function finaleImpact(t){
  const M=cine.M,ch=botCenter(),ix=(M.x+ch.x)/2,iy=(M.y+ch.y)/2;
  cine.ip={x:ix,y:iy};cine.flash=cine.flashMax=1.2;cine.ring={x:ix,y:iy,t:0,max:1.9};
  explosion(ix,iy,2.6*ds);for(let i=0;i<3;i++)explosion(ix+rand(-70,70)*ds,iy+rand(-50,50)*ds,rand(0.8,1.4)*ds);
  for(let i=0;i<34;i++)spawn({k:'debris',x:ix+rand(-20,20)*ds,y:iy+rand(-20,20)*ds,vx:rand(-520,520)*ds,vy:rand(-380,80)*ds,life:rand(3,5),max:5,r:rand(1.6,4.4)*ds,grow:0,a:Math.random()*6,va:rand(-14,14)});
  cineEmbers(90,ix,iy,true);cine.emberT=4.5;
  pieces=[];wreck={stage:'cinema',t:0,dir:bot.dir,eyes:0};
  Object.assign(bot,{state:'broken',vx:0,armAim:0,armGun:0,turret:0,eyeCharge:0,hit:0,view:0,vf:0,raise:0});
  cine.vanished=true;cine.M=null;cine.alarmW=0;cine.alarm*=0.4;cine.pose=0;cine.poseK=0;cine.eyesW=0;cine.eyes=0;cine.gbub=null;cine.tsW=cine.ts=1;cine.streaks.length=0;
  camShake(24,1.2);
  bsfx('bigboom',{x:ix});bsfx('impact',{x:ix});
  if(boy.on&&t.boy){boy.bub=null;boyDo('cower','open',1)}
  cgo(t,'impact');
}
function startHope(t){
  const st=walkPose(0,0,bot.clock);st.blink=1;
  let gx=clamp(cine.ip?cine.ip.x:W/2,W*0.22,W*0.78);
  if(t.boy&&boy.on&&Math.abs(gx-boy.x)<150*ds){const s=gx>=boy.x?1:-1;gx=boy.x+s*170*ds;if(gx<W*0.12||gx>W*0.88)gx=boy.x-s*170*ds}
  const dir=t.boy&&boy.on?(boy.x>gx?1:-1):bot.dir;
  const y=G-Math.max(footDrop(st.thighN,st.kneeN,st.tilt),footDrop(st.thighF,st.kneeF,st.tilt))*SC;
  const tg=capturePose(st,gx,y,dir);
  for(const q of tg){

    if(!r)world.wins.set(w.id,{x:w.x,y:w.y,mt:-1e9});else if(r.x!==w.x||r.y!==w.y){r.x=w.x;r.y=w.y;r.mt=now}}

      if(bot.x<-150||bot.x>W+150){Object.assign(bot,{state:'ground',alt:0,target:0,vx:0,t:0,amp:0,x:t.side<0?-330:W+330});wReset();t.st='wait';t.q=0}
    }else{
      c.h=0;
      if(!PC.fullscreenApp){t.q+=dt;if(t.q>1.5){task=null;arrive()}}else t.q=0;

function wPeekEnd(){world.virt=null;world.clip=null;if(world.sup&&world.sup.virt){world.sup=null;if(bot.state==='ground'||bot.state==='land'||bot.state==='launch'){bot.state='fly';bot.t=0;bot.ramp=1;bot.target=bot.alt}}}
/* next hop: another window top within reach, or (down=true / nothing else) the taskbar beside the window */
function pickHop(down){
  const a0=bot.alt,x0=bot.x,cur=world.sup?world.sup.id:null,cands=[];
  if(!down)for(const s of perchSegs(80*ds)){
    if(s.id===cur)continue;const w=winById(s.id);if(!w)continue;
    const x=clamp(x0,s.x0+34*ds,s.x1-34*ds),dist=Math.abs(x-x0),a1=G-s.y;
    if(dist<50*ds||dist>620*ds||Math.abs(a1-a0)>460*ds)continue;
    cands.push({id:s.id,rx:x-w.x,x1:x,a1,wt:1/(1+dist/(300*ds))});
  }
  if(cands.length){let sum=0;for(const c of cands)sum+=c.wt;let r=Math.random()*sum;for(const c of cands)if((r-=c.wt)<=0)return c;return cands[0]}
  if(!world.sup)return null;
  const clear=x=>!world.segs.some(s=>x>=s.x0-34*ds&&x<=s.x1+34*ds);
  for(let i=0;i<14;i++){const x=clamp(x0+(Math.random()<0.5?-1:1)*rand(110,340)*ds,60,W-60);if(clear(x))return{id:null,x1:x,a1:0}}
  return{id:null,x1:clamp(x0+bot.dir*220*ds,60,W-60),a1:0};
}

/* ---------- world: cursor — the giant looks at it, reaches for it, tries to catch it, puffs steam at it ---------- */
const LOOKABLE={idle:1,wave:1,walk:1,perch:1,peek:1,night:1,edge:1,parkour:1,look:1};
const CURIOUS={idle:1,wave:1,walk:1,perch:1,night:1,edge:1};
function wLook(c,dt){
  let want=world.hlWant!=null?world.hlWant:0,fx=0,fy=0;
  const ok=world.cx>-1000&&!pieces&&bot.draw&&bot.state!=='broken'&&!world.whoa&&task&&(LOOKABLE[task.k]||world.lookOK);
  if(ok&&!world.dozing){
    const front=bot.vf>=0.5,hp=front?{x:bot.x,y:bot.draw.y-170*SC}:eyeAt(EYE_N,bot.lastP);
    const dx=world.cx-hp.x,dy=world.cy-hp.y,dist=Math.hypot(dx,dy),recent=wNow()-world.cmove<2500;
    if(dist<(recent?340:180)*ds){
      if(!front){
        if(dx*bot.dir>6*ds){const dl=toLocalVec(dx,dy);want=clamp(Math.atan2(dl.y,Math.max(1,dl.x))*0.75,-0.45,0.34)}
        else if(world.turnOK&&recent&&Math.abs(c.h)<0.15&&!c.faceForce&&bot.state==='ground')c.face=dx>0?1:-1;
      }else{fx=clamp(dx/(90*ds),-1,1)*2.4;fy=clamp(dy/(90*ds),-1,1)*1.8}
    }
    world.linger=dist<200*ds&&world.cspd<600*ds?world.linger+dt:Math.max(0,world.linger-dt*2);
  }else world.linger=0;
  world.hl+=(want-world.hl)*Math.min(1,dt*5);
  LOOKF.x+=(fx-LOOKF.x)*Math.min(1,dt*6);LOOKF.y+=(fy-LOOKF.y)*Math.min(1,dt*6);
}
function wCurious(c,dt){
  let q=world.cur;
  const can=task&&(CURIOUS[task.k]||world.lookOK)&&bot.state==='ground'&&bot.vf<0.05&&!world.whoa&&!pieces&&!world.dozing&&bot.draw&&!(world.sup&&world.sup.virt)&&Math.abs(c.h)<0.15;
  if(!q){
    if(!can||world.linger<1.8||wNow()<world.curCD||world.cx<-1000)return;
    const dx=world.cx-bot.x;
    if(dx*bot.dir<0){c.face=dx>0?1:-1;return}
    const sw=toWorld(2,R.shoulderY),dd=Math.hypot(world.cx-sw.x,world.cy-sw.y),reachable=dd<(R.upper+R.fore+13)*SC*1.25;
    q=world.cur={m:reachable&&Math.random()<0.65?'reach':'puff',t:0,x:world.cx,y:world.cy,ph:0};
  }
  if(!can&&q.m!=='swipe'){wCurEnd();return}
  q.t+=dt;c.h=0;
  const cdx=world.cx-bot.x;if(q.m!=='huh'&&Math.abs(cdx)>10*ds)c.face=cdx>0?1:-1;
  const k=Math.min(1,dt*3);q.x+=(world.cx-q.x)*k;q.y+=(world.cy-q.y)*k;
  const hd=Math.hypot(world.cx-handW.x,world.cy-handW.y);
  if(q.m==='reach'){
    world.hlWant=null;
    if(q.t>0.4){reach.want=1;reach.rate=1.4;reach.lx=null;reach.x=q.x;reach.y=q.y}
    if(q.t>1.0&&(hd<18*ds||q.t>4.5)){q.m='swipe';q.t=0;q.sx=world.cx+bot.dir*24*ds;q.sy=world.cy+8*ds;wsfx('catchCursor',{x:bot.x})}
    else if(q.t>1.0&&(world.cspd>900*ds||hd>260*ds)){q.m='huh';q.t=0}
  }else if(q.m==='swipe'){
    reach.want=1;reach.rate=9;reach.lx=null;reach.x=q.sx;reach.y=q.sy;
    if(q.t<0.05)addFx({k:'streak',x:handW.x,y:handW.y,len:40*ds,dir:bot.dir,life:0.25,max:0.25});
    if(q.t>0.35){q.m='huh';q.t=0}
  }else if(q.m==='huh'){
    reach.want=q.t<1.9?1:0;reach.rate=3;reach.lx=46;reach.ly=-150;world.hlWant=0.22;
    if(q.t>0.3&&!q.qm){q.qm=1;world.q=1.8}
    if(q.t>2.2)wCurEnd();
  }else if(q.m==='puff'){
    world.hlWant=q.t<0.45?-0.24:0.05;
    if(q.t>0.45&&!q.done){q.done=1;const p=toWorld(HEAD_X+15,HEAD_Y-9),a=Math.atan2(world.cy-p.y,world.cx-p.x);
      for(let i=0;i<20;i++){const aa=a+(Math.random()-0.5)*0.35,v=(170+Math.random()*190)*ds;
        spawn({k:'smoke',x:p.x,y:p.y,vx:Math.cos(aa)*v,vy:Math.sin(aa)*v,life:0.8+Math.random()*0.6,max:1.4,r:3.2*ds,grow:26*ds,tn:3})}
      wsfx('puff',{x:p.x})}
    if(q.t>1.7)wCurEnd();
  }
}
function wCurEnd(){world.cur=null;world.curCD=wNow()+rand(9000,15000);world.linger=0}
/* the boy turns to the cursor, and sometimes waves at it */
function wBoyCursor(dt){
  if(!boy.on)return;
  world.boyWaveCD-=dt;
  if(world.boyWaveT>0){world.boyWaveT-=dt;if(world.boyWaveT<=0&&boy.act==='wave'&&!boy.leaving)boyDo('stand')}
  if(boy.mode!=='ground'||boy.goal||boy.leaving||boy.seat||(boy.act!=='stand'&&boy.act!=='wave')||world.cx<-1000)return;
  const d=Math.hypot(world.cx-boy.x,world.cy-(boy.y-14*ds)),recent=wNow()-world.cmove<1500;
  if(d<160*ds&&recent){boy.dir=world.cx>boy.x?1:-1;world.boyCurT+=dt}else world.boyCurT=Math.max(0,world.boyCurT-dt);
  if(world.boyCurT>1.6&&world.boyWaveCD<=0&&boy.act==='stand'&&!boy.bub){world.boyWaveCD=25;world.boyWaveT=1.8;boyDo('wave','grin',1);boySay(pick(['Привет, стрелочка!','Эй, курсор!']),1.8)}
}

/* ---------- world: think hook — whoa, fullscreen, ground-only scenes, cursor (wraps think) ---------- */
const _wThink=think;
think=function(dt){
  wTick(dt);
  world.sitW=0;world.turnOK=false;world.lookOK=false;world.dozing=false;world.nightW=0;world.hlWant=null;
  let c;
  const brk=pieces||bot.state==='broken';
  if(world.whoa&&!brk){
    battleOn=false;bot.view=0;c={h:0,up:false,alt:0,face:0,faceForce:0};
    if(bot.state==='fly'&&world.whoa.t<0.5)c.alt=null;
  }else{
    /* a fullscreen app: politely leave and wait (the story pauses) */
    const tk=task&&task.k;
    if(PC.fullscreenApp&&!brk&&tk!=='away'&&tk!=='battle'&&tk!=='broken'&&tk!=='victory'&&!(tk==='boy'&&task.acts[task.i]==='drop')){
      if(tk==='chase')endChase(task);
      if(world.virt)wPeekEnd();
      resetGiantStory();
      if(boyMounted()){task=boyTask(['drop']);queue=[{k:'away',st:'go',t:0}]}
      else{if(boy.on)boyLeave(true);task={k:'away',st:'go',t:0};queue=[]}
    }
    if(world.virt&&!(task&&task.k==='peek'))wPeekEnd();
    if(!task)task=directorNext();
    if(task&&WT[task.k]){
      battleOn=false;bot.view=0;c={h:0,up:false,alt:null,face:0,faceForce:0};
      WT[task.k](task,c,dt,bot.state==='launch'||bot.state==='land');
    }else{
      if(task&&task.k==='walk'&&world.sup&&!task.wc){const w=winById(world.sup.id);task.wc=1;if(w)task.x=clamp(task.x,w.x+30*ds,w.x+w.w-30*ds)}
      if(task&&(task.k==='idle'||task.k==='wave'))world.turnOK=true;
      /* a fly waypoint below the window top he is flying over: hover above that window instead of landing on it */
      if(task&&task.k==='fly'&&task.pts&&bot.state==='fly'){const p=task.pts[Math.min(task.i,task.pts.length-1)];if(p&&p.alt>0&&world.fl>p.alt-15)p.alt=world.fl+40*ds}
      c=_wThink(dt);
    }
    /* scenes that need the taskbar ground: jump down from the window first */
    if(needsGround()&&!brk){
      if(bot.state==='ground'&&world.sup){c.up=true;c.h=0;world.hopDown=true}
      else if(world.hopDown&&bot.state==='fly')c.alt=0;
    }
    if(bot.state==='ground'&&!world.sup)world.hopDown=false;
    if(world.surf>0.3&&bot.state==='ground'&&world.sup)c.h=0;
    if(!brk){wCurious(c,dt);wLook(c,dt)}
  }
  const sitOK=bot.state==='ground'&&world.sup&&!world.sup.virt;
  world.sitK+=clamp((world.sitW&&sitOK?1:0)-world.sitK,-dt*(sitOK?0.9:6),dt*0.8);
  world.surf+=clamp((world.surfW&&world.sitK<0.2?1:0)-world.surf,-dt*1.5,dt*3);
  world.nightK+=clamp(world.nightW-world.nightK,-dt*0.25,dt*0.5);
  return c;
};

/* ---------- world: director hook — windows, the PC's rhythm, night (wraps directorNext and boyVisit) ---------- */
function wFilter(t,o){
  if(!t)return t;
  const k=t.k,leave=k==='fly'&&t.pts&&t.pts[0].tp!=null,explore=k==='walk'||k==='idle'||k==='wave'||k==='look'||(k==='fly'&&!leave);
  if((o.busy||o.night)&&(k==='battle'||k==='chase'||leave))return o.night?nightTask():edgeTask();
  if(o.busy&&k==='fly'&&Math.random()<0.6)return edgeTask();
  if(o.busy&&explore&&Math.random()<0.3)return edgeTask();
  if(explore&&!o.night){
    if(Math.random()<(o.busy?0.25:0.55)){const w=worldTask(o.busy);if(w)return w}
    if(o.show&&!o.busy){if(Math.random()<0.35&&bot.clock-story.lastBattle>25)return battleTask();if(Math.random()<0.25&&bot.clock-story.lastChase>25)return chaseTask()}
  }
  return t;
}
const _wDirectorNext=directorNext;
directorNext=function(){
  if(queue.length||(boyS.resume&&!pieces))return _wDirectorNext();
  const o={night:wNight(),busy:wBusy(),show:wIdleShow()};
  if(o.night&&Math.random()<0.85)return nightTask();
  return wFilter(_wDirectorNext(),o);
};
const _wBoyVisit=boyVisit;
boyVisit=function(force){
  if(!force&&wNight())return null;   /* the boy is asleep at night */
  const v=_wBoyVisit(force);if(!v)return v;
  if(wBusy()&&v.acts.includes('danger'))v.acts=['greet','play','bye'];
  else if(!force&&v.acts[0]==='greet'&&!wBusy()&&perchSegs(150*ds).length&&Math.random()<0.5)v.acts=['greet','pickup','perch','putdown','bye'];
  return v;
};
const _wArrive=arrive;
arrive=function(){wReset();return _wArrive()};
const _wUpdateBoy=updateBoy;
updateBoy=function(dt){_wUpdateBoy(dt);wBoyCursor(dt)};
/* the boy's seat on a window top */
const _wBoyMountPos=boyMountPos;
boyMountPos=function(kind){

/* ---------- world: the boy's act on a window top — lifted up there, they sit side by side, legs dangling ---------- */
BACT.perch=function(t,c,dt,busy){
  const S=t.st,w=t.pid!=null?winById(t.pid):null;
  if(S!=='start'&&S!=='lost'&&S!=='down'&&(!w||w.max)){if(boy.mode==='mount'&&boy.mount==='ledge')boyFall();world.ledge=null;bgo(t,'lost');return}
  if(S==='start'){
    if(boyNeed(t,'shoulder'))return;if(boy.mode!=='mount')return;if(!gReady(c,busy))return;
    const ps=perchSegs(150*ds);if(!ps.length){nextAct(t);return}
    const s=pick(ps),ww=winById(s.id);t.pid=s.id;t.rx=clamp(bot.x,s.x0+70*ds,s.x1-70*ds)-ww.x;
    boyDo('point','grin',1);boySay(pick(['Давай туда, на окно!','А на окне можно посидеть?']),2.2);bsfx('boyTalk');bgo(t,'up');
  }else if(S==='up'){
    gk.rideW=1;
    if(t.t<1.4)return;
    if(bot.state==='ground'){if(world.sup&&world.sup.id===t.pid&&!busy){bgo(t,'land');return}if(!busy)c.up=true;return}
    if(bot.state!=='fly')return;
    perchFly(t,c,w);
    if(t.t>18)bgo(t,'down');
  }else if(S==='land'){
    if(once(t,'l')){boyDo('cheer','grin',1);boySay('Ух ты! Мы на окне!',2);bsfx('boyCheer')}
    if(t.t>1.8){t.d=(w.x+w.w-bot.x)>(bot.x-w.x)?1:-1;bgo(t,'reach')}
  }else if(S==='reach'){
    c.face=t.d;reach.want=1;reach.rate=2;reach.lx=46;reach.ly=-140;
    if(t.t>1.1&&once(t,'h')){boyHop('hand',0.5,10);boyDo('hold','smile',1)}
    if(t.f&&t.f.h&&boy.mode==='mount'&&boy.mount==='hand'){t.lf={x:handW.x,y:handW.y};bgo(t,'lower')}
    if(t.t>6)bgo(t,'lower');
  }else if(S==='lower'){
    c.face=t.d;const lx=clamp(bot.x+t.d*64*ds,w.x+10*ds,w.x+w.w-10*ds),ly=w.y-5*ds,e=smooth(0,1.6,t.t);
    if(!t.lf)t.lf={x:handW.x,y:handW.y};
    reach.want=1;reach.rate=3;reach.lx=null;reach.x=t.lf.x+(lx-t.lf.x)*e;reach.y=t.lf.y+(ly-t.lf.y)*e;
    if(t.t>1.8&&once(t,'o')){world.ledge={id:t.pid,rx:lx-w.x,dir:t.d};boyHop('ledge',0.45,6);boyDo('sit','grin',1)}
    if(t.f&&t.f.o&&boy.mode==='mount'&&boy.mount==='ledge')bgo(t,'sit');
    if(t.t>6)bgo(t,'sit');
  }else if(S==='sit'){
    c.face=t.d;world.sitW=1;world.lookOK=true;world.turnOK=false;reach.want=0;
    if(world.sitK>0.5&&once(t,'sd'))wsfx('sitDown',{x:bot.x});
    if(t.t>2&&once(t,'a')){boySay(pick(['Отсюда всё видно!','Это твоя новая скамейка?']),2.4);bsfx('boyTalk')}
    if(t.t>5.5&&once(t,'b')){boyDo('laugh','grin',1);bsfx('boyLaugh')}
    if(t.t>7&&once(t,'b2'))boyDo('sit','smile',0);
    const cd=Math.hypot(world.cx-boy.x,world.cy-boy.y);
    if(t.t>3&&cd<240*ds&&wNow()-world.cmove<1200&&once(t,'cur')){boyDo('point','grin',1);boySay('Смотри, стрелочка!',2);bsfx('boyGasp');t.ct=t.t}
    if(t.ct!=null&&t.t-t.ct>2.2&&once(t,'cur2'))boyDo('sit','grin',1);
    if(t.t>(t.ct!=null?15:12))bgo(t,'getup');
  }else if(S==='getup'){
    c.face=t.d;
    if(t.t>1.2){const lp=boyMountPos('ledge');reach.want=1;reach.rate=2;reach.lx=null;reach.x=lp.x-t.d*3*ds;reach.y=lp.y+3*ds}
    if(t.t>2.6&&once(t,'h')){boyHop('hand',0.45,6);boyDo('hold','grin',1)}
    if(t.f&&t.f.h&&boy.mode==='mount'&&boy.mount==='hand'){world.ledge=null;t.lf={x:handW.x,y:handW.y};bgo(t,'lift')}
    if(t.t>8){world.ledge=null;bgo(t,'down')}
  }else if(S==='lift'){
    c.face=t.d;liftTo(t,48,-168,1.6);
    if(t.t>1.9&&once(t,'s')){boyHop('shoulder',0.5,8);boyDo('sit','grin',1)}
    if(t.f&&t.f.s&&boy.mode==='mount'&&boy.mount==='shoulder'){reach.want=0;if(t.t>2.6)bgo(t,'down')}
    if(t.t>7)bgo(t,'down');
  }else if(S==='down'){
    gk.rideW=boy.mode==='mount'?1:0;
    if(bot.state==='ground'&&!world.sup){if(!busy&&once(t,'d'))boySay('Ещё полетаем?',1.6);if(t.t>1.6&&!busy)nextAct(t);return}
    if(bot.state==='fly'){c.alt=0;c.h=0}
  }else if(S==='lost'){
    world.ledge=null;
    if(bot.state==='ground'&&!busy&&!world.whoa&&(!boy.on||boy.mode==='ground'||boy.mode==='mount')){
      if(once(t,'x')){if(boy.mode==='ground')boyDo('stand','open',1);boySay('Ой! Окно пропало!',2);bsfx('boyGasp')}
      if(t.t>2.6)nextAct(t);
    }
  }
};

/* ---------- world: overlay drawing (stars at night, eye flare, Z-z-z, "?") — wraps drawStory ---------- */
function worldDraw(ctx){
  const T=bot.clock;
  if(world.nightK>0.01){
    if(!world.stars||world.stars.W!==W||world.stars.G!==G){const st=[];let sd=7;const rn=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
      for(let i=0;i<46;i++)st.push({x:rn()*W,y:8+rn()*G*0.42,r:0.6+rn()*1.3,f:0.6+rn()*2.2,p:rn()*6.28});st.W=W;st.G=G;world.stars=st}
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(const s of world.stars){const a=world.nightK*(0.25+0.6*(0.5+0.5*Math.sin(T*s.f+s.p)));
      sprite(ctx,SPR.glow,s.x,s.y,s.r*4.5,0,a*0.55);ctx.globalAlpha=a;ctx.fillStyle='#fff8e0';ctx.fillRect(s.x-s.r*0.5,s.y-s.r*0.5,s.r,s.r)}

    if(k>0){ctx.save();ctx.globalCompositeOperation='lighter';
      for(const e of [EYE_N,EYE_F]){const p=eyeAt(e,bot.lastP);sprite(ctx,SPR.eye,p.x,p.y,(e===EYE_N?20:14)*ds*k,0,0.95*k);sprite(ctx,SPR.glow,p.x,p.y,(e===EYE_N?7:5)*ds*k,0,0.8*k)}
      ctx.restore()}
  }
  if(world.zs.length||world.q>0){
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    for(const z of world.zs){const a=Math.min(1,z.t*3)*(1-smooth(1.4,2.2,z.t)),fs=Math.round((z.big?13:10)*ds*(0.7+0.4*z.t));
      ctx.globalAlpha=a;ctx.font='bold '+fs+'px "Comic Sans MS","Segoe Print","Trebuchet MS",sans-serif';
      ctx.lineWidth=3;ctx.strokeStyle='rgba(20,24,40,.65)';ctx.strokeText('z',z.x,z.y);ctx.fillStyle='#dfe9ff';ctx.fillText('z',z.x,z.y)}
    if(world.q>0&&bot.draw){const p=toWorld(HEAD_X+4,HEAD_Y-66),a=Math.min(1,world.q*3)*Math.min(1,(1.8-world.q)*6+0.2),fs=Math.round(20*ds);
      ctx.globalAlpha=Math.max(0,a);ctx.font='bold '+fs+'px "Comic Sans MS","Segoe Print","Trebuchet MS",sans-serif';
      const yy=p.y-Math.sin(Math.min(1,(1.8-world.q)*4)*Math.PI*0.5)*6*ds;
      ctx.lineWidth=4;ctx.strokeStyle=BC.ink;ctx.strokeText('?',p.x,yy);ctx.fillStyle='#fff';ctx.fillText('?',p.x,yy)}
    ctx.restore();
  }
}
const _wDrawStory=drawStory;

/* ---------- showcase: plays the new scenes one after another (tray «Показать всё новое», first launch) ---------- */
const SHOW=[['perch',22],['knock',24],['peek',16],['boy',0],['finale',70]];
let showT=null;
function showcase(){
  clearTimeout(showT);let i=0;
  const busy=()=>task&&(task.k==='battle'||task.k==='broken'||task.k==='victory')||(typeof cine!=='undefined'&&cine.task);
  const step=()=>{
    if(i>=SHOW.length)return;
    if(busy()){showT=setTimeout(step,2000);return}
    const [k,dur]=SHOW[i++];
    if(k==='perch'||k==='peek'){if(!(window.PC&&PC.windows&&PC.windows.length)){step();return}window.__giant.world(k)}
    else if(k==='boy'){if(window.PC&&PC.windows&&PC.windows.length)window.__giant.world('boy');else startBoy('ride');showT=setTimeout(step,45000);return}
    else startCinema(k);
    showT=setTimeout(step,dur*1000);
  };
  step();
}

  else{FILL.eye=bot.eyeCharge>0.3?'#ffd2b0':'#ffc233';EYE_GLOW=bot.eyeCharge>0.3?'#ff3a1a':'#ffae00'}

<script>
(()=>{
  const G=window.__giant,wins=[];let n=0;
  function feed(){window.__pc&&window.__pc.setWindows(wins.filter(w=>w.el.isConnected).map(w=>{const r=w.el.getBoundingClientRect();return{id:w.id,x:r.left,y:r.top,w:r.width,h:r.height}}))}
  function addWin(x,y,w,h,title,text){
    const id='w'+(++n),el=document.createElement('div');el.className='fw';
    el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    el.innerHTML='<div class="bar"><span></span><button class="x" aria-label="Закрыть окно">×</button></div><div class="body"></div>';
    el.querySelector('.bar span').textContent=title;el.querySelector('.body').textContent=text;
    document.body.appendChild(el);const rec={id,el};wins.push(rec);
    const bar=el.querySelector('.bar');let drag=null;
    bar.addEventListener('pointerdown',e=>{if(e.target.closest('.x'))return;drag={dx:e.clientX-el.offsetLeft,dy:e.clientY-el.offsetTop};bar.setPointerCapture(e.pointerId);
      wins.forEach(o=>o.el.style.zIndex=1);el.style.zIndex=2;wins.splice(wins.indexOf(rec),1);wins.unshift(rec);feed()});
    bar.addEventListener('pointermove',e=>{if(!drag)return;el.style.left=Math.max(-w+60,Math.min(innerWidth-60,e.clientX-drag.dx))+'px';el.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-drag.dy))+'px';feed()});
    const end=()=>{drag=null};bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);
    el.querySelector('.x').addEventListener('click',()=>{el.remove();wins.splice(wins.indexOf(rec),1);feed()});
    feed();
  }
  const W=innerWidth,H=innerHeight,s=Math.min(1,W/1300);
  addWin(Math.round(W*0.08),Math.round(H*0.42),Math.round(480*s),Math.round(300*s),'Заметки','Список дел: купить батарейки, починить радио, не говорить никому про гиганта.');
  addWin(Math.round(W*0.56),Math.round(H*0.26),Math.round(440*s),Math.round(360*s),'Проводник','Документы · Загрузки · Рабочий стол');
  addEventListener('resize',feed);
  const on=(id,f)=>document.getElementById(id).addEventListener('click',f);
  on('bShow',()=>G.showcase());on('bBoy',()=>G.boy());
  setTimeout(()=>G.showcase(),9000);on('bFinale',()=>G.finale());on('bKnock',()=>G.knock());on('bChase',()=>G.chase());on('bBattle',()=>G.battle());on('bSummon',()=>G.summon());
  on('bWin',()=>addWin(Math.round(Math.random()*(W-420)),Math.round(H*0.2+Math.random()*H*0.4),Math.round(380*s),Math.round(240*s),'Окно','Новое окно для гиганта.'));
})();
